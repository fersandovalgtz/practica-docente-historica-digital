name: Retrieve PDHD P4 HathiTrust title-page window

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrieve-p4-hathitrust-title-page.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve primary HathiTrust page windows
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request

          items = {
              "cornell": "coo.31924021048594",
              "uc": "uc1.b3128137",
          }
          seqs = range(1, 13)
          out = pathlib.Path("p4-hathitrust-title-page")
          out.mkdir()
          report = []

          for label, item_id in items.items():
              for seq in seqs:
                  url = (
                      "https://babel.hathitrust.org/cgi/imgsrv/image?"
                      f"id={item_id};seq={seq};size=1800;rotation=0"
                  )
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": (
                              "PDHD-U1-source-verification/0.1 "
                              "(+https://github.com/fersandovalgtz/practica-docente-historica-digital)"
                          )
                      },
                  )
                  row = {"label": label, "item_id": item_id, "seq": seq, "url": url}
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          body = response.read()
                          ctype = response.headers.get("Content-Type", "")
                          status = response.status
                      row.update({"status": status, "content_type": ctype, "bytes": len(body)})
                      if status == 200 and ctype.startswith("image/") and len(body) > 10000:
                          suffix = ".jpg" if "jpeg" in ctype else ".img"
                          path = out / f"{label}_{item_id.replace('.', '_')}_seq{seq:03d}{suffix}"
                          path.write_bytes(body)
                          row["saved"] = path.name
                      else:
                          row["saved"] = None
                  except Exception as exc:
                      row.update({"error": f"{type(exc).__name__}: {exc}", "saved": None})
                  report.append(row)

          (out / "retrieval-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          saved = [row for row in report if row.get("saved")]
          print(f"Saved {len(saved)} HathiTrust page images across two full-view copies")
          if not saved:
              raise SystemExit("No auditable HathiTrust page image was recovered")

      - name: Upload one-day primary-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-p4-hathitrust-title-page-review
          path: p4-hathitrust-title-page/
          retention-days: 1
          if-no-files-found: error
