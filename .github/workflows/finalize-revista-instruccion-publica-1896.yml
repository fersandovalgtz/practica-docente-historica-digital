name: Finalize Revista Instruccion Publica 1896 batch

on:
  push:
    branches: [freeze-revista-instruccion-publica-1896]
    paths:
      - ".github/workflows/finalize-revista-instruccion-publica-1896.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localize gaps and freeze F29-F32 from direct HNDM images
        shell: python
        run: |
          import csv,pathlib,re
          root=pathlib.Path('.')
          samples=root/'data/samples'
          checked='2026-09-06'
          direct={
            'PDHD-F000029':{
              'slot':'A','page':'12',
              'source_locator':'p12-sordomudos-lengua-alfabeto-manual-pronunciacion',
              'url':'https://hndm.iib.unam.mx/consulta/publicacion/pdf/558a330d7d1ed64f168f479d.pdf?coleccion=&palabras=',
              'role':'explicit_pedagogical_act',
              'boundary':"Printed p. 12, under Escuela de Sordo-Mudos, article 17: fix only the first instructional clause beginning with the written Spanish-language subject and continuing through its prescribed expression by manual alphabet and conditional pronunciation when aptitude is present; stop before the following catechism/geography/history subjects.",
              'note':"Direct HNDM primary-image inspection fills the former slot-A gap. The selected non-overlapping clause in article 17 prescribes a concrete language-teaching mode for the Escuela de Sordo-Mudos: written Spanish expressed through the manual alphabet, with pronunciation when the pupil is considered apt. The span is fixed only to that instructional clause and excludes the following curricular list. No historical text or page image is committed.",
            },
            'PDHD-F000030':{
              'slot':'B','page':'31',
              'source_locator':'p31-docente-renuncia-sustitucion-correa-tuchs',
              'url':'https://hndm.iib.unam.mx/consulta/publicacion/pdf/558a330d7d1ed64f168f47b0.pdf?coleccion=&palabras=',
              'role':'institutional_relation',
              'boundary':"Printed p. 31, right-column NOTAS: fix the complete notice beginning with Dolores Correa Zapata's position as subdirectora of the primary school attached to the Normal para Profesoras, continuing through her resignation effective 29 February, and ending with the appointment of Emilia Tuchs as her replacement; stop at the rule before the following personnel notice.",
              'note':"Direct HNDM inspection confirms the earlier INEHRM secondary pointer. Printed p. 31 contains a discrete personnel notice documenting the resignation of Dolores Correa Zapata from the primary school attached to the Normal para Profesoras and the appointment of Emilia Tuchs in her place. The exact notice is now image-verified and bounded; the secondary citation is superseded as freeze evidence.",
            },
            'PDHD-F000031':{
              'slot':'C','page':'12',
              'source_locator':'p12-sordomudos-curriculo-vocacional-genero-aptitud',
              'url':'https://hndm.iib.unam.mx/consulta/publicacion/pdf/558a330d7d1ed64f168f479d.pdf?coleccion=&palabras=',
              'role':'source_criticism_salient',
              'boundary':"Printed p. 12, later in article 17 under Escuela de Sordo-Mudos: fix the contiguous vocational-curriculum clause assigning practical horticulture/gardening to boys, needlework/embroidery/crochet to girls, and bookkeeping to pupils judged to show aptitude; exclude the preceding general academic subjects and stop before CAPITULO III.",
              'note':"Direct primary inspection fills the former slot-C gap with a source-critical unit distinct from F000029 on the same page. The selected later clause of article 17 encodes gendered vocational differentiation and an aptitude-based allocation within deaf education. It is retained as historical evidence of the source's classificatory logic, not as neutral or current pedagogical guidance. No historical text or image is republished.",
            },
            'PDHD-F000032':{
              'slot':'D','page':'1',
              'source_locator':'p1-masthead-date-volume-number-director-editor-control',
              'url':'https://hndm.iib.unam.mx/consulta/publicacion/pdf/558a330d7d1ed64f168f4792.pdf?coleccion=&palabras=',
              'role':'control',
              'boundary':"Printed p. 1: fix only the top masthead/cartouche identifying Tomo I, México 15 March 1896, Núm. 1, Revista de la Instrucción Pública Mexicana, Director Ezequiel A. Chávez and Jefe de Redacción Manuel Larrañaga Portugal; stop before the INTRODUCCION heading and article text.",
              'note':"Direct HNDM inspection fills the former control gap with a deliberately non-analytical masthead region on printed p. 1. The span is limited to volume/date/number/publication and editorial-role metadata and excludes the substantive introduction below.",
            },
          }

          # Update existing F30 locator in-place.
          p=samples/'fragment_locator_progress_secondary_w4.csv'
          with p.open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          hit=0
          for r in rows:
              if r.get('fragment_id')=='PDHD-F000030':
                  u=direct['PDHD-F000030']
                  r.update(page=u['page'],source_locator=u['source_locator'],locator_evidence_url=u['url'],boundary_status='fixed',public_text_status='metadata_only',freeze_status='frozen',preparation_note=u['note'],checked_at=checked); hit+=1
          if hit!=1: raise SystemExit(f'F30 locator hits={hit}')
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          # Create one locator shard for the three former gaps.
          loc=samples/'fragment_locator_progress_hndm_ripm1896_w22.csv'
          lfields=['fragment_id','document_id','slot','page','source_locator','locator_evidence_url','boundary_status','public_text_status','freeze_status','preparation_note','checked_at']
          lrows=[]
          for fid in ['PDHD-F000029','PDHD-F000031','PDHD-F000032']:
              u=direct[fid]
              lrows.append({'fragment_id':fid,'document_id':'PDHD-D000006','slot':u['slot'],'page':u['page'],'source_locator':u['source_locator'],'locator_evidence_url':u['url'],'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen','preparation_note':u['note'],'checked_at':checked})
          with loc.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=lfields,lineterminator='\n'); w.writeheader(); w.writerows(lrows)

          # Remove exactly the three resolved gaps.
          gap=samples/'fragment_gap_queue_0_1.csv'
          with gap.open(encoding='utf-8',newline='') as f:
              grows=list(csv.DictReader(f)); gfields=list(grows[0].keys())
          remove={'PDHD-F000029','PDHD-F000031','PDHD-F000032'}
          found={r['fragment_id'] for r in grows if r['fragment_id'] in remove}
          if found!=remove: raise SystemExit(f'gap rows missing: {remove-found}')
          grows=[r for r in grows if r['fragment_id'] not in remove]
          with gap.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=gfields,lineterminator='\n'); w.writeheader(); w.writerows(grows)

          # Create frozen shard for all four deterministic slots.
          frozen=samples/'frozen_fragments_hndm_ripm1896_w22.csv'
          ffields=['fragment_id','document_id','slot','page','source_locator','locator_evidence_url','boundary_definition','transcription_status','access_basis','public_text_status','selection_role','freeze_status','preparation_note','checked_at']
          frows=[]
          for fid in ['PDHD-F000029','PDHD-F000030','PDHD-F000031','PDHD-F000032']:
              u=direct[fid]
              frows.append({'fragment_id':fid,'document_id':'PDHD-D000006','slot':u['slot'],'page':u['page'],'source_locator':u['source_locator'],'locator_evidence_url':u['url'],'boundary_definition':u['boundary'],'transcription_status':'not_transcribed','access_basis':'HNDM_public_interface_manual_inspection','public_text_status':'metadata_only','selection_role':u['role'],'freeze_status':'frozen','preparation_note':u['note'],'checked_at':checked})
          with frozen.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=ffields,lineterminator='\n'); w.writeheader(); w.writerows(frows)

          # Preserve prior failed/manual-pending attempt and append successful full traversal.
          ra=samples/'retrieval_attempts.csv'
          with ra.open(encoding='utf-8',newline='') as f:
              rrows=list(csv.DictReader(f)); rfields=list(rrows[0].keys())
          if any(r['attempt_id']=='PDHD-RA000015' for r in rrows): raise SystemExit('RA15 exists')
          rrows.append({'attempt_id':'PDHD-RA000015','document_id':'PDHD-D000006','fragment_ids':'PDHD-F000029;PDHD-F000030;PDHD-F000031;PDHD-F000032','source_id':'HNDM','object_url':'https://hndm.iib.unam.mx/consulta/publicacion/visualizar/558075bf7d1e63c9fea1a411?anio=1896&mes=03&dia=15&intPagina=1&tipo=publicacion','target':'all_four_issue_slots','result_status':'superseded_by_locator','blocker':"A dedicated corrected HNDM traversal followed persistent siguienteLink page identifiers through the exact 15 March 1896 issue and recovered 37 unique single-page PDFs. Five preliminary leaves are cover/index matter; sequence 6 is printed p. 1 and sequence 37 is printed p. 32. Direct image inspection fills former gaps F000029/F000031/F000032 and confirms the prior secondary p. 31 pointer for F000030. The final batch uses p. 12 for a non-overlapping explicit deaf-education language-method clause and a distinct source-critical gendered/vocational curriculum clause, p. 31 for the Correa Zapata/Tuchs personnel notice, and p. 1 for the masthead control.",'next_route':'frozen_registry_gap_queue_and_status_sync_completed','checked_at':checked})
          with ra.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rfields,lineterminator='\n'); w.writeheader(); w.writerows(rrows)

          # Synchronize public status surfaces: 86 located, 65 frozen, 21 located-not-frozen, 10 gaps.
          readme=(root/'README.md').read_text(encoding='utf-8')
          readme=readme.replace('| Slots con localizador candidato/resuelto | **83 / 96** |','| Slots con localizador candidato/resuelto | **86 / 96** |')
          readme=readme.replace('| Fragmentos completamente congelados | **61 / 96** |','| Fragmentos completamente congelados | **65 / 96** |')
          readme=re.sub(r'su unión contiene \*\*83/96\*\* slots','su unión contiene **86/96** slots',readme)
          readme=re.sub(r'su unión contiene \*\*61/96\*\* fragmentos','su unión contiene **65/96** fragmentos',readme)
          readme=re.sub(r'\*\*83/96 slots tienen ya un localizador documentado\.\*\*','**86/96 slots tienen ya un localizador documentado.**',readme)
          readme=re.sub(r'\*\*22 localizadores todavía no congelados\*\*','**21 localizadores todavía no congelados**',readme)
          readme=re.sub(r'Quedan \*\*13 slots sin localizador\*\*','Quedan **10 slots sin localizador**',readme)
          marker='`PDHD-D000063`, *México intelectual* (1889)'
          para=("`PDHD-D000006`, *Revista de la Instrucción Pública Mexicana* del 15 de marzo de 1896, completa A–D desde 37 páginas primarias únicas recuperadas por navegación persistente de HNDM. La secuencia confirma cinco hojas preliminares de portada/índices, seguida por la p. impresa 1 en `seq-006` y la p. 32 en `seq-037`. `PDHD-F000029` se fija en p. 12 como prescripción didáctica para lengua española escrita mediante alfabeto manual en la Escuela de Sordo-Mudos; `PDHD-F000030` confirma en p. 31 la renuncia de Dolores Correa Zapata y el nombramiento de Emilia Tuchs; `PDHD-F000031` usa un bloque distinto de p. 12 como evidencia crítica de diferenciación vocacional por género y aptitud; y `PDHD-F000032` fija el masthead de p. 1 como control. Tres gaps quedan así localizados y congelados sin publicar facsímil ni transcripción histórica.\n\n")
          if marker not in readme: raise SystemExit('README marker missing')
          readme=readme.replace(marker,para+marker,1)
          (root/'README.md').write_text(readme,encoding='utf-8')

          cohort=(root/'docs/PDHD_U1_COHORT_STATUS.md').read_text(encoding='utf-8')
          cohort=cohort.replace('| Fragment locator rows resolved/candidate | **83 / 96** |','| Fragment locator rows resolved/candidate | **86 / 96** |')
          cohort=cohort.replace('| Fully frozen fragments | **61 / 96** |','| Fully frozen fragments | **65 / 96** |')
          cohort=cohort.replace('now has **83 of the 96 deterministic reliability slots**','now has **86 of the 96 deterministic reliability slots**')
          cohort=cohort.replace('Sixty-one units have crossed the stronger frozen-fragment gate.','Sixty-five units have crossed the stronger frozen-fragment gate.')
          cohort=cohort.replace('Fourteen selected documents now have complete four-slot batches.','Fifteen selected documents now have complete four-slot batches.')
          cohort=cohort.replace('contains **83/96** pilot slots','contains **86/96** pilot slots')
          cohort=cohort.replace('remaining **22** located rows','remaining **21** located rows')
          cohort=cohort.replace('**13 slots remain without a locator.**','**10 slots remain without a locator.**')
          cohort=cohort.replace('The current 61 frozen units','The current 65 frozen units')
          cohort=cohort.replace('project is now at **83/96 localized** and **61/96 frozen**','project is now at **86/96 localized** and **65/96 frozen**')
          cohort=cohort.replace('The next quantitative localization checkpoint remains **84/96**','The next quantitative localization checkpoint is **88/96**')
          cm='`PDHD-D000063`, *México intelectual* of 1889'
          cpara=("`PDHD-D000006`, *Revista de la Instrucción Pública Mexicana* of 15 March 1896, now contributes a complete A–D batch after traversing the exact HNDM issue through 37 unique persistent page IDs. The primary sequence establishes five preliminary cover/index leaves, printed p. 1 at sequence 6 and printed p. 32 at sequence 37. Direct visual inspection fills the three former A/C/D gaps: F000029 fixes a language-teaching prescription in the Escuela de Sordo-Mudos on p. 12; F000031 fixes a separate non-overlapping p. 12 source-critical clause differentiating vocational formation by gender and aptitude; F000032 uses the p. 1 masthead as a non-analytical control. F000030 is independently confirmed on p. 31 as the personnel notice recording Dolores Correa Zapata's resignation and Emilia Tuchs's appointment.\n\n")
          if cm not in cohort: raise SystemExit('cohort marker missing')
          cohort=cohort.replace(cm,cpara+cm,1)
          (root/'docs/PDHD_U1_COHORT_STATUS.md').write_text(cohort,encoding='utf-8')

      - name: Remove temporary recovery workflows
        shell: bash
        run: |
          rm -f .github/workflows/retrieve-revista-instruccion-publica-1896.yml
          rm -f .github/workflows/finalize-revista-instruccion-publica-1896.yml

      - name: Validate full scientific state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          python scripts/validate_object_aliases.py
          python scripts/validate_content_leads.py
          python scripts/validate_retrieval_attempts.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_freeze_conversion_queue.py
          python scripts/prepare_freeze_review.py --check
          python scripts/validate_status_counts.py
          python scripts/annotation_agreement.py --self-test
          python scripts/build_fragment_manifest.py --check
          git diff --check

      - name: Gate persistent scientific diff
        shell: python
        run: |
          import subprocess
          expected={
            'README.md','docs/PDHD_U1_COHORT_STATUS.md',
            'data/samples/fragment_locator_progress_secondary_w4.csv',
            'data/samples/fragment_locator_progress_hndm_ripm1896_w22.csv',
            'data/samples/frozen_fragments_hndm_ripm1896_w22.csv',
            'data/samples/fragment_gap_queue_0_1.csv','data/samples/retrieval_attempts.csv',
            '.github/workflows/retrieve-revista-instruccion-publica-1896.yml',
            '.github/workflows/finalize-revista-instruccion-publica-1896.yml',
          }
          lines=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          paths={x[3:] for x in lines}
          bad=paths-expected
          if bad: raise SystemExit('unexpected files '+repr(sorted(bad)))
          required=expected-{'.github/workflows/retrieve-revista-instruccion-publica-1896.yml','.github/workflows/finalize-revista-instruccion-publica-1896.yml'}
          miss=required-paths
          if miss: raise SystemExit('missing scientific files '+repr(sorted(miss)))

      - name: Commit and push clean batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fernando Sandoval'
          git config user.email 'fernando.sandoval@uacj.mx'
          git add -A
          git commit -m 'Freeze Revista Instruccion Publica Mexicana 1896 batch'
          git push origin HEAD:freeze-revista-instruccion-publica-1896
