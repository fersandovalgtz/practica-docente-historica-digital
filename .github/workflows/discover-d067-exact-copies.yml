name: Discover exact digital copies for D067

on:
  workflow_dispatch:
  push:
    branches:
      - work/d067-primary-surrogate-20260907
    paths:
      - .github/workflows/discover-d067-exact-copies.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Query catalogs and identify exact-copy candidates
        shell: python
        run: |
          import html, json, pathlib, re, urllib.parse, urllib.request, urllib.error
          out=pathlib.Path('d067-discovery'); out.mkdir(exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9,en;q=0.8'}
          def fetch(url,timeout=90):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return {'status':r.status,'final':r.geturl(),'ctype':r.headers.get('Content-Type',''),'body':r.read()}
              except urllib.error.HTTPError as e:
                  return {'status':e.code,'final':e.geturl(),'ctype':e.headers.get('Content-Type',''),'body':e.read(),'error':str(e)}
              except Exception as e:
                  return {'status':None,'final':url,'ctype':'','body':b'','error':f'{type(e).__name__}: {e}'}
          report={}

          # Hathi MARC / export variants.
          hurls=[
              'https://catalog.hathitrust.org/Record/101391797.marc',
              'https://catalog.hathitrust.org/Record/101391797/Export?style=MARC',
              'https://catalog.hathitrust.org/Record/101391797/Export?style=EndNote',
          ]
          hrows=[]
          for u in hurls:
              r=fetch(u); txt=r['body'].decode('utf-8',errors='replace')
              ids=sorted(set(re.findall(r'(?i)(?:oclc|ocm|ocn|on)[^0-9]{0,8}(\d{6,12})',txt)))
              hrows.append({'url':u,'status':r['status'],'ctype':r['ctype'],'bytes':len(r['body']),'control_numbers':ids,'text_prefix':txt[:8000]})
              print('\nHATHI_EXPORT',u,'status',r['status'],'ctype',r['ctype'],'bytes',len(r['body']),'ids',ids)
              print(txt[:2500].replace('\n',' | '))
          report['hathi_exports']=hrows

          # Google Books web search (HTML, not API only), exact and series formulations.
          gqueries=[
              '"El papel social del maestro rural"',
              '"El papel social del maestro rural" "1925"',
              '"El papel social del maestro rural" "tomo III" "18"',
              '"papel social" "maestro rural" "Secretaría de Educación Pública"',
          ]
          grows=[]; vids=set()
          for q in gqueries:
              u='https://books.google.com/books?'+urllib.parse.urlencode({'q':q,'hl':'es'})
              r=fetch(u); txt=html.unescape(r['body'].decode('utf-8',errors='replace')).replace('\\/','/').replace('\\u0026','&')
              found=[]
              for pat in [r'[?&]id=([A-Za-z0-9_-]{8,})',r'/books/edition/[^/]+/([A-Za-z0-9_-]{8,})',r'books/content\?id=([A-Za-z0-9_-]{8,})']:
                  found += re.findall(pat,txt)
              found=list(dict.fromkeys(found)); vids.update(found)
              plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',txt))
              grows.append({'query':q,'url':u,'status':r['status'],'bytes':len(r['body']),'volume_ids':found[:80],'title_context':plain[:10000]})
              print('\nGOOGLE_SEARCH',q,'status',r['status'],'ids',found[:80])
              pos=plain.lower().find('papel social del maestro rural')
              if pos>=0: print('CONTEXT',plain[max(0,pos-700):pos+2500])
          report['google_search']=grows

          # Inspect candidate Google IDs by title metadata and SearchWithin terms.
          candidates={}
          terms=['higiene','hogar','oficio','sociedad','familia','maestro rural','útiles para la sociedad','31 de agosto de 1925']
          for vid in sorted(vids):
              front=f'https://books.google.com/books?id={vid}&printsec=frontcover&hl=es'
              r=fetch(front); txt=html.unescape(r['body'].decode('utf-8',errors='replace')).replace('\\/','/').replace('\\u0026','&')
              low=txt.lower()
              if 'papel social' not in low and 'maestro rural' not in low:
                  continue
              title=None
              for pat in [r'<meta[^>]+(?:name|property)=["\'](?:citation_title|og:title)["\'][^>]+content=["\']([^"\']+)',r'<title>(.*?)</title>']:
                  m=re.search(pat,txt,re.I|re.S)
                  if m: title=re.sub(r'\s+',' ',m.group(1)).strip(); break
              pdfs=re.findall(r'https?://books\.google\.[^/]+/books/download/[^"\'<> ]+?\.pdf\?[^"\'<> ]+',txt)
              row={'front_status':r['status'],'front_bytes':len(r['body']),'title':title,'pdf_links':len(pdfs),'search':{}}
              for term in terms:
                  su='https://books.google.com/books?'+urllib.parse.urlencode({'id':vid,'jscmd':'SearchWithinVolume2','q':term})
                  sr=fetch(su); rec={'status':sr['status'],'bytes':len(sr['body']),'results':[]}
                  try:
                      d=json.loads(sr['body'].decode('utf-8'))
                      rec['number_of_results']=d.get('number_of_results')
                      for x in (d.get('search_results') or [])[:8]:
                          if isinstance(x,dict): rec['results'].append({k:x.get(k) for k in ['page_id','page_number','snippet_text']})
                  except Exception as e: rec['error']=f'{type(e).__name__}: {e}'
                  row['search'][term]=rec
              candidates[vid]=row
              print('\nGOOGLE_CANDIDATE',vid,json.dumps({'title':title,'pdf_links':len(pdfs),'hits':{t:[(x.get('page_id'),x.get('page_number')) for x in z['results']] for t,z in row['search'].items() if z.get('results')}},ensure_ascii=False,indent=2))
          report['google_candidates']=candidates

          # Internet Archive exact/series queries.
          ia_queries=[
              'title:("El papel social del maestro rural")',
              'title:("papel social del maestro rural") AND year:1925',
              '"Publicaciones de la Secretaría de Educación Pública" AND "tomo III" AND "18"',
          ]
          ia=[]
          for q in ia_queries:
              u='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({'q':q,'fl[]':['identifier','title','date','year','creator','description'],'rows':'100','page':'1','output':'json'})
              r=fetch(u); row={'query':q,'status':r['status'],'bytes':len(r['body']),'docs':[]}
              try:
                  d=json.loads(r['body'].decode('utf-8')); row['docs']=d.get('response',{}).get('docs',[])
              except Exception as e: row['error']=str(e)
              ia.append(row); print('\nIA',q,json.dumps(row,ensure_ascii=False,indent=2))
          report['internet_archive']=ia
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Upload one-day discovery report
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d067-exact-copy-discovery
          path: d067-discovery/
          retention-days: 1
          if-no-files-found: error
