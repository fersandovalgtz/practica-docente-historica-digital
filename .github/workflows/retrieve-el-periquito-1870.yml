name: Retrieve El Periquito 6 Nov 1870 primary issue

on:
  push:
    branches: [freeze-el-periquito-1870]
    paths:
      - ".github/workflows/retrieve-el-periquito-1870.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traverse exact four-page HNDM issue from UNAM first-page ID
        shell: python
        run: |
          import csv,html,json,pathlib,re,urllib.request,http.cookiejar
          out=pathlib.Path('periquito-primary'); out.mkdir()
          base='https://hndm.iib.unam.mx'
          serial='558075be7d1e63c9fea1a3df'
          first='558a32a77d1ed64f1688827b'
          target_date='1870-11-06'
          expected=4
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9,en;q=0.7'}
          jar=http.cookiejar.CookieJar(); opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def get(url,referer=None):
              h=dict(headers)
              if referer: h['Referer']=referer
              req=urllib.request.Request(url,headers=h)
              with opener.open(req,timeout=90) as r: return r.read(),r.geturl(),r.status
          def parse(body):
              text=html.unescape(body.decode('utf-8',errors='replace'))
              dm=re.search(r'<dt>Fecha:</dt>\s*<dd>\s*([^<]+?)\s*</dd>',text,re.I|re.S)
              tm=re.search(r'<dt>T[ií]tulo:</dt>\s*<dd>\s*([^<]+?)\s*</dd>',text,re.I|re.S)
              date=re.sub(r'\s+',' ',dm.group(1)).strip() if dm else ''
              title=re.sub(r'\s+',' ',tm.group(1)).strip() if tm else ''
              pdfids=list(dict.fromkeys(re.findall(r'/consulta/publicacion/pdf/([0-9a-f]{24})\.pdf',text,re.I)))
              nexts=list(dict.fromkeys(re.findall(r'<a href="[^"]*[?&]pagina=([0-9a-f]{24})[^"]*"[^>]*class="siguienteLink"',text,re.I)))
              prevs=list(dict.fromkeys(re.findall(r'<a href="[^"]*[?&]pagina=([0-9a-f]{24})[^"]*"[^>]*class="anteriorLink"',text,re.I)))
              count_m=re.search(r'\bde\s+([0-9]{1,4})\s*</form>',text,re.I)
              return text,title,date,pdfids,nexts,prevs,int(count_m.group(1)) if count_m else None
          # Prior scientific state, for audit only.
          loc=[]
          for p in sorted(pathlib.Path('data/samples').glob('fragment_locator_progress*.csv')):
              with p.open(encoding='utf-8',newline='') as f:
                  for r in csv.DictReader(f):
                      if r.get('fragment_id') in {'PDHD-F000001','PDHD-F000002','PDHD-F000003','PDHD-F000004'}: loc.append({'shard':p.name,**r})
          with pathlib.Path('data/samples/fragment_gap_queue_0_1.csv').open(encoding='utf-8',newline='') as f:
              gaps=[r for r in csv.DictReader(f) if r.get('fragment_id') in {'PDHD-F000001','PDHD-F000002','PDHD-F000003','PDHD-F000004'}]
          (out/'prior-state.json').write_text(json.dumps({'locators':loc,'gaps':gaps},ensure_ascii=False,indent=2),encoding='utf-8')
          mapping=[]; seen=set(); pid=first; referer='https://repositorio.unam.mx/contenidos/ficha/el-periquito-921573'
          for seq in range(1,expected+1):
              if pid in seen: raise SystemExit(f'cycle at {pid}')
              seen.add(pid)
              vurl=f'{base}/consulta/publicacion/visualizar/{serial}?pagina={pid}&coleccion='
              body,final,status=get(vurl,referer)
              text,title,date,pdfids,nexts,prevs,count=parse(body)
              (out/f'viewer-{seq:02d}-{pid}.html').write_text(text,encoding='utf-8')
              if date!=target_date: raise SystemExit(f'date identity failed seq={seq} pid={pid}: {date!r}')
              if title and 'Periquito' not in title: raise SystemExit(f'title identity failed seq={seq}: {title!r}')
              if count is not None and count!=expected: raise SystemExit(f'page-count drift seq={seq}: {count}')
              if len(pdfids)!=1 or pdfids[0]!=pid: raise SystemExit(f'PDF identity failed seq={seq}: {pdfids}')
              pdfurl=f'{base}/consulta/publicacion/pdf/{pid}.pdf?coleccion=&palabras='
              pbody,pfinal,pstatus=get(pdfurl,vurl)
              if not pbody.startswith(b'%PDF'): raise SystemExit(f'non-PDF seq={seq}')
              (out/f'seq-{seq:02d}-{pid}.pdf').write_bytes(pbody)
              mapping.append({'sequence':seq,'page_id':pid,'title':title,'visible_date':date,'viewer_url':vurl,'pdf_url':pdfurl,'pdf_bytes':len(pbody),'previous_page_ids':prevs,'next_page_ids':nexts,'reported_count':count})
              if seq<expected:
                  if len(nexts)!=1: raise SystemExit(f'next-link gate failed seq={seq}: {nexts}')
                  pid=nexts[0]
              else:
                  # Last page may link to the next issue in some serials; issue completeness rests on UNAM item_pages=4 plus four in-date pages.
                  pass
              referer=vurl
          if len(mapping)!=4 or len(seen)!=4: raise SystemExit('four-page completeness gate failed')
          (out/'viewer-map.json').write_text(json.dumps(mapping,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(mapping,ensure_ascii=False,indent=2))
      - name: Render all four primary pages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p periquito-primary/rendered periquito-primary/text
          for f in periquito-primary/seq-*.pdf; do
            stem=$(basename "$f" .pdf)
            pdftotext -layout "$f" "periquito-primary/text/$stem.txt" || true
            pdftoppm -f 1 -l 1 -singlefile -jpeg -r 260 "$f" "periquito-primary/rendered/$stem" >/dev/null 2>&1
          done
          test "$(find periquito-primary/rendered -name '*.jpg' | wc -l)" -eq 4
          python - <<'PY'
          import json,pathlib,re
          rows=[]
          for p in sorted(pathlib.Path('periquito-primary/text').glob('*.txt')):
              t=p.read_text(encoding='utf-8',errors='replace')
              rows.append({'file':p.name,'chars':len(t),'snippet':re.sub(r'\s+',' ',t)[:5000]})
          pathlib.Path('periquito-primary/text-summary.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Upload primary review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-el-periquito-1870-primary-review
          path: periquito-primary/
          retention-days: 1
