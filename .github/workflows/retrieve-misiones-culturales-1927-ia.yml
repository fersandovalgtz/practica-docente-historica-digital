name: Retrieve Misiones Culturales 1927 primary pages from IA

on:
  push:
    branches: [freeze-misiones-culturales-1927]
    paths:
      - ".github/workflows/retrieve-misiones-culturales-1927-ia.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Internet Archive object
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request

          out=pathlib.Path('misiones-1927-primary-review'); out.mkdir()
          ident='lasmisionescultu00mexi'
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          files={
              'volume.pdf': f'https://archive.org/download/{ident}/{ident}.pdf',
              'scandata.xml': f'https://archive.org/download/{ident}/{ident}_scandata.xml',
              'djvu.txt': f'https://archive.org/download/{ident}/{ident}_djvu.txt',
              'meta.xml': f'https://archive.org/download/{ident}/{ident}_meta.xml',
          }
          report={}
          for name,url in files.items():
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=240) as r:
                  body=r.read(); status=r.status; ctype=r.headers.get('Content-Type','')
              (out/name).write_bytes(body)
              report[name]={'status':status,'bytes':len(body),'content_type':ctype,'url':url}
          if not (out/'volume.pdf').read_bytes().startswith(b'%PDF'):
              raise SystemExit('Primary IA PDF invalid')
          (out/'retrieval-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))

      - name: Map printed folios and render target pages
        shell: bash
        run: |
          set -euo pipefail
          out='misiones-1927-primary-review'
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfinfo "$out/volume.pdf" > "$out/pdfinfo.txt"
          pdftotext -layout "$out/volume.pdf" "$out/volume.txt" || true
          python - <<'PY'
          import json, pathlib, re, subprocess, xml.etree.ElementTree as ET
          out=pathlib.Path('misiones-1927-primary-review')
          tree=ET.parse(out/'scandata.xml')
          root=tree.getroot()
          mappings=[]
          for page in root.findall('.//pageData/page'):
              leaf=page.get('leafNum')
              pd=page.find('pageNumber')
              ptype=page.find('pageType')
              mappings.append({
                  'leafNum': int(leaf) if leaf is not None and leaf.isdigit() else leaf,
                  'pageNumber': pd.text.strip() if pd is not None and pd.text else None,
                  'pageType': ptype.text.strip() if ptype is not None and ptype.text else None,
              })
          targets=['21','51','209','371']
          target_map={}
          for t in targets:
              target_map[t]=[m for m in mappings if m['pageNumber']==t]
          (out/'page-map.json').write_text(json.dumps({'targets':target_map,'all':mappings},ensure_ascii=False,indent=2),encoding='utf-8')
          print('TARGET MAP',json.dumps(target_map,ensure_ascii=False))

          # IA derivative PDF physical pages are normally leafNum+1; render a safe neighborhood
          # around every scandata match and around front matter for a possible control.
          physical=set(range(1,25))
          for vals in target_map.values():
              for m in vals:
                  if isinstance(m['leafNum'],int):
                      center=m['leafNum']+1
                      physical.update(range(max(1,center-2),center+3))
          render=out/'rendered'; render.mkdir(exist_ok=True)
          for p in sorted(physical):
              prefix=render/f'physical-{p:04d}'
              subprocess.run(['pdftoppm','-f',str(p),'-l',str(p),'-singlefile','-jpeg','-r','180',str(out/'volume.pdf'),str(prefix)],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          (out/'rendered-pages.json').write_text(json.dumps(sorted(physical),indent=2),encoding='utf-8')
          PY

      - name: Extract text neighborhoods for target folios
        shell: python
        run: |
          import json, pathlib
          out=pathlib.Path('misiones-1927-primary-review')
          pages=(out/'volume.txt').read_text(encoding='utf-8',errors='replace').split('\f')
          mapping=json.loads((out/'page-map.json').read_text(encoding='utf-8'))['targets']
          txt={}
          for folio,vals in mapping.items():
              chunks=[]
              for m in vals:
                  leaf=m.get('leafNum')
                  if isinstance(leaf,int):
                      center=leaf # pdftotext split index zero-based corresponds approximately to leaf/PDF sequence
                      lo=max(0,center-2); hi=min(len(pages),center+3)
                      chunks.append({'leafNum':leaf,'pages':[{'physical_guess':i+1,'text':pages[i][:12000]} for i in range(lo,hi)]})
              txt[folio]=chunks
          (out/'target-text-neighborhoods.json').write_text(json.dumps(txt,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:[x['leafNum'] for x in v] for k,v in txt.items()},ensure_ascii=False))

      - name: Upload one-day primary-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-misiones-1927-primary-review
          path: misiones-1927-primary-review/
          retention-days: 1
          if-no-files-found: error
