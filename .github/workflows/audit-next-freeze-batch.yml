name: Audit next PDHD freeze batch

on:
  push:
    branches: [audit-next-freeze-batch]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute localized but unfrozen union
        shell: python
        run: |
          import csv, glob, json, pathlib, collections

          root = pathlib.Path('data/samples')
          locator_files = sorted(root.glob('fragment_locator_progress*.csv'))
          frozen_files = sorted(root.glob('frozen_fragments*.csv'))

          loc = {}
          loc_sources = collections.defaultdict(list)
          for path in locator_files:
              with path.open(encoding='utf-8-sig', newline='') as f:
                  for row in csv.DictReader(f):
                      fid = (row.get('fragment_id') or row.get('promoted_fragment_id') or '').strip()
                      if not fid:
                          continue
                      # Later shards are allowed to refine earlier rows. Preserve every source file.
                      loc[fid] = row
                      loc_sources[fid].append(path.name)

          frozen = set()
          for path in frozen_files:
              with path.open(encoding='utf-8-sig', newline='') as f:
                  for row in csv.DictReader(f):
                      fid = (row.get('fragment_id') or row.get('promoted_fragment_id') or '').strip()
                      if fid:
                          frozen.add(fid)

          gap = set()
          gap_path = root / 'fragment_gap_queue_0_1.csv'
          with gap_path.open(encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  fid = (row.get('fragment_id') or row.get('promoted_fragment_id') or '').strip()
                  if fid:
                      gap.add(fid)

          pending = []
          for fid in sorted(set(loc) - frozen):
              row = dict(loc[fid])
              row['_fragment_id'] = fid
              row['_locator_files'] = loc_sources[fid]
              row['_is_gap'] = fid in gap
              pending.append(row)

          # Group by selected document to expose batch yield.
          groups = collections.defaultdict(list)
          for row in pending:
              did = (row.get('document_id') or row.get('selected_document_id') or row.get('object_id') or 'UNKNOWN').strip()
              groups[did].append(row['_fragment_id'])

          report = {
              'locator_file_count': len(locator_files),
              'frozen_file_count': len(frozen_files),
              'localized_union_count': len(loc),
              'frozen_union_count': len(frozen),
              'gap_count': len(gap),
              'pending_count': len(pending),
              'pending_groups': dict(sorted(groups.items(), key=lambda kv: (-len(kv[1]), kv[0]))),
              'pending_rows': pending,
          }
          pathlib.Path('next-freeze-audit').mkdir()
          pathlib.Path('next-freeze-audit/report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')

          print('COUNTS', json.dumps({k: report[k] for k in ['localized_union_count','frozen_union_count','gap_count','pending_count']}, ensure_ascii=False))
          print('GROUPS', json.dumps(report['pending_groups'], ensure_ascii=False, indent=2))
          print('PENDING_ROWS')
          for row in pending:
              keys = ['_fragment_id','document_id','selected_document_id','slot','locator_status','source_locator','source_url','access_basis','evidence_status','public_text_status','transcription_status','preparation_note']
              print(json.dumps({k: row.get(k) for k in keys if row.get(k) not in (None,'')}, ensure_ascii=False))

          if len(loc) != 95:
              raise SystemExit(f'expected 95 localized rows, got {len(loc)}')
          if len(frozen) != 77:
              raise SystemExit(f'expected 77 frozen rows, got {len(frozen)}')
          if len(gap) != 1:
              raise SystemExit(f'expected 1 gap, got {len(gap)}')
          if len(pending) != 18:
              raise SystemExit(f'expected 18 localized-not-frozen rows, got {len(pending)}')
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-next-freeze-audit
          path: next-freeze-audit/report.json
          retention-days: 1
