name: Probe 1937-1938 replacement fragment quality

on:
  push:
    branches: [recover-memoria-sep-1937-v3]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search explicit pedagogical acts and retrieve primary pages
        shell: python
        run: |
          import html, json, pathlib, re, urllib.parse, urllib.request
          out=pathlib.Path('xd0-replacement-review'); out.mkdir()
          bid='Xd0U5ozjxNgC'
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          def get(url,timeout=180):
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      b=r.read(); return {'ok':True,'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type',''),'bytes':len(b),'body':b}
              except Exception as e: return {'ok':False,'error':repr(e),'body':b''}
          def image_urls(txt):
              s=html.unescape(txt).replace('\\u0026','&').replace('\\/','/')
              got=[]
              for pat in [r'https://books\.google\.com/books/content[^"\'<> ]+',r'https://books\.googleusercontent\.com/books/content[^"\'<> ]+',r'["\']([^"\']*books/content[^"\']*)["\']']:
                  for u in re.findall(pat,s,re.I):
                      if u.startswith('//'): u='https:'+u
                      if u.startswith('/'): u='https://books.google.com'+u
                      if u.startswith('http') and ('id='+bid) in u and u not in got: got.append(u)
              return got
          queries={
            'maestros_alumnos':'maestros alumnos enseñanza método',
            'clase_demostracion':'clase demostración maestros alumnos',
            'ensenanza_practica':'enseñanza práctica alumnos maestros',
            'deben_maestros':'maestros deben enseñar',
            'trabajo_manual':'trabajo manual aplicaciones conocimientos alumnos',
            'lectura':'maestro lectura alumnos',
            'observacion':'maestros observar alumnos',
            'practicas_maestros':'pasantes de Maestros prácticas',
          }
          report={'book_id':bid,'searches':{},'pages':[]}
          pages=['PA205','PA233','PA260','PA333','PA363','PA369','PA372','PA372-IA1']
          for key,q in queries.items():
              u='https://books.google.com/books?'+urllib.parse.urlencode({'id':bid,'jscmd':'SearchWithinVolume2','q':q})
              r=get(u); x={'ok':r['ok'],'status':r.get('status'),'bytes':r.get('bytes'),'error':r.get('error')}
              if r['ok']:
                  try:
                      j=json.loads(r['body']); x['number_of_results']=j.get('number_of_results'); x['search_results']=j.get('search_results',[])
                      for h in x['search_results']:
                          p=h.get('page_id')
                          if p and p not in pages: pages.append(p)
                  except Exception as e: x['parse_error']=repr(e)
              report['searches'][key]=x
              print('SEARCH',key,json.dumps(x,ensure_ascii=False)[:8000])
          for pg in pages[:30]:
              r=get('https://books.google.com/books?'+urllib.parse.urlencode({'id':bid,'pg':pg}))
              item={'page_id':pg,'ok':r['ok'],'status':r.get('status'),'bytes':r.get('bytes'),'error':r.get('error')}
              if r['ok']:
                  txt=r['body'].decode('utf-8','ignore'); urls=image_urls(txt); item['image_urls']=urls[:8]
                  for k,u in enumerate(urls[:4]):
                      ir=get(u); im={'url':u,'ok':ir['ok'],'status':ir.get('status'),'bytes':ir.get('bytes'),'content_type':ir.get('content_type'),'error':ir.get('error')}
                      item.setdefault('image_fetches',[]).append(im)
                      if ir['ok'] and (ir.get('content_type') or '').startswith('image/') and ir.get('bytes',0)>5000:
                          (out/f'{pg.replace("-","_")}_{k}.jpg').write_bytes(ir['body'])
              report['pages'].append(item)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PAGES',pages[:30]); print('IMAGES',[p.name for p in out.glob('*.jpg')])
      - uses: actions/upload-artifact@v4
        with:
          name: pdhd-xd0-replacement-review
          path: xd0-replacement-review/
          retention-days: 1
