name: Date browsable Memoria SEP copies by report-period fingerprint

on:
  push:
    branches: [recover-memoria-sep-1937-v3]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search exact annual-report period formulas
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          ids=['1HsQAAAAYAAJ','3X8QAAAAYAAJ','7OdDbshzWaUC','InoQAAAAYAAJ','KH0QAAAAYAAJ','N3wQAAAAYAAJ','Xd0U5ozjxNgC','e3wQAAAAYAAJ','X3oQAAAAYAAJ','KRV2_jMW8-wC']
          periods=[(y,y+1) for y in range(1933,1941)]
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          def get(url):
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=90) as r:
                      return json.loads(r.read().decode('utf-8','ignore'))
              except Exception as e:
                  return {'error':repr(e)}
          report=[]
          for bid in ids:
              row={'id':bid,'period_hits':[]}
              for y1,y2 in periods:
                  q=f'septiembre de {y1} a agosto de {y2}'
                  u='https://books.google.com/books?'+urllib.parse.urlencode({'id':bid,'jscmd':'SearchWithinVolume2','q':q})
                  j=get(u); n=j.get('number_of_results',0) or 0
                  if n:
                      row['period_hits'].append({'period':f'{y1}-{y2}','n':n,'results':j.get('search_results',[])})
              # Additional exact administrative-period variants used by SEP reports.
              for label,q in [('sep1937','SEPTIEMBRE DE 1936 A AGOSTO DE 1937'),('sep1938','SEPTIEMBRE DE 1937 A AGOSTO DE 1938'),('sep1939','SEPTIEMBRE DE 1938 A AGOSTO DE 1939'),('sep1940','SEPTIEMBRE DE 1939 A AGOSTO DE 1940')]:
                  u='https://books.google.com/books?'+urllib.parse.urlencode({'id':bid,'jscmd':'SearchWithinVolume2','q':q})
                  j=get(u); n=j.get('number_of_results',0) or 0
                  if n:
                      row.setdefault('uppercase_hits',[]).append({'label':label,'n':n,'results':j.get('search_results',[])})
              report.append(row)
              print('COPY',json.dumps(row,ensure_ascii=False))
          print('SUMMARY')
          for row in report:
              print(row['id'],[(x['period'],x['n'],[(r.get('page_id'),r.get('page_number')) for r in x['results']]) for x in row['period_hits']])
          open('period_report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: pdhd-memoria-sep-report-periods
          path: period_report.json
          retention-days: 1
