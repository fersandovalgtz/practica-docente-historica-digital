name: Resolve browsable Memoria SEP copies by date and title page

on:
  push:
    branches: [recover-memoria-sep-1937-v3]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve bibliographic identity and primary title-page access
        shell: python
        run: |
          import html, json, pathlib, re, urllib.parse, urllib.request
          out=pathlib.Path('memoria-sep-1937-identity'); out.mkdir()
          ids=['KRV2_jMW8-wC','1HsQAAAAYAAJ','3X8QAAAAYAAJ','7OdDbshzWaUC','InoQAAAAYAAJ','KH0QAAAAYAAJ','N3wQAAAAYAAJ','Xd0U5ozjxNgC','e3wQAAAAYAAJ','03wQAAAAYAAJ','X3oQAAAAYAAJ']
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          def get(url,timeout=180):
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      b=r.read(); return {'ok':True,'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type',''),'bytes':len(b),'body':b}
              except Exception as e: return {'ok':False,'error':repr(e),'body':b''}
          def save(name,r): (out/name).write_bytes(r.get('body',b''))
          def urls(txt):
              s=html.unescape(txt).replace('\\u0026','&').replace('\\/','/')
              got=[]
              for pat in [r'https://books\.google\.com/books/content[^"\'<> ]+',r'https://books\.googleusercontent\.com/books/content[^"\'<> ]+',r'["\']([^"\']*books/content[^"\']*)["\']']:
                  for u in re.findall(pat,s,re.I):
                      if u.startswith('//'): u='https:'+u
                      if u.startswith('/'): u='https://books.google.com'+u
                      if u.startswith('http') and u not in got: got.append(u)
              return got
          report=[]
          for bid in ids:
              c={'id':bid}
              # Exact per-volume API is stronger bibliographic metadata than keyword API search.
              ar=get('https://www.googleapis.com/books/v1/volumes/'+bid)
              c['api']={'ok':ar['ok'],'status':ar.get('status'),'bytes':ar.get('bytes'),'error':ar.get('error')}
              if ar['ok']:
                  save('api_'+bid+'.json',ar)
                  try:
                      j=json.loads(ar['body']); vi=j.get('volumeInfo',{}); ai=j.get('accessInfo',{})
                      c['volumeInfo']={k:vi.get(k) for k in ['title','subtitle','authors','publisher','publishedDate','description','pageCount','printType','language','industryIdentifiers']}
                      c['accessInfo']={k:ai.get(k) for k in ['viewability','embeddable','publicDomain','textToSpeechPermission','pdf','epub','webReaderLink','accessViewStatus']}
                  except Exception as e: c['api_parse_error']=repr(e)
              # Search exact report-period phrases and title-frontmatter markers.
              searches={}
              for key,q in {
                'period':'septiembre 1936 agosto 1937',
                'period2':'1936-1937',
                'secretario':'Secretaria de Educacion Publica 1937',
                'manual':'trabajo manual aplicaciones conocimientos',
              }.items():
                  sr=get('https://books.google.com/books?'+urllib.parse.urlencode({'id':bid,'jscmd':'SearchWithinVolume2','q':q}))
                  x={'ok':sr['ok'],'status':sr.get('status'),'bytes':sr.get('bytes'),'error':sr.get('error')}
                  if sr['ok']:
                      save(f'search_{bid}_{key}.txt',sr)
                      try:
                          j=json.loads(sr['body']); x['number_of_results']=j.get('number_of_results'); x['search_results']=j.get('search_results',[])
                      except Exception as e: x['parse_error']=repr(e)
                  searches[key]=x
              c['searches']=searches
              # Follow every distinct page returned for period searches plus common title-page labels.
              page_ids=[]
              for key in ['period','period2','secretario']:
                  for hit in searches[key].get('search_results',[]):
                      p=hit.get('page_id')
                      if p and p not in page_ids: page_ids.append(p)
              for p in ['PP1','PP3','PP5','PR1','PR3','PR5','PA1']:
                  if p not in page_ids: page_ids.append(p)
              inspected=[]
              for p in page_ids[:15]:
                  rr=get('https://books.google.com/books?'+urllib.parse.urlencode({'id':bid,'pg':p}))
                  item={'page_id':p,'ok':rr['ok'],'status':rr.get('status'),'bytes':rr.get('bytes'),'final_url':rr.get('final_url'),'error':rr.get('error')}
                  if rr['ok']:
                      txt=rr['body'].decode('utf-8','ignore'); item['contains_page_id']=p in txt
                      item['flags']={k:(m.group(1).lower() if (m:=re.search(r'"?'+k+r'"?\s*[:=]\s*(true|false)',txt,re.I)) else None) for k in ['is_browsable','is_public_domain','can_download_pdf']}
                      cand=urls(txt)
                      # Keep only this book's own image URLs; related-edition covers are noise.
                      cand=[u for u in cand if ('id='+bid) in u]
                      item['image_urls']=cand[:10]
                      save(f'page_{bid}_{p.replace("-","_")}.html',rr)
                      for k,u in enumerate(cand[:4]):
                          ir=get(u); im={'url':u,'ok':ir['ok'],'status':ir.get('status'),'bytes':ir.get('bytes'),'content_type':ir.get('content_type'),'error':ir.get('error')}
                          item.setdefault('image_fetches',[]).append(im)
                          if ir['ok'] and (ir.get('content_type') or '').startswith('image/') and ir.get('bytes',0)>2500:
                              save(f'image_{bid}_{p.replace("-","_")}_{k}.jpg',ir)
                  inspected.append(item)
              c['pages']=inspected
              report.append(c)
              print('IDENTITY',json.dumps(c,ensure_ascii=False)[:18000])
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY')
          for c in report:
              print(c['id'],c.get('volumeInfo',{}).get('publishedDate'),c.get('volumeInfo',{}).get('pageCount'),c.get('accessInfo',{}).get('viewability'),'period_hits',c['searches']['period'].get('number_of_results'),'manual',c['searches']['manual'].get('number_of_results'))
          print('IMAGES',len(list(out.glob('image_*.jpg'))))
      - name: Upload identity review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-memoria-sep-1937-identity
          path: memoria-sep-1937-identity/
          retention-days: 1
