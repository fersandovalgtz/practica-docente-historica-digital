name: Probe Google Books page index for El papel social del maestro rural

on:
  push:
    branches: [freeze-papel-social-maestro-rural-control]
    paths:
      - ".github/workflows/probe-papel-social-google-page-index.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query SearchWithinVolume2 and selected page HTML
        shell: python
        run: |
          import html,json,pathlib,re,urllib.parse,urllib.request,http.cookiejar
          out=pathlib.Path('probe-page-index'); out.mkdir()
          gid='PhRQAAAAMAAJ'
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9,en;q=0.7'}
          cj=http.cookiejar.CookieJar(); opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          queries=['maestro rural','papel social','escuela','comunidad','maestro','rural','Secretaría','Educación Pública','publicaciones','México','social']
          report={'queries':{},'pages':{}}
          page_ids=[]
          for host in ['https://books.google.com/books','https://www.google.com/books']:
              hlabel='books' if 'books.google' in host else 'google'
              for q in queries:
                  url=host+'?'+urllib.parse.urlencode({'jscmd':'SearchWithinVolume2','q':q,'vid':gid})
                  key=hlabel+'_'+re.sub(r'[^a-z0-9]+','_',q.lower()).strip('_')
                  item={'url':url}
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with opener.open(req,timeout=90) as r: body=r.read(); item.update(status=r.status,final_url=r.geturl(),bytes=len(body),content_type=r.headers.get('content-type',''))
                      text=body.decode('utf-8',errors='replace')
                      (out/f'{key}.txt').write_text(text,encoding='utf-8')
                      try:
                          obj=json.loads(text)
                      except Exception:
                          # Some endpoints prepend a safety token; isolate first JSON object.
                          s=text.find('{'); e=text.rfind('}')
                          obj=json.loads(text[s:e+1]) if s>=0 and e>s else None
                      item['json']=obj
                      if isinstance(obj,dict):
                          results=obj.get('entry') or obj.get('results') or obj.get('search_results') or []
                          if isinstance(results,dict): results=[results]
                          compact=[]
                          for x in results if isinstance(results,list) else []:
                              if not isinstance(x,dict): continue
                              pid=x.get('page_id') or x.get('pageId') or x.get('pid') or x.get('id')
                              pnum=x.get('page_number') or x.get('pageNumber') or x.get('page')
                              snippet=x.get('snippet_text') or x.get('snippet') or x.get('text')
                              compact.append({'page_id':pid,'page_number':pnum,'snippet':snippet})
                              if pid and isinstance(pid,str) and pid not in page_ids: page_ids.append(pid)
                          item['compact']=compact
                  except Exception as exc:
                      item['error']=repr(exc)
                  report['queries'][key]={k:v for k,v in item.items() if k!='json'}
          # Also probe canonical labels likely in short pamphlets, regardless of search hits.
          candidates=[]
          for pid in page_ids + ['PP1','PP2','PR1','PR2','PA1','PA2','PA3','PA4','PA5','PA6','PA7','PA8']:
              if pid not in candidates: candidates.append(pid)
          for pid in candidates[:80]:
              url='https://books.google.com/books?'+urllib.parse.urlencode({'id':gid,'pg':pid,'hl':'es'})
              item={'url':url}
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with opener.open(req,timeout=90) as r: body=r.read(); item.update(status=r.status,final_url=r.geturl(),bytes=len(body),content_type=r.headers.get('content-type',''))
                  text=html.unescape(body.decode('utf-8',errors='replace'))
                  (out/f'page-{pid}.html').write_text(text,encoding='utf-8')
                  item['title_hits']=text.lower().count('el papel social del maestro rural')
                  item['page_tokens']=list(dict.fromkeys(re.findall(r'(?<![A-Za-z0-9])((?:PA|PP|PR|PT|RA\d+-PA)\d+)(?![A-Za-z0-9])',text)))[:100]
                  urls=[]
                  for pat in [
                    r'https://books\.google\.com/books/content\?[^"\' <>]+',
                    r'https://books\.googleusercontent\.com/books/content\?[^"\' <>]+',
                    r'//books\.google\.com/books/content\?[^"\' <>]+',
                  ]:
                      urls.extend(re.findall(pat,text,re.I))
                  item['content_urls']=list(dict.fromkeys(u.replace('&amp;','&').replace('\\u0026','&') for u in urls))[:30]
                  # Gather contexts around current pid and image tokens.
                  contexts=[]
                  for token in [pid,'pageImage','pageImageUrl','imgtk','books/content','page_order','page_number']:
                      for m in list(re.finditer(re.escape(token),text,re.I))[:8]:
                          contexts.append(re.sub(r'\s+',' ',text[max(0,m.start()-300):m.end()+900]))
                  item['contexts']=contexts[:40]
              except Exception as exc:
                  item['error']=repr(exc)
              report['pages'][pid]=item
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-papel-social-google-page-index-probe
          path: probe-page-index/
          retention-days: 1
