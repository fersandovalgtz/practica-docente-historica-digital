name: Probe PDHD final Google Books primary pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrieve-p4-googlebooks-pdf.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SearchWithinVolume2 and selected-page HTML
        shell: python
        run: |
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          root = pathlib.Path("final-googlebooks-page-probe")
          root.mkdir()
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "es-MX,es;q=0.9,en;q=0.8",
          }
          targets = [
              ("PDHD-D000072", "ypWS82YskN4C", [
                  ("F000081", "111", "misiones culturales escuelas normales"),
                  ("F000082", "307", "psicopedagogia higiene"),
                  ("F000083", "487", "educacion tecnica rural"),
                  ("F000084", "465", "revalidacion estudios"),
              ]),
              ("PDHD-D000074", "KRV2_jMW8-wC", [
                  ("F000089", "372", "trabajo manual educacion integral"),
                  ("F000090", "21", "Consejo Nacional Educacion Superior Investigacion Cientifica"),
                  ("F000091", "444", "bibliotecas asistencia usuarios"),
                  ("F000092", "35", "distribucion becas"),
              ]),
          ]

          def get(url, timeout=60):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read(), r.status, r.headers.get("Content-Type", "")

          summary = []
          for doc, book_id, fragments in targets:
              d = root / doc
              d.mkdir()
              for frag, page, query in fragments:
                  fd = d / frag
                  fd.mkdir()
                  item = {"document_id": doc, "fragment_id": frag, "page": page, "query": query}

                  search_url = "https://www.google.com/books?id=" + urllib.parse.quote(book_id) + "&jscmd=SearchWithinVolume2&q=" + urllib.parse.quote(query)
                  try:
                      raw, status, ctype = get(search_url)
                      (fd / "search-within-volume.json").write_bytes(raw)
                      item["search_status"] = status
                      item["search_content_type"] = ctype
                      try:
                          item["search_json"] = json.loads(raw.decode("utf-8", errors="replace"))
                      except Exception:
                          item["search_preview"] = raw[:1200].decode("utf-8", errors="replace")
                  except Exception as exc:
                      item["search_error"] = f"{type(exc).__name__}: {exc}"

                  page_url = f"https://books.google.com/books?id={urllib.parse.quote(book_id)}&pg=PA{page}&hl=es&source=gbs_selected_pages&cad=1"
                  (fd / "page-url.txt").write_text(page_url, encoding="utf-8")
                  try:
                      raw, status, ctype = get(page_url)
                      (fd / "selected-page.html").write_bytes(raw)
                      item["page_status"] = status
                      item["page_content_type"] = ctype
                      text = html.unescape(raw.decode("utf-8", errors="replace"))
                      patterns = [
                          r'https?://[^"\'<> ]+/books/content\?[^"\'<> ]+',
                          r'https?://books\.googleusercontent\.com/[^"\'<> ]+',
                      ]
                      urls = []
                      for pattern in patterns:
                          for u in re.findall(pattern, text):
                              u = u.replace("\\u0026", "&").replace("\\x26", "&")
                              if u not in urls:
                                  urls.append(u)
                      item["image_url_count"] = len(urls)
                      for i, u in enumerate(urls[:30], start=1):
                          try:
                              body, st, ct = get(u, timeout=45)
                              if ct.startswith("image/") and len(body) > 5000:
                                  ext = ".png" if "png" in ct else ".jpg"
                                  (fd / f"embedded-image-{i:02d}{ext}").write_bytes(body)
                          except Exception:
                              pass
                  except Exception as exc:
                      item["page_error"] = f"{type(exc).__name__}: {exc}"

                  summary.append(item)

          (root / "summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2)[:30000])

      - name: Render selected Google Books pages in Chrome
        shell: bash
        run: |
          set -u
          chrome=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then chrome="$candidate"; break; fi
          done
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium found"
            exit 1
          fi
          echo "Using $chrome"
          find final-googlebooks-page-probe -name page-url.txt -print0 | while IFS= read -r -d '' f; do
            dir=$(dirname "$f")
            url=$(cat "$f")
            "$chrome" --headless --disable-gpu --no-sandbox --hide-scrollbars \
              --virtual-time-budget=12000 --window-size=1800,2400 \
              --screenshot="$dir/browser-page.png" "$url" || true
            ls -lh "$dir/browser-page.png" 2>/dev/null || true
          done

      - name: Upload one-day page-inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-final-googlebooks-page-probe
          path: final-googlebooks-page-probe/
          retention-days: 1
          if-no-files-found: error

      - name: Require browser evidence files
        shell: bash
        run: |
          count=$(find final-googlebooks-page-probe -type f \( -name 'browser-page.png' -o -name 'embedded-image-*' \) | wc -l)
          echo "Recovered $count browser/image evidence files"
          test "$count" -gt 0
