name: Test PDHD D074 alternate full-view volume

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrieve-p4-googlebooks-pdf.yml"

permissions:
  contents: read

jobs:
  test-alternate:
    runs-on: ubuntu-latest
    steps:
      - name: Cross-check alternate volume and recover primary evidence
        shell: python
        run: |
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          root = pathlib.Path("d074-alternate-review")
          root.mkdir()
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "es-MX,es;q=0.9,en;q=0.8",
          }
          book_id = "08ygAAAAMAAJ"
          queries = {
              "F000089": "trabajo manual educacion integral",
              "F000090": "Consejo Nacional Educacion Superior Investigacion Cientifica",
              "F000091": "asistencia usuarios bibliotecas",
              "F000092": "distribucion becas",
          }

          def get(url, timeout=90):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read(), r.status, r.headers.get("Content-Type", ""), r.geturl()

          report = {"book_id": book_id, "searches": {}, "download_attempts": []}

          # Metadata/About page as identity evidence.
          for label, url in [
              ("books", f"https://books.google.com/books?id={book_id}"),
              ("play", f"https://play.google.com/store/books/details?id={book_id}"),
          ]:
              try:
                  raw, st, ct, final = get(url)
                  (root / f"{label}.html").write_bytes(raw)
                  report[f"{label}_status"] = st
                  report[f"{label}_final_url"] = final
                  text = html.unescape(raw.decode("utf-8", errors="replace"))
                  report[f"{label}_title_hits"] = re.findall(r"Memoria[^<]{0,160}", text, flags=re.I)[:10]
                  report[f"{label}_year_hits"] = sorted(set(re.findall(r"19(?:3[5-9]|4[0-9])", text)))
              except Exception as exc:
                  report[f"{label}_error"] = f"{type(exc).__name__}: {exc}"

          # Search-within is used only as a crosswalk to page IDs; visual/PDF evidence is required to freeze.
          page_ids = set()
          for frag, query in queries.items():
              url = "https://www.google.com/books?id=" + book_id + "&jscmd=SearchWithinVolume2&q=" + urllib.parse.quote(query)
              try:
                  raw, st, ct, final = get(url)
                  data = json.loads(raw.decode("utf-8", errors="replace"))
                  report["searches"][frag] = data
                  (root / f"{frag}-search.json").write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
                  for hit in data.get("search_results", []):
                      pid = hit.get("page_id")
                      if pid:
                          page_ids.add(pid)
              except Exception as exc:
                  report["searches"][frag] = {"error": f"{type(exc).__name__}: {exc}"}

          # Inspect selected page HTML for any live download link.
          probe_pid = sorted(page_ids)[0] if page_ids else "PA1"
          selected = f"https://books.google.com/books?id={book_id}&pg={urllib.parse.quote(probe_pid)}&hl=es&source=gbs_selected_pages&cad=1"
          try:
              raw, st, ct, final = get(selected)
              (root / "selected-page.html").write_bytes(raw)
              text = html.unescape(raw.decode("utf-8", errors="replace"))
              candidates = []
              for pattern in [
                  r'https?://books\.google\.com/books/download/[^"\'<> ]+?\.pdf\?[^"\'<> ]+',
                  r'href=["\']([^"\']*?/books/download/[^"\']+?\.pdf\?[^"\']+)["\']',
              ]:
                  for m in re.findall(pattern, text):
                      u = m if isinstance(m, str) else m[0]
                      u = urllib.parse.urljoin("https://books.google.com", u).replace("\\u0026", "&")
                      if u not in candidates:
                          candidates.append(u)
              for u in candidates:
                  attempt = {"url": u}
                  try:
                      body, dst, dct, dfinal = get(u, timeout=120)
                      attempt.update({"status": dst, "content_type": dct, "bytes": len(body), "final_url": dfinal})
                      if body.startswith(b"%PDF") and len(body) > 100000:
                          (root / "alternate-primary.pdf").write_bytes(body)
                          attempt["saved"] = True
                  except Exception as exc:
                      attempt["error"] = f"{type(exc).__name__}: {exc}"
                  report["download_attempts"].append(attempt)
          except Exception as exc:
              report["selected_page_error"] = f"{type(exc).__name__}: {exc}"

          (root / "report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2)[:50000])

      - name: Upload one-day alternate-volume evidence
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d074-alternate-review
          path: d074-alternate-review/
          retention-days: 1
