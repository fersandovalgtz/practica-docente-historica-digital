name: Enumerate PDHD alternate Google Books editions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrieve-p4-googlebooks-pdf.yml"

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    steps:
      - name: Query Google Books API and test candidate editions
        shell: python
        run: |
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          out = pathlib.Path("alternate-editions")
          out.mkdir()
          headers = {"User-Agent": "Mozilla/5.0"}
          queries = [
              ("D072", 'intitle:"Memoria relativa al estado que guarda el ramo de educación pública" inauthor:"Secretaría de Educación Pública"'),
              ("D074", 'intitle:"Memoria de la Secretaría de Educación Pública" inauthor:"Secretaría de Educación Pública"'),
          ]

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode("utf-8", errors="replace"))

          rows = []
          for label, q in queries:
              seen = set()
              for start in range(0, 120, 40):
                  url = "https://www.googleapis.com/books/v1/volumes?q=" + urllib.parse.quote(q) + f"&maxResults=40&startIndex={start}"
                  try:
                      data = get_json(url)
                  except Exception as exc:
                      rows.append({"label": label, "query_error": f"{type(exc).__name__}: {exc}", "start": start})
                      continue
                  items = data.get("items", [])
                  if not items:
                      break
                  for item in items:
                      vid = item.get("id")
                      if not vid or vid in seen:
                          continue
                      seen.add(vid)
                      vi = item.get("volumeInfo", {})
                      ai = item.get("accessInfo", {})
                      sale = item.get("saleInfo", {})
                      rows.append({
                          "label": label,
                          "id": vid,
                          "title": vi.get("title"),
                          "subtitle": vi.get("subtitle"),
                          "authors": vi.get("authors"),
                          "publisher": vi.get("publisher"),
                          "publishedDate": vi.get("publishedDate"),
                          "pageCount": vi.get("pageCount"),
                          "printType": vi.get("printType"),
                          "viewability": ai.get("viewability"),
                          "embeddable": ai.get("embeddable"),
                          "publicDomain": ai.get("publicDomain"),
                          "textToSpeechPermission": ai.get("textToSpeechPermission"),
                          "pdfAvailable": ai.get("pdf", {}).get("isAvailable"),
                          "pdfDownloadLink": ai.get("pdf", {}).get("downloadLink"),
                          "epubAvailable": ai.get("epub", {}).get("isAvailable"),
                          "epubDownloadLink": ai.get("epub", {}).get("downloadLink"),
                          "webReaderLink": ai.get("webReaderLink"),
                          "saleability": sale.get("saleability"),
                          "isEbook": sale.get("isEbook"),
                      })

          (out / "editions.json").write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding="utf-8")
          for r in rows:
              if r.get("id"):
                  print(json.dumps(r, ensure_ascii=False))

      - name: Upload one-day enumeration artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-alternate-editions
          path: alternate-editions/
          retention-days: 1
