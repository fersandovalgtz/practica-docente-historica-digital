name: Finalize PDHD-U1 closure

on:
  push:
    branches: [work/close-d072-pilot-20260907]
    paths:
      - ".github/workflows/finalize-d072-closure.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse validated scientific apply logic and fix canonical status phrase
        shell: python
        run: |
          import pathlib, textwrap
          workflow = pathlib.Path('.github/workflows/probe-d072-surrogate-1926.yml')
          src = workflow.read_text(encoding='utf-8')
          start_marker = '      - name: Apply versioned position-21 substitution\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Run complete PDHD validation suite\n'
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          code = textwrap.dedent(src[start:end])
          exec(compile(code, str(workflow), 'exec'), {'__name__':'__main__'})

          path = pathlib.Path('docs/PDHD_U1_COHORT_STATUS.md')
          text = path.read_text(encoding='utf-8')
          old = 'The final substitution preserves the unlocalized complement at 0.'
          new = 'The final substitution closes the package while preserving the unlocalized complement at 0.'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one status phrase to repair, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Neither temporary workflow belongs in the final scientific tree.
          for p in [pathlib.Path('.github/workflows/probe-d072-surrogate-1926.yml'), pathlib.Path('.github/workflows/finalize-d072-closure.yml')]:
              if p.exists(): p.unlink()

      - name: Run complete PDHD validation suite
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/validate_repository.py
          python scripts/validate_object_aliases.py
          python scripts/validate_content_leads.py
          python scripts/validate_retrieval_attempts.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_freeze_conversion_queue.py
          python scripts/prepare_freeze_review.py --check
          python scripts/validate_status_counts.py
          python scripts/annotation_agreement.py --self-test
          python scripts/build_fragment_manifest.py --check
          git diff --check

      - name: Commit validated scientific closure
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Fernando Sandoval"
          git config user.email "fernando.sandoval@uacj.mx"
          git add -A
          git diff --cached --stat
          git commit -m "Close PDHD-U1 pilot at 96/96 frozen [skip ci]"
          git push origin HEAD:work/close-d072-pilot-20260907
