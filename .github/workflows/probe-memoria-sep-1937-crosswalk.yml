name: Probe Memoria SEP 1937 exact-volume crosswalk

on:
  push:
    branches: [freeze-memoria-sep-1937]
    paths:
      - ".github/workflows/probe-memoria-sep-1937-crosswalk.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Crosswalk exact Google volume through bibliographic identifiers
        shell: python
        run: |
          import html,json,pathlib,re,urllib.parse,urllib.request,urllib.error
          out=pathlib.Path('memoria-sep-1937-crosswalk'); out.mkdir()
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1','Accept-Language':'es-MX,es;q=0.9,en;q=0.8'}
          bid='KRV2_jMW8-wC'
          result={'google_id':bid}

          # Exact Google BibTeX export.
          biburl=f'https://books.google.com/books/download/Memoria_de_la_Secretar%C3%ADa_de_Educaci%C3%B3n.bibtex?id={bid}&hl=es&output=bibtex'
          try:
              req=urllib.request.Request(biburl,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: bib=r.read().decode('utf-8',errors='replace')
              (out/'exact.bib').write_text(bib,encoding='utf-8')
              result['bibtex']=bib
          except Exception as exc: result['bibtex_error']=repr(exc); bib=''
          raw=bib
          oclcs=sorted(set(re.findall(r'(?i)(?:oclc|worldcat)[^0-9]{0,30}([0-9]{5,12})',raw)))
          lccns=sorted(set(re.findall(r'(?i)lccn[^0-9]{0,30}([0-9]{6,12})',raw)))
          result['oclcs']=oclcs; result['lccns']=lccns

          # The Google 'all editions' family page, then parse every embedded edition object dated 1937.
          editions_url=f'https://books.google.com/books?q=editions:LCCN2007238958&id={bid}&hl=es'
          try:
              req=urllib.request.Request(editions_url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: ed=r.read().decode('utf-8',errors='replace')
              ed=html.unescape(ed); (out/'editions.html').write_text(ed,encoding='utf-8')
              ids=sorted(set(re.findall(r'https://books\.google\.com/books\?id=([A-Za-z0-9_-]{12})',ed)))
              result['edition_ids']=ids
          except Exception as exc: result['editions_error']=repr(exc); ids=[]

          probes=[]
          for x in ids:
              item={'id':x}
              for pg in ['PA1','PA40','PA41','PA371','PA444']:
                  try:
                      url=f'https://books.google.com/books?id={x}&pg={pg}'
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=45) as r: body=r.read()
                      t=html.unescape(body.decode('utf-8',errors='replace'))
                      if pg=='PA1':
                          m=re.search(r'<span dir=ltr>([^<]+)</span>\s*,?\s*</?[^>]*>?\s*(19\d{2})',t)
                          item['html_bytes']=len(body)
                          item['mentions_1937']='1937' in t
                          item['volume2']='Volumen 2' in t or 'Volume 2' in t
                          for key in ['is_browsable','is_public_domain','can_download_pdf','has_scanned_text','is_ebook']:
                              mm=re.search(rf'"?{key}"?\s*[:=]\s*(true|false)',t,re.I)
                              if mm: item[key]=mm.group(1).lower()=='true'
                      urls=re.findall(r'https?://books\.google\.com/books/download/[^\"\s<>]+?\.pdf\?[^\"\s<>]+',t)
                      if urls: item.setdefault('pdf_pages',[]).append(pg)
                      item.setdefault('page_status',{})[pg]=200
                  except urllib.error.HTTPError as exc: item.setdefault('page_status',{})[pg]=exc.code
                  except Exception as exc: item.setdefault('page_errors',{})[pg]=repr(exc)
              probes.append(item)
          result['edition_probes']=probes

          # Crosswalk every discovered OCLC to HathiTrust volume API and Internet Archive.
          hathi=[]; ia=[]
          for oclc in oclcs:
              try:
                  url=f'https://catalog.hathitrust.org/api/volumes/full/oclc/{oclc}.json'
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=60) as r: obj=json.loads(r.read().decode())
                  hathi.append({'oclc':oclc,'response':obj})
              except Exception as exc: hathi.append({'oclc':oclc,'error':repr(exc)})
              try:
                  q=f'(external-identifier:(urn:oclc:record:{oclc}) OR oclc-id:{oclc} OR identifier-access:{oclc})'
                  params=urllib.parse.urlencode({'q':q,'fl[]':['identifier','title','creator','date','year','external-identifier','identifier-ark','oclc-id'],'rows':100,'output':'json'},doseq=True)
                  req=urllib.request.Request('https://archive.org/advancedsearch.php?'+params,headers=headers)
                  with urllib.request.urlopen(req,timeout=60) as r: obj=json.loads(r.read().decode())
                  ia.append({'oclc':oclc,'numFound':obj.get('response',{}).get('numFound'),'docs':obj.get('response',{}).get('docs',[])})
              except Exception as exc: ia.append({'oclc':oclc,'error':repr(exc)})
          result['hathi']=hathi; result['internet_archive']=ia

          # Broad IA exact-title fallback.
          try:
              q='title:("Memoria de la Secretaria de Educacion Publica") AND year:1937'
              params=urllib.parse.urlencode({'q':q,'fl[]':['identifier','title','creator','date','year','external-identifier','identifier-ark','oclc-id'],'rows':100,'output':'json'},doseq=True)
              req=urllib.request.Request('https://archive.org/advancedsearch.php?'+params,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.loads(r.read().decode())
              result['ia_title_search']={'numFound':obj.get('response',{}).get('numFound'),'docs':obj.get('response',{}).get('docs',[])}
          except Exception as exc: result['ia_title_error']=repr(exc)

          (out/'crosswalk.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))

      - name: Upload crosswalk artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-memoria-sep-1937-crosswalk
          path: memoria-sep-1937-crosswalk/
          retention-days: 1
