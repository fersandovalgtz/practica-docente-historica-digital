name: Retrieve PDHD La Enseñanza Moderna 1907

on:
  push:
    branches:
      - retrieve-ensenanza-moderna-1907
    paths:
      - ".github/workflows/retrieve-ensenanza-moderna-1907.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact BVMC issue PDF
        shell: python
        run: |
          import pathlib, urllib.request
          out = pathlib.Path('ensenanza-moderna-1907-review')
          out.mkdir()
          url = 'https://www.cervantesvirtual.com/descargaPdf/la-ensenanza-moderna-revista-pedagogica-tomo-i-segunda-epoca-num-1-1-de-julio-de-1907-1259032/'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
          })
          with urllib.request.urlopen(req, timeout=120) as response:
              body = response.read()
          if not body.startswith(b'%PDF') or len(body) < 100000:
              raise SystemExit(f'BVMC response is not a usable PDF: {len(body)} bytes')
          (out / 'issue.pdf').write_bytes(body)
          print(f'Downloaded {len(body)} bytes')

      - name: Render every page and extract retrieval text
        run: |
          set -euo pipefail
          out='ensenanza-moderna-1907-review'
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfinfo "$out/issue.pdf" | tee "$out/pdfinfo.txt"
          pdftotext -layout "$out/issue.pdf" "$out/issue.txt" || true
          mkdir -p "$out/rendered"
          PAGES=$(pdfinfo "$out/issue.pdf" | awk '/^Pages:/ {print $2}')
          pdftoppm -f 1 -l "$PAGES" -jpeg -r 170 "$out/issue.pdf" "$out/rendered/page" >/dev/null 2>&1
          grep -ni -E 'enseñ|métod|metod|lecci|alumn|niñ|escuela|maestr|profesor|ejercicio|práctic|practic|didáct|didact|educa' "$out/issue.txt" | head -n 300 > "$out/retrieval-hits.txt" || true
          ls -lh "$out/rendered" | head

      - name: Upload one-day review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-ensenanza-moderna-1907-review
          path: ensenanza-moderna-1907-review/
          retention-days: 1
          if-no-files-found: error
