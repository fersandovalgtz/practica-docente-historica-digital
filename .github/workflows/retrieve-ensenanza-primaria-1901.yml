name: Retrieve PDHD La Enseñanza Primaria 1901 target pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Resolve live Google Books PDF
        run: |
          python - <<'PY'
          from html import unescape
          from pathlib import Path
          from urllib.request import Request, urlopen
          import re

          landing = 'https://books.google.com/books/about/La_Ense%C3%B1anza_primaria.html?id=8A4huXQWEs8C'
          req = Request(landing, headers={'User-Agent':'Mozilla/5.0'})
          html = urlopen(req, timeout=60).read().decode('utf-8', 'replace')
          Path('landing.html').write_text(html, encoding='utf-8')

          patterns = [
              r'https://books\.google\.com/books/download/[^"\']+?output=pdf[^"\']+',
              r'/books/download/[^"\']+?output=pdf[^"\']+',
          ]
          found = None
          for pat in patterns:
              m = re.search(pat, html)
              if m:
                  found = unescape(m.group(0))
                  break
          if not found:
              raise SystemExit('No live Google Books PDF link found in landing HTML')
          if found.startswith('/'):
              found = 'https://books.google.com' + found
          Path('pdf_url.txt').write_text(found, encoding='utf-8')
          print('Resolved live PDF URL')
          PY

      - name: Download and validate primary volume
        run: |
          URL="$(cat pdf_url.txt)"
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$URL" -o volume.pdf
          file volume.pdf
          pdfinfo volume.pdf | tee pdfinfo.txt
          test "$(stat -c%s volume.pdf)" -gt 1000000

      - name: Extract page map and locate target articles
        run: |
          pdftotext -layout volume.pdf volume.txt || true
          python - <<'PY'
          from pathlib import Path
          import re, unicodedata

          raw = Path('volume.txt').read_text(encoding='utf-8', errors='replace') if Path('volume.txt').exists() else ''
          pages = raw.split('\f')
          def norm(s):
              s = unicodedata.normalize('NFD', s)
              s = ''.join(c for c in s if unicodedata.category(c) != 'Mn')
              s = s.lower()
              s = re.sub(r'\s+', ' ', s)
              return s

          targets = {
              'ejercicios_fisicos': ['ejercicios fisicos', 'ejercicios físicos'],
              'metodo_libros_texto': ['metodo en los libros de texto', 'método en los libros de texto'],
              'ponciano_rodriguez': ['ponciano rodriguez', 'ponciano rodríguez'],
              'gregorio_torres_quintero': ['gregorio torres quintero'],
          }
          hits = {k: [] for k in targets}
          lines = []
          for i, page in enumerate(pages, 1):
              n = norm(page)
              preview = re.sub(r'\s+', ' ', page).strip()[:240]
              lines.append(f'{i:04d}\t{preview}')
              for key, needles in targets.items():
                  if any(norm(x) in n for x in needles):
                      hits[key].append(i)
          Path('page_map.tsv').write_text('\n'.join(lines), encoding='utf-8')
          Path('target_hits.txt').write_text('\n'.join(f'{k}: {v}' for k,v in hits.items()), encoding='utf-8')
          print(hits)
          PY

      - name: Render target neighborhood
        run: |
          mkdir -p rendered
          TOTAL=$(pdfinfo volume.pdf | awk '/^Pages:/ {print $2}')
          # Printed pp. 161-168 should lie near this physical-page window even with front matter.
          START=150
          END=190
          if [ "$TOTAL" -lt "$END" ]; then END="$TOTAL"; fi
          pdftoppm -f "$START" -l "$END" -jpeg -r 150 volume.pdf rendered/page >/dev/null 2>&1
          ls -lh rendered | head

      - name: Record repository locator path for F000027
        run: |
          grep -R -n 'PDHD-F000027' data/samples/fragment_locator_progress*.csv > f000027_locator_path.txt || true
          cat f000027_locator_path.txt

      - name: Upload one-day primary-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-ensenanza-primaria-1901-review
          path: |
            pdfinfo.txt
            page_map.tsv
            target_hits.txt
            f000027_locator_path.txt
            rendered/
          retention-days: 1
