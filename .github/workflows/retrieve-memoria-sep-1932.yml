name: Probe Memoria SEP 1932 public page routes

on:
  push:
    branches: [freeze-memoria-sep-1932]
    paths:
      - ".github/workflows/retrieve-memoria-sep-1932.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public Google Books interfaces
        shell: python
        run: |
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          out = pathlib.Path('memoria-sep-1932-primary-review')
          out.mkdir()
          book_id = 'ypWS82YskN4C'
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9,es;q=0.8',
          }
          report = []

          def fetch(label, url, accept=None):
              row = {'label': label, 'url': url}
              try:
                  h = dict(headers)
                  if accept:
                      h['Accept'] = accept
                  req = urllib.request.Request(url, headers=h)
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read()
                      row['status'] = response.status
                      row['content_type'] = response.headers.get('Content-Type', '')
                      row['bytes'] = len(body)
                      row['final_url'] = response.geturl()
                  suffix = '.json' if ('json' in row['content_type'].lower() or body.lstrip().startswith((b'{', b'['))) else '.html'
                  path = out / f'{label}{suffix}'
                  path.write_bytes(body)
                  row['saved'] = path.name
                  if suffix == '.json':
                      try:
                          parsed = json.loads(body.decode('utf-8', errors='replace'))
                          if isinstance(parsed, dict):
                              row['top_keys'] = list(parsed)[:30]
                              row['number_of_results'] = parsed.get('number_of_results')
                      except Exception as exc:
                          row['json_parse_error'] = f'{type(exc).__name__}: {exc}'
              except Exception as exc:
                  row['error'] = f'{type(exc).__name__}: {exc}'
              report.append(row)

          fetch('selected_PA111', f'https://books.google.com/books?id={book_id}&pg=PA111')
          fetch('selected_PA307', f'https://books.google.com/books?id={book_id}&pg=PA307')
          fetch('selected_PA465', f'https://books.google.com/books?id={book_id}&pg=PA465')
          fetch('selected_PA487', f'https://books.google.com/books?id={book_id}&pg=PA487')
          fetch('volume_api', f'https://www.googleapis.com/books/v1/volumes/{book_id}', 'application/json')

          queries = {
              'misiones': 'misiones culturales escuelas normales',
              'psicopedagogia': 'psicopedagogía higiene',
              'revalidacion': 'revalidación estudios',
              'costos': 'enseñanza técnica primaria rural costo',
          }
          for key, query in queries.items():
              q = urllib.parse.quote_plus(query)
              fetch(
                  f'search_books_{key}',
                  f'https://books.google.com/books?id={book_id}&jscmd=SearchWithinVolume2&q={q}',
                  'application/json',
              )
              fetch(
                  f'search_google_{key}',
                  f'https://www.google.com/books?id={book_id}&jscmd=SearchWithinVolume2&q={q}',
                  'application/json',
              )

          (out / 'probe-report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))

      - name: Summarize page identifiers found in public responses
        shell: python
        run: |
          import json
          import pathlib
          import re

          out = pathlib.Path('memoria-sep-1932-primary-review')
          summary = {}
          patterns = [
              r'"page_id"\s*:\s*"([^"]+)"',
              r'"pageId"\s*:\s*"([^"]+)"',
              r'"pid"\s*:\s*"([^"]+)"',
              r'[?&]pg=([A-Z0-9_-]+)',
          ]
          for path in sorted(out.iterdir()):
              if not path.is_file() or path.name in {'probe-report.json', 'page-id-summary.json'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              ids = []
              for pattern in patterns:
                  ids.extend(re.findall(pattern, text))
              # Keep order while deduplicating.
              seen = set()
              uniq = []
              for item in ids:
                  if item not in seen:
                      seen.add(item)
                      uniq.append(item)
              summary[path.name] = uniq[:100]
          (out / 'page-id-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))

      - name: Upload one-day probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-memoria-sep-1932-primary-probe
          path: memoria-sep-1932-primary-review/
          retention-days: 1
          if-no-files-found: error
