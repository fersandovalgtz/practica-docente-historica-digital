name: Finalize Memoria SEP 1934 batch

on:
  push:
    branches: [freeze-memoria-sep-1934]
    paths:
      - ".github/workflows/finalize-memoria-sep-1934.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-memoria-sep-1934
          fetch-depth: 0

      - name: Freeze four primary-verified fragments
        shell: python
        run: |
          import csv
          from pathlib import Path

          loc_path = Path('data/samples/fragment_locator_progress_0_1.csv')
          with loc_path.open(encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              rows = list(reader)

          updates = {
              'PDHD-F000085': {
                  'document_id': 'PDHD-D000073', 'slot': 'A', 'page': '29',
                  'source_locator': 'p29-ciencias-naturales-observacion-cultivo-visita',
                  'locator_evidence_url': 'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PA29',
                  'boundary_status': 'fixed', 'public_text_status': 'metadata_only', 'freeze_status': 'frozen',
                  'preparation_note': 'Direct inspection of the exact 1934 volume-II primary PDF fixes printed p. 29: subsection e) Ciencias Naturales only, from its heading through the final sentence directing teachers to follow the order suggested by the Inspector; exclude the preceding geometry paragraph and following item 8 on manual work. Google Books PA29 is order 36 and maps to physical PDF page 39. The secondary page pointer served only for discovery; the final pedagogical span comes from the primary image.',
                  'checked_at': '2026-09-06'
              },
              'PDHD-F000086': {
                  'document_id': 'PDHD-D000073', 'slot': 'B', 'page': '53',
                  'source_locator': 'p53-federal-programs-teacher-designation-enforcement',
                  'locator_evidence_url': 'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PA53',
                  'boundary_status': 'fixed', 'public_text_status': 'metadata_only', 'freeze_status': 'frozen',
                  'preparation_note': 'Direct primary inspection fixes printed p. 53: from the opening continuation that subjects these schools to federal programs and federal teacher designation through the paragraph explaining the enforcement authority created for the Secretaría de Educación Pública after Article 428 bis; stop before the paragraph beginning En lo que concierne al Departamento de Enseñanza Rural. Google Books PA53 is order 60 and physical PDF page 63. This replaces the weaker secondary inspector-expansion description with a directly visible institutional-authority unit.',
                  'checked_at': '2026-09-06'
              },
              'PDHD-F000087': {
                  'document_id': 'PDHD-D000073', 'slot': 'C', 'page': '58',
                  'source_locator': 'p58-selection-supervision-cooperation-federalization',
                  'locator_evidence_url': 'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PA58',
                  'boundary_status': 'fixed', 'public_text_status': 'metadata_only', 'freeze_status': 'frozen',
                  'preparation_note': 'Direct primary inspection fixes printed p. 58, instructions 3 through 8 in full: teacher selection, federal appointment, organization of new schools, monthly reporting, inspector supervision, teacher attendance at pedagogical cooperation/orientation meetings and the resulting federal employment protections. Exclude the opening continuation from instruction 2 and the closing salutation/new Document 9. Google Books PA58 is order 65 and physical PDF page 68. Retained as a source-critical unit on the administrative mechanics of federalization.',
                  'checked_at': '2026-09-06'
              },
              'PDHD-F000088': {
                  'document_id': 'PDHD-D000073', 'slot': 'D', 'page': 'PP7',
                  'source_locator': 'pp7-1934-volume-ii-title-page-control',
                  'locator_evidence_url': 'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PP7',
                  'boundary_status': 'fixed', 'public_text_status': 'metadata_only', 'freeze_status': 'frozen',
                  'preparation_note': 'Direct primary inspection replaces the secondary preliminary-page pointer with a deliberately non-analytical control. Google Books PP7 is order 6 and maps to physical PDF page 9. The fixed span is the textual bibliographic core identifying Secretaría de Educación Pública, Memoria relativa al estado que guarda el ramo de Educación Pública, 31 de agosto de 1934, Tomo II Documentos, Talleres Gráficos de la Nación and México 1934; exclude library marks, emblem, margins and Google digitization watermark.',
                  'checked_at': '2026-09-06'
              },
          }

          seen = set()
          for row in rows:
              fid = row['fragment_id']
              if fid in updates:
                  row.update(updates[fid])
                  seen.add(fid)
          missing = set(updates) - seen
          if missing:
              raise SystemExit(f'Missing locator rows: {sorted(missing)}')
          with loc_path.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          frozen_path = Path('data/samples/frozen_fragments_0_1.csv')
          with frozen_path.open(encoding='utf-8', newline='') as f:
              fr = csv.DictReader(f); ffields = fr.fieldnames; frows = list(fr)
          existing = {r['fragment_id'] for r in frows}
          new_rows = [
              {
                  'fragment_id':'PDHD-F000085','document_id':'PDHD-D000073','slot':'A','page':'29',
                  'source_locator':'p29-ciencias-naturales-observacion-cultivo-visita','locator_evidence_url':'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PA29',
                  'boundary_definition':'Printed p. 29: subsection e) Ciencias Naturales only, from its heading through the sentence directing that the teaching follow the order suggested by the Inspector; exclude the preceding geometry paragraph and stop before item 8, Trabajos manuales.',
                  'transcription_status':'not_transcribed','access_basis':'Google_Books_direct_primary_pdf_image_inspection','public_text_status':'metadata_only','selection_role':'explicit_pedagogical_act','freeze_status':'frozen',
                  'preparation_note':'The alternate Google Books full-view object mHgQAAAAYAAJ was identity-gated against its primary front matter, which explicitly states 31 de agosto de 1934 and Tomo II Documentos. PA29 is order 36 and physical PDF page 39. Direct visual inspection fixes a compact natural-science teaching prescription based on collecting, observing, cultivating and visiting local work; no source text or image is committed.','checked_at':'2026-09-06'
              },
              {
                  'fragment_id':'PDHD-F000086','document_id':'PDHD-D000073','slot':'B','page':'53',
                  'source_locator':'p53-federal-programs-teacher-designation-enforcement','locator_evidence_url':'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PA53',
                  'boundary_definition':'Printed p. 53: from the opening continuation specifying federal programs and federal appointment of teachers through Article 334, Article 428 bis and the following paragraph explaining SEP enforcement authority; stop before the paragraph beginning En lo que concierne al Departamento de Enseñanza Rural.',
                  'transcription_status':'not_transcribed','access_basis':'Google_Books_direct_primary_pdf_image_inspection','public_text_status':'metadata_only','selection_role':'institutional_relation','freeze_status':'frozen',
                  'preparation_note':'Google Books PA53 is order 60 and physical PDF page 63. Direct visual inspection fixes the federal relation among official curricula, teacher designation, monitoring and sanctioning authority as a bounded institutional unit. The earlier secondary pointer did not determine the final boundary. No source text or image is committed.','checked_at':'2026-09-06'
              },
              {
                  'fragment_id':'PDHD-F000087','document_id':'PDHD-D000073','slot':'C','page':'58',
                  'source_locator':'p58-selection-supervision-cooperation-federalization','locator_evidence_url':'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PA58',
                  'boundary_definition':'Printed p. 58: instructions 3 through 8 in full, beginning with careful teacher selection and ending with the inamovilidad/escalafón protections of teachers transferred to federal control; exclude the preceding continuation of instruction 2 and the closing salutation plus Document 9.',
                  'transcription_status':'not_transcribed','access_basis':'Google_Books_direct_primary_pdf_image_inspection','public_text_status':'metadata_only','selection_role':'source_criticism_salient','freeze_status':'frozen',
                  'preparation_note':'Google Books PA58 is order 65 and physical PDF page 68. The primary page makes visible the linked administrative sequence of teacher selection, appointment, reporting, inspector supervision, pedagogical cooperation meetings and federal employment status. The span is retained for source criticism of federalization as an administrative process rather than treated as a neutral description. No source text or image is committed.','checked_at':'2026-09-06'
              },
              {
                  'fragment_id':'PDHD-F000088','document_id':'PDHD-D000073','slot':'D','page':'PP7',
                  'source_locator':'pp7-1934-volume-ii-title-page-control','locator_evidence_url':'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PP7',
                  'boundary_definition':'Front-matter leaf PP7 / physical PDF page 9: textual bibliographic core from Secretaría de Educación Pública through the title, 31 de agosto de 1934, Tomo II Documentos, Talleres Gráficos de la Nación and México 1934; exclude library marks, national emblem, blank margins and Google digitization watermark.',
                  'transcription_status':'not_transcribed','access_basis':'Google_Books_direct_primary_pdf_image_inspection','public_text_status':'metadata_only','selection_role':'control','freeze_status':'frozen',
                  'preparation_note':'Google Books PP7 is order 6 and physical PDF page 9. Direct visual inspection confirms the exact 1934 volume identity. This clean bibliographic control deliberately replaces the secondary p. XVI pointer, which was analytically loaded and not needed for slot D. The competing full-view object 6aYQAAAAYAAJ was rejected because its primary title pages identify 1935 despite catalog metadata suggesting 1934. No source image is committed.','checked_at':'2026-09-06'
              },
          ]
          for r in new_rows:
              if r['fragment_id'] not in existing:
                  frows.append(r)
          with frozen_path.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=ffields, lineterminator='\n')
              w.writeheader(); w.writerows(frows)

      - name: Synchronize status documentation
        shell: python
        run: |
          from pathlib import Path
          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8')
          s = s.replace('| Fragmentos completamente congelados | **41 / 96** |', '| Fragmentos completamente congelados | **45 / 96** |')
          anchor = 'La *Memoria de la Secretaría de Educación Pública* de 1938 (`PDHD-D000075`) suma también un lote completo A–D tras recuperar un PDF de 1,021 imágenes y resolver su estructura multivolumen.'
          if anchor not in s:
              raise SystemExit('README anchor missing')
          para = "\n\nLa *Memoria relativa al estado que guarda el ramo de Educación Pública* de 1934, tomo II (`PDHD-D000073`), completa también A–D desde el objeto primario Google Books `mHgQAAAAYAAJ`. La recuperación fue sometida a un gate de identidad porque otra edición etiquetada externamente como 1934 (`6aYQAAAAYAAJ`) contiene portadas primarias de 1935 y fue descartada. En la copia correcta, `PDHD-F000085` fija p. 29 (`PA29`) como acto didáctico de ciencias naturales; `PDHD-F000086` p. 53 (`PA53`) como relación institucional de programas, designación docente y autoridad federal; `PDHD-F000087` p. 58 (`PA58`) como unidad de crítica de fuentes sobre selección, supervisión, cooperación pedagógica y federalización; y `PDHD-F000088` usa `PP7` como control bibliográfico del tomo II de 1934.\n"
          marker = '\n\nComo HNDM permanece `metadata_only`'
          if para.strip() not in s:
              s = s.replace(marker, para + marker)
          readme.write_text(s, encoding='utf-8')

          status = Path('docs/PDHD_U1_COHORT_STATUS.md')
          t = status.read_text(encoding='utf-8')
          t = t.replace('| Fully frozen fragments | **41 / 96** |', '| Fully frozen fragments | **45 / 96** |')
          t = t.replace('Thirty units have crossed the stronger frozen-fragment gate.', 'Forty-five units have crossed the stronger frozen-fragment gate.')
          t = t.replace('Six selected documents now have complete four-slot batches.', 'Ten selected documents now have complete four-slot batches.')
          t = t.replace('The union of all `fragment_locator_progress*.csv` shards contains **83/96** pilot slots. Thirty are frozen. The remaining **42** located rows', 'The union of all `fragment_locator_progress*.csv` shards contains **83/96** pilot slots. Forty-five are frozen. The remaining **38** located rows')
          anchor2 = 'All third-party image-derived frozen records remain conservative in public handling.'
          note = "`PDHD-D000073`, the 1934 SEP memory, now contributes a complete four-slot batch from the primary Google Books copy `mHgQAAAAYAAJ`. Direct inspection maps printed pp. 29, 53 and 58 to physical PDF pages 39, 63 and 68, while `PP7` maps to physical page 9 and supplies the bibliographic control. A competing Google Books full-view object was explicitly rejected after its primary title pages identified 1935, preserving primary-page identity over catalog metadata.\n\n"
          if note.strip() not in t:
              t = t.replace(anchor2, note + anchor2)
          status.write_text(t, encoding='utf-8')

      - name: Run validators
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_status_counts.py

      - name: Commit finalized batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PDHD source verification'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md data/samples/fragment_locator_progress_0_1.csv data/samples/frozen_fragments_0_1.csv docs/PDHD_U1_COHORT_STATUS.md
          git commit -m 'Freeze Memoria SEP 1934 batch'
          git push origin HEAD:freeze-memoria-sep-1934
