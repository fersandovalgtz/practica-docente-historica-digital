name: Package PDHD academic dataset

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/package-dataset.yml
      - data/snapshots/dataset_deposit_manifest_0_1.json
      - docs/academic_products/PDHD_DATASET_DEPOSIT_0_1.md
      - docs/academic_products/PDHD_ZENODO_METADATA_0_1.json

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Rebuild and verify canonical Zenodo archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_SOURCE_COMMIT="$(python - <<'PY'
          import json
          with open('data/snapshots/dataset_deposit_manifest_0_1.json', encoding='utf-8') as fh:
              print(json.load(fh)['archive_source_commit'])
          PY
          )"
          EXPECTED_SHA256="$(python - <<'PY'
          import json
          with open('data/snapshots/dataset_deposit_manifest_0_1.json', encoding='utf-8') as fh:
              print(json.load(fh)['integrity']['archive_sha256'])
          PY
          )"
          EXPECTED_FILENAME="$(python - <<'PY'
          import json
          with open('data/snapshots/dataset_deposit_manifest_0_1.json', encoding='utf-8') as fh:
              print(json.load(fh)['integrity']['archive_filename'])
          PY
          )"

          test -n "$ARCHIVE_SOURCE_COMMIT"
          test -n "$EXPECTED_SHA256"
          test -n "$EXPECTED_FILENAME"

          git fetch --no-tags --depth=1 origin "$ARCHIVE_SOURCE_COMMIT"
          git checkout --detach "$ARCHIVE_SOURCE_COMMIT"

          export ARCHIVE_SOURCE_COMMIT EXPECTED_SHA256 EXPECTED_FILENAME

          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import zipfile

          root = pathlib.Path('.')
          dist = root / 'dist'
          package_root = dist / 'PDHD-U1-dataset-0.1.0-prevalidation'
          if dist.exists():
              shutil.rmtree(dist)
          package_root.mkdir(parents=True)

          manifest_path = root / 'data/snapshots/dataset_deposit_manifest_0_1.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          files = list(manifest['minimum_archival_surfaces'])
          files.extend([
              'data/snapshots/dataset_deposit_manifest_0_1.json',
              'docs/academic_products/PDHD_DATASET_DEPOSIT_0_1.md',
              'docs/academic_products/PDHD_ZENODO_METADATA_0_1.json',
          ])
          files = sorted(set(files))

          missing = [p for p in files if not (root / p).is_file()]
          if missing:
              raise SystemExit('Missing archival surfaces: ' + ', '.join(missing))

          for rel in files:
              src = root / rel
              dst = package_root / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dst)

          readme = package_root / 'README_DEPOSIT.txt'
          readme.write_text(
              'PDHD-U1 academic dataset archive\n'
              'Version: 0.1.0-prevalidation\n'
              f'Dataset payload commit: {manifest["dataset_payload_commit"]}\n'
              'Scientific snapshot: PDHD-U1-PREVALIDATION-0.1-20260907\n'
              'Human-coded fragments: 0\n'
              'Gold labels: 0\n'
              'Rights: see DATA_LICENSE.md, RIGHTS.md and data/catalog/rights_registry.csv\n',
              encoding='utf-8'
          )

          archive = dist / os.environ['EXPECTED_FILENAME']
          epoch = (1980, 1, 1, 0, 0, 0)
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(p for p in package_root.rglob('*') if p.is_file()):
                  rel = path.relative_to(dist).as_posix()
                  info = zipfile.ZipInfo(rel, epoch)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = os.environ['EXPECTED_SHA256']
          if digest != expected:
              raise SystemExit(f'Canonical archive SHA-256 mismatch: expected {expected}, got {digest}')

          checksum = dist / (archive.name + '.sha256')
          checksum.write_text(f'{digest}  {archive.name}\n', encoding='utf-8')

          verification = {
              'archive_filename': archive.name,
              'sha256': digest,
              'archive_source_commit': os.environ['ARCHIVE_SOURCE_COMMIT'],
              'dataset_payload_commit': manifest['dataset_payload_commit'],
              'scientific_snapshot_id': manifest['scientific_snapshot_id'],
              'file_count': len(files) + 1,
              'verification_status': 'matches_manifest_sha256',
          }
          (dist / 'archive_verification.json').write_text(
              json.dumps(verification, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(verification, indent=2))
          PY

          unzip -t "dist/$EXPECTED_FILENAME"

      - name: Upload dataset package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdhd-u1-zenodo-deposit-package
          path: |
            dist/PDHD-U1-dataset-0.1.0-prevalidation.zip
            dist/PDHD-U1-dataset-0.1.0-prevalidation.zip.sha256
            dist/archive_verification.json
          if-no-files-found: error
          retention-days: 90
