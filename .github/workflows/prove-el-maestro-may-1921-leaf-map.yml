name: Prove El Maestro May 1921 IA leaf map

on:
  push:
    branches: [freeze-el-maestro-may-1921]

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image/PDF comparison utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils imagemagick
      - name: Match exact PDF pages to public IA leaf derivatives
        shell: python
        run: |
          import json, pathlib, subprocess, urllib.request, urllib.parse
          out=pathlib.Path('el-maestro-leaf-map'); out.mkdir()
          ident='el-maestro.-revista-de-cultura-nacional-n-2-1921'
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=120) as r:
                  return r.read(),r.headers.get('content-type',''),r.status,r.geturl()

          meta=json.loads(get(f'https://archive.org/metadata/{urllib.parse.quote(ident)}')[0].decode())
          textpdf=next((f['name'] for f in meta.get('files',[]) if f.get('name','').endswith('_text.pdf')),None)
          if not textpdf: raise SystemExit('no exact issue text PDF')
          pdf_bytes,ct,_,_=get('https://archive.org/download/'+ident+'/'+urllib.parse.quote(textpdf))
          pdf=out/'issue.pdf'; pdf.write_bytes(pdf_bytes)
          if not pdf_bytes.startswith(b'%PDF'): raise SystemExit('bad PDF')

          anchors={39:133,51:145,53:147,79:173}
          report={}
          for pdf_page,printed in anchors.items():
              prefix=out/f'pdf-{pdf_page:03d}'
              subprocess.run(['pdftoppm','-f',str(pdf_page),'-l',str(pdf_page),'-jpeg','-r','120',str(pdf),str(prefix)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              ref=next(out.glob(f'pdf-{pdf_page:03d}-*.jpg'))
              ref_norm=out/f'pdf-{pdf_page:03d}-norm.png'
              subprocess.run(['convert',str(ref),'-colorspace','Gray','-resize','600x800!','-normalize',str(ref_norm)],check=True)
              candidates=[]
              expected=pdf_page-1
              for leaf in range(max(0,expected-2),expected+3):
                  url=f'https://archive.org/download/{ident}/page/n{leaf}.jpg'
                  item={'leaf':leaf,'url':url}
                  try:
                      b,cct,st,fin=get(url); item.update(status=st,content_type=cct,bytes=len(b),final_url=fin)
                      if st==200 and cct.lower().startswith('image/') and len(b)>20000:
                          raw=out/f'n{leaf}-for-pdf{pdf_page}.jpg'; raw.write_bytes(b)
                          norm=out/f'n{leaf}-for-pdf{pdf_page}-norm.png'
                          subprocess.run(['convert',str(raw),'-colorspace','Gray','-resize','600x800!','-normalize',str(norm)],check=True)
                          cp=subprocess.run(['compare','-metric','RMSE',str(ref_norm),str(norm),'null:'],capture_output=True,text=True)
                          # ImageMagick writes metric to stderr and returns 1 when images differ.
                          metric=(cp.stderr or '').strip(); item['rmse']=metric
                  except Exception as exc: item['error']=repr(exc)
                  candidates.append(item)
              report[str(pdf_page)]={'printed_page':printed,'expected_leaf_if_zero_based':expected,'candidates':candidates}

          # Require n=(pdf_page-1) to be a valid image for all anchors and the best RMSE among tested neighbors.
          import re
          def metric_value(s):
              m=re.search(r'\(([^)]+)\)',s or '')
              if m:
                  try:return float(m.group(1))
                  except:return 9e9
              m=re.search(r'^[0-9.]+',s or '')
              return float(m.group(0)) if m else 9e9
          for p,v in report.items():
              valid=[x for x in v['candidates'] if x.get('rmse')]
              if not valid: raise SystemExit(f'no comparable IA leaf images for PDF {p}')
              best=min(valid,key=lambda x:metric_value(x['rmse']))
              v['best_match']=best
              if best['leaf']!=v['expected_leaf_if_zero_based']:
                  raise SystemExit(f'leaf offset hypothesis failed for PDF {p}: {best}')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Upload leaf-map proof
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-el-maestro-may-1921-leaf-map
          path: el-maestro-leaf-map/report.json
          retention-days: 1
