name: Finalize Memoria SEP 1934 batch v2

on:
  push:
    branches: [freeze-memoria-sep-1934]
    paths:
      - ".github/workflows/finalize-memoria-sep-1934-v2.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-memoria-sep-1934
          fetch-depth: 0

      - name: Apply verified 1934 freeze records
        shell: python
        run: |
          import csv
          from pathlib import Path

          locator_updates = {
            'PDHD-F000085': ('A','29','p29-ciencias-naturales-observacion-cultivo-visita','PA29','Direct primary inspection fixes printed p. 29, subsection e) Ciencias Naturales only, from its heading through its final sentence on following the Inspector-suggested order; exclude preceding geometry and following manual-work item. Google Books PA29 is order 36 / physical PDF page 39.'),
            'PDHD-F000086': ('B','53','p53-federal-programs-teacher-designation-enforcement','PA53','Direct primary inspection fixes printed p. 53 from the opening federal-program/teacher-designation continuation through SEP enforcement authority after Article 428 bis; stop before the paragraph on the Departamento de Enseñanza Rural. Google Books PA53 is order 60 / physical PDF page 63.'),
            'PDHD-F000087': ('C','58','p58-selection-supervision-cooperation-federalization','PA58','Direct primary inspection fixes printed p. 58, instructions 3–8: teacher selection, federal appointment, school organization, reporting, inspector supervision, pedagogical cooperation meetings and federal employment protections; exclude the opening continuation and following Document 9. Google Books PA58 is order 65 / physical PDF page 68.'),
            'PDHD-F000088': ('D','PP7','pp7-1934-volume-ii-title-page-control','PP7','Direct primary inspection replaces the secondary XVI pointer with a clean bibliographic control. Google Books PP7 is order 6 / physical PDF page 9 and identifies the 31 de agosto de 1934, Tomo II Documentos title page. The competing 6aYQAAAAYAAJ object was rejected because its primary title pages identify 1935.'),
          }
          loc = Path('data/samples/fragment_locator_progress_0_1.csv')
          with loc.open(encoding='utf-8', newline='') as f:
              r=csv.DictReader(f); fields=r.fieldnames; rows=list(r)
          seen=set()
          for row in rows:
              fid=row['fragment_id']
              if fid in locator_updates:
                  slot,page,slug,pid,note=locator_updates[fid]
                  row.update(document_id='PDHD-D000073',slot=slot,page=page,source_locator=slug,
                             locator_evidence_url=f'https://books.google.com/books?id=mHgQAAAAYAAJ&pg={pid}',
                             boundary_status='fixed',public_text_status='metadata_only',freeze_status='frozen',
                             preparation_note=note,checked_at='2026-09-06')
                  seen.add(fid)
          if seen != set(locator_updates):
              raise SystemExit(f'Locator IDs missing: {sorted(set(locator_updates)-seen)}')
          with loc.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          frozen_rows = [
            {'fragment_id':'PDHD-F000085','document_id':'PDHD-D000073','slot':'A','page':'29','source_locator':'p29-ciencias-naturales-observacion-cultivo-visita','locator_evidence_url':'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PA29','boundary_definition':'Printed p. 29: subsection e) Ciencias Naturales only, from its heading through the final sentence directing that the teaching follow the order suggested by the Inspector; exclude the preceding geometry paragraph and stop before item 8, Trabajos manuales.','transcription_status':'not_transcribed','access_basis':'Google_Books_direct_primary_pdf_image_inspection','public_text_status':'metadata_only','selection_role':'explicit_pedagogical_act','freeze_status':'frozen','preparation_note':'Identity-gated primary copy mHgQAAAAYAAJ explicitly identifies 31 de agosto de 1934 / Tomo II Documentos. PA29 is order 36 and physical PDF page 39. The fixed unit is an explicit natural-science teaching prescription. No source text or image is committed.','checked_at':'2026-09-06'},
            {'fragment_id':'PDHD-F000086','document_id':'PDHD-D000073','slot':'B','page':'53','source_locator':'p53-federal-programs-teacher-designation-enforcement','locator_evidence_url':'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PA53','boundary_definition':'Printed p. 53: from the opening continuation specifying federal programs and federal appointment of teachers through Article 334, Article 428 bis and the following explanation of SEP enforcement authority; stop before the paragraph beginning En lo que concierne al Departamento de Enseñanza Rural.','transcription_status':'not_transcribed','access_basis':'Google_Books_direct_primary_pdf_image_inspection','public_text_status':'metadata_only','selection_role':'institutional_relation','freeze_status':'frozen','preparation_note':'PA53 is order 60 and physical PDF page 63. Direct visual inspection fixes the relation among official curricula, federal teacher designation, monitoring and sanctioning authority. No source text or image is committed.','checked_at':'2026-09-06'},
            {'fragment_id':'PDHD-F000087','document_id':'PDHD-D000073','slot':'C','page':'58','source_locator':'p58-selection-supervision-cooperation-federalization','locator_evidence_url':'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PA58','boundary_definition':'Printed p. 58: instructions 3 through 8 in full, beginning with careful teacher selection and ending with inamovilidad/escalafón protections after transfer to federal control; exclude the preceding continuation of instruction 2 and the closing salutation plus Document 9.','transcription_status':'not_transcribed','access_basis':'Google_Books_direct_primary_pdf_image_inspection','public_text_status':'metadata_only','selection_role':'source_criticism_salient','freeze_status':'frozen','preparation_note':'PA58 is order 65 and physical PDF page 68. Direct visual inspection preserves selection, appointment, reporting, inspector supervision, pedagogical cooperation and employment status as a source-critical sequence of federalization. No source text or image is committed.','checked_at':'2026-09-06'},
            {'fragment_id':'PDHD-F000088','document_id':'PDHD-D000073','slot':'D','page':'PP7','source_locator':'pp7-1934-volume-ii-title-page-control','locator_evidence_url':'https://books.google.com/books?id=mHgQAAAAYAAJ&pg=PP7','boundary_definition':'Front-matter leaf PP7 / physical PDF page 9: textual bibliographic core identifying Secretaría de Educación Pública, the Memoria title, 31 de agosto de 1934, Tomo II Documentos, Talleres Gráficos de la Nación and México 1934; exclude library marks, emblem, blank margins and Google digitization watermark.','transcription_status':'not_transcribed','access_basis':'Google_Books_direct_primary_pdf_image_inspection','public_text_status':'metadata_only','selection_role':'control','freeze_status':'frozen','preparation_note':'PP7 is order 6 and physical PDF page 9. Direct visual inspection confirms the exact 1934 volume identity and supplies a deliberately non-analytical control. Competing object 6aYQAAAAYAAJ was rejected because its primary title pages identify 1935 despite misleading catalog metadata.','checked_at':'2026-09-06'},
          ]
          fp=Path('data/samples/frozen_fragments_0_1.csv')
          with fp.open(encoding='utf-8',newline='') as f:
              r=csv.DictReader(f); ffields=r.fieldnames; frows=list(r)
          ids={x['fragment_id'] for x in frows}
          for x in frozen_rows:
              if x['fragment_id'] not in ids: frows.append(x)
          with fp.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=ffields,lineterminator='\n'); w.writeheader(); w.writerows(frows)

      - name: Synchronize all status surfaces
        shell: python
        run: |
          from pathlib import Path
          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('| Fragmentos completamente congelados | **41 / 96** |','| Fragmentos completamente congelados | **45 / 96** |')
          s=s.replace('su unión contiene **41/96** fragmentos.','su unión contiene **45/96** fragmentos.')
          s=s.replace('los **42 localizadores todavía no congelados**','los **38 localizadores todavía no congelados**')
          s=s.replace('Los **41/96** congelados demuestran','Los **45/96** congelados demuestran')
          marker='\n\nComo HNDM permanece `metadata_only`'
          para='\n\nLa *Memoria relativa al estado que guarda el ramo de Educación Pública* de 1934, tomo II (`PDHD-D000073`), completa también A–D desde el objeto primario Google Books `mHgQAAAAYAAJ`. La recuperación fue sometida a un gate de identidad porque otra edición etiquetada externamente como 1934 (`6aYQAAAAYAAJ`) contiene portadas primarias de 1935 y fue descartada. En la copia correcta, `PDHD-F000085` fija p. 29 (`PA29`) como acto didáctico de ciencias naturales; `PDHD-F000086` p. 53 (`PA53`) como relación institucional de programas, designación docente y autoridad federal; `PDHD-F000087` p. 58 (`PA58`) como unidad de crítica de fuentes sobre selección, supervisión, cooperación pedagógica y federalización; y `PDHD-F000088` usa `PP7` como control bibliográfico del tomo II de 1934.\n'
          if para.strip() not in s: s=s.replace(marker,para+marker)
          p.write_text(s,encoding='utf-8')

          p=Path('docs/PDHD_U1_COHORT_STATUS.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('| Fully frozen fragments | **41 / 96** |','| Fully frozen fragments | **45 / 96** |')
          s=s.replace('Thirty units have crossed the stronger frozen-fragment gate.','Forty-five units have crossed the stronger frozen-fragment gate.')
          s=s.replace('Six selected documents now have complete four-slot batches.','Ten selected documents now have complete four-slot batches.')
          s=s.replace('Thirty are frozen. The remaining **42** located rows','Forty-five are frozen. The remaining **38** located rows')
          anchor='All third-party image-derived frozen records remain conservative in public handling.'
          note='`PDHD-D000073`, the 1934 SEP memory, now contributes a complete four-slot batch from the primary Google Books copy `mHgQAAAAYAAJ`. Direct inspection maps printed pp. 29, 53 and 58 to physical PDF pages 39, 63 and 68, while `PP7` maps to physical page 9 and supplies the bibliographic control. A competing Google Books full-view object was rejected after its primary title pages identified 1935, preserving primary-page identity over catalog metadata.\n\n'
          if note.strip() not in s: s=s.replace(anchor,note+anchor)
          p.write_text(s,encoding='utf-8')

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_status_counts.py
          git config user.name 'PDHD source verification'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md data/samples/fragment_locator_progress_0_1.csv data/samples/frozen_fragments_0_1.csv docs/PDHD_U1_COHORT_STATUS.md
          git commit -m 'Freeze Memoria SEP 1934 batch'
          git push origin HEAD:freeze-memoria-sep-1934
