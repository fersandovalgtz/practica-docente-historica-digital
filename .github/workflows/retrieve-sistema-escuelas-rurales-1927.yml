name: Retrieve Sistema Escuelas Rurales 1927 primary pages

on:
  push:
    branches: [freeze-sistema-escuelas-rurales-1927]
    paths:
      - ".github/workflows/retrieve-sistema-escuelas-rurales-1927.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Internet Archive object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sistema-rurales-primary
          base='https://archive.org/download/elsistemadeescue00mexi'
          curl -L --fail --retry 3 "$base/elsistemadeescue00mexi.pdf" -o sistema-rurales-primary/volume.pdf
          curl -L --fail --retry 3 "$base/elsistemadeescue00mexi_scandata.xml" -o sistema-rurales-primary/scandata.xml
          curl -L --fail --retry 3 "$base/elsistemadeescue00mexi_djvu.txt" -o sistema-rurales-primary/djvu.txt
          test "$(head -c 4 sistema-rurales-primary/volume.pdf)" = '%PDF'
          ls -lh sistema-rurales-primary/

      - name: Map folios and render target windows
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          out='sistema-rurales-primary'
          pdfinfo "$out/volume.pdf" > "$out/pdfinfo.txt"
          pdftotext -layout "$out/volume.pdf" "$out/volume.txt" || true
          python - <<'PY'
          import json, pathlib, re, subprocess, xml.etree.ElementTree as ET
          out=pathlib.Path('sistema-rurales-primary')
          root=ET.parse(out/'scandata.xml').getroot()
          pages=[]
          for po in root.findall('.//pageData/page'):
              leaf=po.get('leafNum')
              pageNumber=po.findtext('./pageNumber')
              pageType=po.findtext('./pageType')
              addToAccessFormats=po.findtext('./addToAccessFormats')
              pages.append({'leafNum':int(leaf) if leaf is not None else None,'pageNumber':pageNumber,'pageType':pageType,'addToAccessFormats':addToAccessFormats})
          targets=['72','255','256']
          mapping={t:[] for t in targets}
          for p in pages:
              if p['pageNumber'] in mapping: mapping[p['pageNumber']].append(p)
          # IA scan leaf 0 generally maps to PDF physical page 1; render generous +/-4 around each scandata match.
          render=set(range(1,35))
          for vals in mapping.values():
              for p in vals:
                  physical=(p['leafNum'] or 0)+1
                  render.update(range(max(1,physical-4),physical+5))
          # Also render likely offset windows if pageNumber metadata is incomplete.
          for printed in (72,255,256):
              for offset in range(10,55,5):
                  render.add(printed+offset)
          total=int(re.search(r'^Pages:\s+(\d+)',(out/'pdfinfo.txt').read_text(),re.M).group(1))
          render=sorted(p for p in render if p<=total)
          rd=out/'rendered'; rd.mkdir()
          for p in render:
              prefix=rd/f'physical-{p:04d}'
              subprocess.run(['pdftoppm','-f',str(p),'-l',str(p),'-singlefile','-jpeg','-r','190',str(out/'volume.pdf'),str(prefix)],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          (out/'folio-map.json').write_text(json.dumps({'pdf_pages':total,'targets':mapping,'rendered':render},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'pdf_pages':total,'targets':mapping,'render_count':len(render)},ensure_ascii=False))
          PY

      - name: Extract searchable neighborhoods
        shell: python
        run: |
          import pathlib,re,unicodedata,json
          out=pathlib.Path('sistema-rurales-primary')
          text=(out/'volume.txt').read_text(encoding='utf-8',errors='replace')
          pages=text.split('\f')
          terms=['CUERNAVACA','NORMAL RURAL','DIRECTOR','MAESTROS','PROGRAMA','LECTURAS','VISIT','RECLUT','PREPARACION','ALUMNOS','PROCEDENCIA','ORIGEN']
          hits=[]
          for i,p in enumerate(pages,start=1):
              n=unicodedata.normalize('NFD',p.upper()); n=''.join(c for c in n if unicodedata.category(c)!='Mn')
              score=sum(1 for t in terms if t in n)
              if score>=3:
                  hits.append({'physical':i,'score':score,'snippet':re.sub(r'\s+',' ',p)[:2500]})
          hits=sorted(hits,key=lambda x:(-x['score'],x['physical']))[:100]
          (out/'text-hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(hits[:30],ensure_ascii=False,indent=2))

      - name: Upload primary review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-sistema-rurales-1927-primary-review
          path: sistema-rurales-primary/
          retention-days: 1
