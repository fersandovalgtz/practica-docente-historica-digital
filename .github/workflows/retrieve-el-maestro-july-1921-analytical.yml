name: Retrieve El Maestro July 1921 analytical pages

on:
  push:
    branches: [freeze-el-maestro-july-1921-analytical]

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate targets in IA page-index OCR and retrieve primary images
        shell: python
        run: |
          import json, pathlib, re, unicodedata, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          out=pathlib.Path('el-maestro-july-1921-primary'); out.mkdir()
          ident='elmaestrorevista146mexi'
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=180) as r:
                  return r.read(),r.headers.get('content-type',''),r.status,r.geturl()
          def norm(s):
              return re.sub(r'\s+',' ',unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().upper())

          meta=json.loads(get(f'https://archive.org/metadata/{ident}')[0].decode())
          md=meta.get('metadata',{})
          identity={k:md.get(k) for k in ['identifier','title','creator','date','description','volume']}
          hay=norm(' '.join(str(v or '') for v in identity.values()))
          if 'MAESTRO' not in hay:
              raise SystemExit(f'identity gate failed: {identity}')
          files=meta.get('files',[])
          relevant=[f.get('name') for f in files if f.get('name') and any(x in f.get('name','').lower() for x in ['djvu','scandata','.pdf'])]
          print('IDENTITY',json.dumps(identity,ensure_ascii=False))
          print('RELEVANT_FILES',json.dumps(relevant,ensure_ascii=False,indent=2))

          djvu=next((f.get('name') for f in files if f.get('name','').endswith('_djvu.xml')),None)
          if not djvu: raise SystemExit('no IA djvu XML page index')
          xb,_,_,_=get('https://archive.org/download/'+ident+'/'+urllib.parse.quote(djvu))
          (out/'source_djvu.xml').write_bytes(xb)
          root=ET.fromstring(xb)
          objects=root.findall('.//OBJECT')
          if not objects: raise SystemExit('no page OBJECT elements in djvu XML')
          page_texts=[]
          for i,obj in enumerate(objects):
              text=' '.join((w.text or '') for w in obj.findall('.//WORD'))
              page_texts.append(norm(text))

          targets={
            'F45': ['ILUSTRACION DE LAS MASAS','MONTELONGO'],
            'F46': ['MEJORES MAESTROS','ABEL AYALA'],
            'F47': ['HISTORIA DE MEXICO','RAMOS PEDRUEZA'],
          }
          matches={}
          for label,needles in targets.items():
              hit=[]
              for idx,text in enumerate(page_texts):
                  score=sum(1 for x in needles if x in text)
                  if score:
                      hit.append({'object_index':idx,'leaf_hypothesis':idx,'score':score,'head':text[:1600]})
              matches[label]=hit
          print('OBJECT_COUNT',len(objects))
          print('MATCHES',json.dumps(matches,ensure_ascii=False,indent=2))
          if not all(matches[k] for k in targets):
              raise SystemExit('one or more target articles absent from IA OCR page index')

          # OCR is discovery only. Retrieve primary BookReader images around every match.
          retrieved=[]
          leaves=set([4])  # already-known issue-cover control anchor
          for hitlist in matches.values():
              for h in hitlist:
                  idx=h['object_index']
                  for leaf in range(max(0,idx-2),min(len(objects)-1,idx+5)+1): leaves.add(leaf)
          for leaf in sorted(leaves):
              url=f'https://archive.org/download/{ident}/page/n{leaf}.jpg'
              item={'leaf':leaf,'url':url}
              try:
                  b,ct,st,fin=get(url); item.update(status=st,content_type=ct,bytes=len(b),final_url=fin)
                  if st==200 and ct.lower().startswith('image/') and len(b)>15000:
                      p=out/f'n{leaf:03d}.jpg'; p.write_bytes(b); item['saved']=p.name
              except Exception as exc:
                  item['error']=repr(exc)
              retrieved.append(item)
          saved=[x for x in retrieved if x.get('saved')]
          if len(saved)<4: raise SystemExit('insufficient primary images retrieved')
          report={'identity':identity,'djvu_file':djvu,'object_count':len(objects),'matches':matches,'retrieved':retrieved,'warning':'DjVu OCR/object indexes are discovery aids only. Printed pagination, title/author identity, leaf mapping and coder boundaries require visual inspection of saved primary images.'}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RETRIEVED',json.dumps(retrieved,ensure_ascii=False,indent=2))
      - name: Upload primary review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-el-maestro-july-1921-primary
          path: el-maestro-july-1921-primary/
          retention-days: 1
