name: Finalize La Escuela Moderna 1889 primary batch v4

on:
  push:
    branches: [freeze-la-escuela-moderna-1889]
    paths:
      - ".github/workflows/finalize-la-escuela-moderna-1889-v4.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse vetted v2 scientific promotion block
        shell: python
        run: |
          import pathlib,re,textwrap
          text=pathlib.Path('.github/workflows/finalize-la-escuela-moderna-1889-v2.yml').read_text(encoding='utf-8')
          m=re.search(r'      - name: Promote exact primary batch and synchronize documentation\n        shell: python\n        run: \|\n(.*?)\n      - name: Remove all temporary Escuela Moderna workflows',text,re.S)
          if not m: raise SystemExit('v2 promotion block not found')
          code=textwrap.dedent(m.group(1))
          print('Executing vetted promotion block:',len(code),'bytes')
          exec(compile(code,'<v2-promotion>','exec'),{})
      - name: Remove all temporary Escuela Moderna workflows
        shell: bash
        run: |
          rm -f .github/workflows/probe-la-escuela-moderna-1889.yml
          rm -f .github/workflows/retrieve-la-escuela-moderna-1889.yml
          rm -f .github/workflows/finalize-la-escuela-moderna-1889.yml
          rm -f .github/workflows/finalize-la-escuela-moderna-1889-v2.yml
          rm -f .github/workflows/finalize-la-escuela-moderna-1889-v3.yml
          rm -f .github/workflows/finalize-la-escuela-moderna-1889-v4.yml
      - name: Run canonical validation suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          python scripts/validate_object_aliases.py
          python scripts/validate_content_leads.py
          python scripts/validate_retrieval_attempts.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_freeze_conversion_queue.py
          python scripts/prepare_freeze_review.py --check
          python scripts/validate_status_counts.py
          python scripts/annotation_agreement.py --self-test
          python scripts/build_fragment_manifest.py --check
      - name: Gate effective final tree including untracked shards
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          { git diff --name-only origin/main -- .; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u > /tmp/changed
          cat /tmp/changed
          cat > /tmp/allowed <<'EOF'
          README.md
          data/samples/fragment_gap_queue_0_1.csv
          data/samples/fragment_locator_progress_secondary_w4.csv
          data/samples/fragment_locator_progress_hndm_escuela_moderna1889_w24.csv
          data/samples/frozen_fragments_hndm_escuela_moderna1889_w24.csv
          data/samples/retrieval_attempts.csv
          docs/PDHD_U1_COHORT_STATUS.md
          EOF
          sort -u /tmp/allowed -o /tmp/allowed
          bad=$(comm -23 /tmp/changed /tmp/allowed || true)
          missing=$(comm -13 /tmp/changed /tmp/allowed || true)
          if [ -n "$bad" ]; then echo 'Unexpected final-tree paths:'; echo "$bad"; exit 1; fi
          if [ -n "$missing" ]; then echo 'Missing expected final-tree paths:'; echo "$missing"; exit 1; fi
      - name: Commit and push clean scientific tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fernando Sandoval"
          git config user.email "fernando.sandoval@uacj.mx"
          git add -A
          git status --short
          git commit -m "Freeze La Escuela Moderna 31 Oct 1889 primary batch"
          git push origin HEAD:freeze-la-escuela-moderna-1889
