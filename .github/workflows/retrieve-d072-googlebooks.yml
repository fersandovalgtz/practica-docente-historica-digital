name: Retrieve PDHD D072 Google Books primary windows

on:
  push:
    branches:
      - "work/d072-googlebooks-freeze"
    paths:
      - ".github/workflows/retrieve-d072-googlebooks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Google Books access routes and primary page images
        shell: python
        run: |
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          volume_id = "ypWS82YskN4C"
          page_ids = ["PA111", "PA307", "PA465", "PA487"]
          out = pathlib.Path("d072-googlebooks-review")
          images = out / "page-images"
          out.mkdir(exist_ok=True)
          images.mkdir(exist_ok=True)
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9,es;q=0.8",
          }
          report = {"volume_id": volume_id, "selected_pages": {}, "pdf_saved": False}

          # First capture Google Books' current machine-readable access metadata.
          api_url = f"https://www.googleapis.com/books/v1/volumes/{volume_id}"
          try:
              req = urllib.request.Request(api_url, headers=headers)
              with urllib.request.urlopen(req, timeout=45) as response:
                  api_raw = response.read()
                  report["books_api_status"] = response.status
              api_data = json.loads(api_raw.decode("utf-8"))
              access = api_data.get("accessInfo", {})
              report["access_info"] = {
                  "viewability": access.get("viewability"),
                  "publicDomain": access.get("publicDomain"),
                  "accessViewStatus": access.get("accessViewStatus"),
                  "embeddable": access.get("embeddable"),
                  "pdf": access.get("pdf"),
                  "webReaderLink": access.get("webReaderLink"),
              }
              (out / "books-api-access.json").write_text(
                  json.dumps(report["access_info"], ensure_ascii=False, indent=2), encoding="utf-8"
              )
          except Exception as exc:
              report["books_api_error"] = f"{type(exc).__name__}: {exc}"

          pdf_candidates = []
          for page_id in page_ids:
              page_url = (
                  f"https://books.google.com/books?cad=1&id={volume_id}&pg={page_id}"
                  "&source=gbs_selected_pages"
              )
              row = {"url": page_url, "image_attempts": []}
              try:
                  req = urllib.request.Request(page_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw = response.read()
                      row["status"] = response.status
                      row["content_type"] = response.headers.get("Content-Type", "")
                  text = raw.decode("utf-8", errors="replace")
                  decoded = html.unescape(text).replace("\\/", "/").replace("\\u0026", "&")
                  (out / f"selected-{page_id}.html").write_text(text, encoding="utf-8")

                  pdfs = re.findall(
                      r'https?://books\.google\.[^/]+/books/download/[^"\'<> ]+?\.pdf\?[^"\'<> ]+',
                      decoded,
                  )
                  if not pdfs:
                      pdfs = [
                          urllib.parse.urljoin("https://books.google.com", m)
                          for m in re.findall(
                              r'href=["\']([^"\']*?/books/download/[^"\']+?\.pdf\?[^"\']+)["\']',
                              decoded,
                          )
                      ]
                  row["pdf_candidate_count"] = len(pdfs)
                  pdf_candidates.extend(pdfs)

                  image_candidates = re.findall(
                      r'https?://books\.google\.[^"\'<> ]+/books/content\?[^"\'<> ]+',
                      decoded,
                  )
                  image_candidates += [
                      "https:" + m
                      for m in re.findall(r'//books\.google\.[^"\'<> ]+/books/content\?[^"\'<> ]+', decoded)
                  ]
                  # Prefer candidates explicitly associated with the requested page ID.
                  ordered = [u for u in image_candidates if page_id in u]
                  ordered += [u for u in image_candidates if u not in ordered]
                  # Also test the canonical unsigned page-image route to distinguish missing signature from no preview.
                  ordered.append(
                      f"https://books.google.com/books/content?id={volume_id}&pg={page_id}&img=1&zoom=2&hl=en"
                  )

                  seen = set()
                  for idx, image_url in enumerate(ordered[:12], start=1):
                      if image_url in seen:
                          continue
                      seen.add(image_url)
                      attempt = {"url": image_url}
                      try:
                          ireq = urllib.request.Request(image_url, headers=headers)
                          with urllib.request.urlopen(ireq, timeout=45) as response:
                              body = response.read()
                              ctype = response.headers.get("Content-Type", "")
                              attempt.update({
                                  "status": response.status,
                                  "content_type": ctype,
                                  "bytes": len(body),
                                  "final_url": response.geturl(),
                              })
                          if response.status == 200 and ctype.startswith("image/") and len(body) > 10000:
                              suffix = ".jpg" if "jpeg" in ctype else ".img"
                              dest = images / f"{page_id}-{idx:02d}{suffix}"
                              dest.write_bytes(body)
                              attempt["saved"] = dest.name
                              row["image_attempts"].append(attempt)
                              break
                      except Exception as exc:
                          attempt["error"] = f"{type(exc).__name__}: {exc}"
                      row["image_attempts"].append(attempt)

                  row["content_image_candidate_count"] = len(image_candidates)
              except Exception as exc:
                  row["error"] = f"{type(exc).__name__}: {exc}"
              report["selected_pages"][page_id] = row
              print(page_id, json.dumps(row, ensure_ascii=False))

          unique = []
          seen = set()
          for candidate in pdf_candidates:
              if candidate not in seen:
                  unique.append(candidate)
                  seen.add(candidate)
          report["pdf_candidates"] = unique[:20]
          pdf_url = next((u for u in unique if "output=pdf" in u), unique[0] if unique else None)
          report["selected_pdf_url"] = pdf_url

          if pdf_url:
              try:
                  req = urllib.request.Request(pdf_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=120) as response:
                      body = response.read()
                      report["pdf_status"] = response.status
                      report["pdf_content_type"] = response.headers.get("Content-Type", "")
                  report["pdf_bytes"] = len(body)
                  if len(body) > 100000 and body.startswith(b"%PDF"):
                      (out / "volume.pdf").write_bytes(body)
                      report["pdf_saved"] = True
              except Exception as exc:
                  report["pdf_error"] = f"{type(exc).__name__}: {exc}"

          (out / "retrieval-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("ACCESS", json.dumps(report.get("access_info", {}), ensure_ascii=False))
          print("PDF_SAVED", report["pdf_saved"], "PDF_CANDIDATES", len(unique))

      - name: Render broad target windows if a PDF is available
        shell: bash
        run: |
          set -u
          out="d072-googlebooks-review"
          if [ ! -f "$out/volume.pdf" ]; then
            echo "No primary PDF recovered; direct page-image route remains eligible"
            exit 0
          fi
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          pdfinfo "$out/volume.pdf" | tee "$out/pdfinfo.txt"
          mkdir -p "$out/rendered"
          for spec in "101 133 p111" "297 329 p307" "455 499 p465" "477 521 p487"; do
            set -- $spec
            first="$1"; last="$2"; label="$3"
            pdftoppm -f "$first" -l "$last" -jpeg -r 125 "$out/volume.pdf" "$out/rendered/${label}" || true
          done

      - name: Upload one-day D072 primary-review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d072-googlebooks-review
          path: d072-googlebooks-review/
          retention-days: 1
          if-no-files-found: error

      - name: Require auditable primary review material
        shell: bash
        run: |
          shopt -s nullglob
          rendered=(d072-googlebooks-review/rendered/*.jpg)
          direct=(d072-googlebooks-review/page-images/*)
          count=$(( ${#rendered[@]} + ${#direct[@]} ))
          if [ "$count" -eq 0 ]; then
            echo "No auditable Google Books primary-page images were recovered"
            exit 1
          fi
          echo "Recovered $count auditable primary-page images for D072 review"
