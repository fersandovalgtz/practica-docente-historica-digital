name: Probe exact D074 identity across related volumes

on:
  push:
    branches: [work/d074-canonical-page-recovery]
    paths: [.github/workflows/probe-d074-exact-identity-related.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search exact bibliographic identity phrases
        shell: python
        run: |
          import json, pathlib, urllib.parse, urllib.request, urllib.error

          vids=['03wQAAAAYAAJ','3X8QAAAAYAAJ','7OdDbshzWaUC','KH0QAAAAYAAJ','N3wQAAAAYAAJ','Xd0U5ozjxNgC','e3wQAAAAYAAJ']
          queries={
            'exact_period':'"septiembre de 1936" "agosto de 1937"',
            'joined_period':'septiembre de 1936 agosto de 1937',
            'mexico_1937':'"México 1937"',
            'title_period':'"Memoria de la Secretaría de Educación Pública" "1936" "1937"',
            'gonzalo_period':'"Gonzalo Vázquez Vela" "agosto de 1937"',
          }
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9,en;q=0.8'}
          out=pathlib.Path('d074-exact-identity'); out.mkdir(exist_ok=True)
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=90) as r: return r.status,r.read()
            except urllib.error.HTTPError as e: return e.code,e.read()
            except Exception as e: return None,str(e).encode()
          report={}
          for vid in vids:
            row={}
            for label,q in queries.items():
              url='https://books.google.com/books?'+urllib.parse.urlencode({'id':vid,'jscmd':'SearchWithinVolume2','q':q})
              st,body=get(url); rec={'status':st,'bytes':len(body),'results':[]}
              try:
                data=json.loads(body.decode('utf-8')); rec['number_of_results']=data.get('number_of_results'); rec['searchable']=data.get('searchable')
                for x in (data.get('search_results') or [])[:10]:
                  if isinstance(x,dict): rec['results'].append({k:x.get(k) for k in ['page_id','page_number','snippet_text']})
              except Exception as e: rec['error']=f'{type(e).__name__}: {e}'
              row[label]=rec
            report[vid]=row
            print('\nVOLUME',vid)
            print(json.dumps({k:{'n':v.get('number_of_results'),'hits':[(x.get('page_id'),x.get('page_number')) for x in v['results']]} for k,v in row.items()},ensure_ascii=False,indent=2))
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Upload one-day report
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d074-exact-identity-related
          path: d074-exact-identity/
          retention-days: 1
          if-no-files-found: error
