name: Retrieve PDHD D074 Google Books primary evidence

on:
  push:
    branches:
      - "work/d074-primary-freeze"
    paths:
      - ".github/workflows/retrieve-d074-googlebooks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate Google Books volume IDs and recover primary PDFs when available
        shell: python
        run: |
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          # KRV... is the canonical D074 Google Books object. 08yg... and
          # X3oQ... are alternate Google/Play objects discovered from the
          # publisher's catalog and are eligible only if primary inspection
          # establishes bibliographic equivalence.
          volume_ids = ["KRV2_jMW8-wC", "08ygAAAAMAAJ", "X3oQAAAAYAAJ"]
          target_pages = ["PA40", "PA41", "PA371", "PA444"]
          out = pathlib.Path("d074-googlebooks-review")
          out.mkdir(exist_ok=True)
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9,es;q=0.8",
          }
          report = {"volumes": {}}

          def fetch_bytes(url, timeout=60):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.status, response.headers.get("Content-Type", ""), response.geturl(), response.read()

          for volume_id in volume_ids:
              vout = out / volume_id
              vout.mkdir(exist_ok=True)
              row = {"volume_id": volume_id, "pages": {}, "pdf_candidates": []}

              # API metadata is useful but non-essential: Google can rate-limit
              # this endpoint while selected-page HTML still exposes a valid
              # public PDF download route.
              api_url = f"https://www.googleapis.com/books/v1/volumes/{volume_id}"
              try:
                  status, ctype, final_url, body = fetch_bytes(api_url)
                  data = json.loads(body.decode("utf-8"))
                  vi = data.get("volumeInfo", {})
                  ai = data.get("accessInfo", {})
                  row["api"] = {
                      "status": status,
                      "title": vi.get("title"),
                      "subtitle": vi.get("subtitle"),
                      "authors": vi.get("authors"),
                      "publisher": vi.get("publisher"),
                      "publishedDate": vi.get("publishedDate"),
                      "pageCount": vi.get("pageCount"),
                      "viewability": ai.get("viewability"),
                      "publicDomain": ai.get("publicDomain"),
                      "accessViewStatus": ai.get("accessViewStatus"),
                      "pdf": ai.get("pdf"),
                  }
                  pdf = ai.get("pdf") or {}
                  if pdf.get("downloadLink"):
                      row["pdf_candidates"].append(pdf["downloadLink"])
              except Exception as exc:
                  row["api_error"] = f"{type(exc).__name__}: {exc}"

              for page_id in target_pages:
                  page_url = (
                      f"https://books.google.com/books?cad=1&id={volume_id}&pg={page_id}"
                      "&source=gbs_selected_pages"
                  )
                  prow = {"url": page_url}
                  try:
                      status, ctype, final_url, body = fetch_bytes(page_url)
                      text = body.decode("utf-8", errors="replace")
                      decoded = html.unescape(text).replace("\\/", "/").replace("\\u0026", "&")
                      prow.update({"status": status, "content_type": ctype, "bytes": len(body)})
                      pdfs = re.findall(
                          r'https?://books\.google\.[^/]+/books/download/[^"\'<> ]+?\.pdf\?[^"\'<> ]+',
                          decoded,
                      )
                      if not pdfs:
                          pdfs = [
                              urllib.parse.urljoin("https://books.google.com", m)
                              for m in re.findall(
                                  r'href=["\']([^"\']*?/books/download/[^"\']+?\.pdf\?[^"\']+)["\']',
                                  decoded,
                              )
                          ]
                      prow["pdf_candidate_count"] = len(pdfs)
                      row["pdf_candidates"].extend(pdfs)

                      # Record bibliographic hints from metadata embedded in the
                      # selected-page HTML. These are discovery aids only; the
                      # primary PDF remains the identity gate.
                      hints = {}
                      for key, pattern in {
                          "title": r'<meta[^>]+(?:name|property)=["\'](?:citation_title|og:title)["\'][^>]+content=["\']([^"\']+)',
                          "date": r'<meta[^>]+name=["\']citation_date["\'][^>]+content=["\']([^"\']+)',
                          "publisher": r'<meta[^>]+name=["\']citation_publisher["\'][^>]+content=["\']([^"\']+)',
                      }.items():
                          m = re.search(pattern, decoded, flags=re.I)
                          if m:
                              hints[key] = m.group(1)
                      if hints:
                          prow["html_bibliographic_hints"] = hints
                  except Exception as exc:
                      prow["error"] = f"{type(exc).__name__}: {exc}"
                  row["pages"][page_id] = prow

              unique = []
              seen = set()
              for candidate in row["pdf_candidates"]:
                  candidate = html.unescape(candidate)
                  if candidate not in seen:
                      seen.add(candidate)
                      unique.append(candidate)
              row["pdf_candidates"] = unique[:20]
              row["pdf_saved"] = False
              for pdf_url in unique[:8]:
                  try:
                      status, ctype, final_url, body = fetch_bytes(pdf_url, timeout=240)
                      attempt = {
                          "url": pdf_url,
                          "status": status,
                          "content_type": ctype,
                          "bytes": len(body),
                          "final_url": final_url,
                      }
                      if len(body) > 100000 and body.startswith(b"%PDF"):
                          dest = vout / "volume.pdf"
                          dest.write_bytes(body)
                          attempt["saved"] = dest.name
                          row["pdf_saved"] = True
                          row["pdf_attempt"] = attempt
                          break
                      row.setdefault("pdf_attempts", []).append(attempt)
                  except Exception as exc:
                      row.setdefault("pdf_attempts", []).append({
                          "url": pdf_url,
                          "error": f"{type(exc).__name__}: {exc}",
                      })

              report["volumes"][volume_id] = row
              print(json.dumps(row, ensure_ascii=False, indent=2))

          (out / "retrieval-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )

      - name: Locate identity and target content without assuming printed-page offset
        shell: bash
        run: |
          set -euo pipefail
          out="d074-googlebooks-review"
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

          python - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import unicodedata

          root = pathlib.Path("d074-googlebooks-review")
          volume_ids = ["08ygAAAAMAAJ", "X3oQAAAAYAAJ"]
          patterns = {
              "identity_memoria_sep": ["memoria de la secretaria de educacion publica", "memoria de la secretaría de educación pública"],
              "identity_period_1936_1937": ["septiembre de 1936", "agosto de 1937", "1936-1937"],
              "slot_D_becas": ["distribucion de becas en la republica", "distribución de becas en la república"],
              "slot_B_consejo": ["consejo nacional de la educacion superior", "consejo nacional de educación superior"],
              "slot_A_trabajo_manual": ["trabajo manual"],
              "slot_A_aplicacion_conocimientos": ["aplicacion de los conocimientos", "aplicación de los conocimientos"],
              "slot_A_desarrollo_intelectual": ["desarrollo intelectual"],
              "slot_C_bibliotecas": ["bibliotecas"],
          }

          def norm(s):
              s = unicodedata.normalize("NFD", s.lower())
              s = "".join(c for c in s if unicodedata.category(c) != "Mn")
              return re.sub(r"\s+", " ", s)

          normalized_patterns = {k: [norm(v) for v in vals] for k, vals in patterns.items()}

          for volume_id in volume_ids:
              vdir = root / volume_id
              pdf = vdir / "volume.pdf"
              if not pdf.exists():
                  print(volume_id, "no PDF recovered")
                  continue
              info = subprocess.check_output(["pdfinfo", str(pdf)], text=True, errors="replace")
              (vdir / "pdfinfo.txt").write_text(info, encoding="utf-8")
              txt_path = vdir / "volume-ocr.txt"
              subprocess.run(["pdftotext", "-layout", str(pdf), str(txt_path)], check=True)
              full = txt_path.read_text(encoding="utf-8", errors="replace")
              page_texts = full.split("\f")
              if page_texts and not page_texts[-1].strip():
                  page_texts.pop()
              hits = []
              for index, text in enumerate(page_texts, start=1):
                  nt = norm(text)
                  matched = [key for key, vals in normalized_patterns.items() if any(v in nt for v in vals)]
                  if not matched:
                      continue
                  lines = [re.sub(r"\s+", " ", line).strip() for line in text.splitlines() if line.strip()]
                  hits.append({
                      "physical_pdf_page": index,
                      "matched_patterns": matched,
                      "first_nonblank_lines": lines[:8],
                      "last_nonblank_lines": lines[-5:],
                  })
              (vdir / "target-content-hits.json").write_text(
                  json.dumps(hits, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              print("VOLUME", volume_id, "PHYSICAL_PAGES", len(page_texts))
              print(json.dumps(hits, ensure_ascii=False, indent=2))
          PY

      - name: Render OCR-located primary pages for visual review
        shell: python
        run: |
          import json
          import pathlib
          import subprocess

          root = pathlib.Path("d074-googlebooks-review")
          for volume_id in ["08ygAAAAMAAJ", "X3oQAAAAYAAJ"]:
              vdir = root / volume_id
              pdf = vdir / "volume.pdf"
              hits_path = vdir / "target-content-hits.json"
              if not pdf.exists() or not hits_path.exists():
                  continue
              hits = json.loads(hits_path.read_text(encoding="utf-8"))
              # Only render pages with target-slot signals or identity markers.
              pages = sorted({int(h["physical_pdf_page"]) for h in hits})
              rendered = vdir / "rendered-targets"
              rendered.mkdir(exist_ok=True)
              for page in pages:
                  prefix = rendered / f"physical-{page:04d}"
                  subprocess.run(
                      ["pdftoppm", "-f", str(page), "-l", str(page), "-singlefile", "-jpeg", "-r", "180", str(pdf), str(prefix)],
                      check=True,
                  )
              print(volume_id, "rendered physical pages", pages)

      - name: Upload one-day D074 primary-review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d074-googlebooks-review
          path: d074-googlebooks-review/
          retention-days: 1
          if-no-files-found: error
