name: Retrieve El esfuerzo educativo analytical slots

on:
  push:
    branches: [retrieve-el-esfuerzo-analytical-slots]
    paths:
      - ".github/workflows/retrieve-el-esfuerzo-analytical-slots.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current Google Books PDF
        shell: python
        run: |
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          out = pathlib.Path("el-esfuerzo-primary-review")
          out.mkdir()
          report = {}
          page_url = "https://books.google.com/books?cad=1&id=O2oLAQAAIAAJ&pg=PR5&source=gbs_selected_pages"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9,es;q=0.8",
          }

          try:
              req = urllib.request.Request(page_url, headers=headers)
              with urllib.request.urlopen(req, timeout=45) as response:
                  raw = response.read()
                  report["page_status"] = response.status
                  report["page_content_type"] = response.headers.get("Content-Type", "")
              text = raw.decode("utf-8", errors="replace")
              (out / "selected-page.html").write_text(text, encoding="utf-8")
              decoded = html.unescape(text)
              candidates = re.findall(
                  r'https?://books\.google\.com/books/download/[^"\'<> ]+?\.pdf\?[^"\'<> ]+',
                  decoded,
              )
              if not candidates:
                  candidates = [
                      urllib.parse.urljoin("https://books.google.com", m)
                      for m in re.findall(
                          r'href=["\']([^"\']*?/books/download/[^"\']+?\.pdf\?[^"\']+)["\']',
                          decoded,
                      )
                  ]
              report["pdf_candidates"] = candidates[:10]
              pdf_url = next((u for u in candidates if "output=pdf" in u), candidates[0] if candidates else None)
              report["selected_pdf_url"] = pdf_url
              if pdf_url:
                  req = urllib.request.Request(pdf_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=120) as response:
                      body = response.read()
                      report["pdf_status"] = response.status
                      report["pdf_content_type"] = response.headers.get("Content-Type", "")
                  report["pdf_bytes"] = len(body)
                  if len(body) > 100000 and body.startswith(b"%PDF"):
                      (out / "volume1.pdf").write_bytes(body)
                      report["pdf_saved"] = True
                  else:
                      (out / "pdf-response.bin").write_bytes(body)
                      report["pdf_saved"] = False
              else:
                  report["pdf_saved"] = False
          except Exception as exc:
              report["error"] = f"{type(exc).__name__}: {exc}"
              report["pdf_saved"] = False

          (out / "retrieval-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({k: v for k, v in report.items() if k != "selected_pdf_url"}, ensure_ascii=False, indent=2))
          if not report.get("pdf_saved"):
              raise SystemExit("Primary Google Books PDF was not recovered")

      - name: Locate and render candidate pages
        shell: bash
        run: |
          set -euo pipefail
          out="el-esfuerzo-primary-review"
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          pdfinfo "$out/volume1.pdf" > "$out/pdfinfo.txt"
          pdftotext -layout "$out/volume1.pdf" "$out/volume1.txt" || true
          python - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          out = pathlib.Path("el-esfuerzo-primary-review")
          text_path = out / "volume1.txt"
          pages = text_path.read_text(encoding="utf-8", errors="replace").split("\f") if text_path.exists() else []
          needles = {
              "misiones_culturales_escuelas_normales": ["MISIONES CULTURALES", "ESCUELAS NORMALES"],
              "escuelas_rurales_primarias_foraneas": ["ESCUELAS RURALES", "PRIMARIAS FORANEAS"],
          }
          matches = {}
          for key, terms in needles.items():
              found = []
              for idx, page in enumerate(pages, start=1):
                  norm = re.sub(r"\s+", " ", page.upper())
                  if all(term in norm for term in terms):
                      found.append(idx)
              matches[key] = found

          # PR5 was previously verified as physical PDF page 9. Render broad
          # candidate windows around the analytical targets while preserving
          # the historical text only in the one-day artifact.
          render_pages = set()
          for vals in matches.values():
              for p in vals:
                  render_pages.update(range(max(1, p-2), p+3))

          # Conservative fallback windows for printed pp. 1, 94-95, 104 and 113.
          # A front-matter offset of roughly 8-14 leaves is plausible; render
          # broad windows rather than assuming an exact map.
          for center in (12, 103, 104, 113, 122):
              render_pages.update(range(max(1, center-4), center+5))

          render_pages = sorted(p for p in render_pages if p >= 1)
          (out / "candidate-page-map.json").write_text(
              json.dumps({"text_matches": matches, "rendered_physical_pages": render_pages}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          render_dir = out / "rendered"
          render_dir.mkdir(exist_ok=True)
          for p in render_pages:
              prefix = render_dir / f"physical-{p:03d}"
              subprocess.run(
                  ["pdftoppm", "-f", str(p), "-l", str(p), "-singlefile", "-jpeg", "-r", "180", str(out / "volume1.pdf"), str(prefix)],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
          print(json.dumps({"matches": matches, "render_count": len(render_pages)}, ensure_ascii=False))
          PY

      - name: Upload one-day primary-review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-el-esfuerzo-analytical-primary-review
          path: el-esfuerzo-primary-review/
          retention-days: 1
          if-no-files-found: error

      - name: Require rendered evidence
        shell: bash
        run: |
          shopt -s nullglob
          files=(el-esfuerzo-primary-review/rendered/*.jpg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No auditable Google Books page image was rendered"
            exit 1
          fi
          echo "Recovered ${#files[@]} rendered primary pages"
