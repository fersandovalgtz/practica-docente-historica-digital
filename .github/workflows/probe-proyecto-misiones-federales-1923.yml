name: Probe Proyecto Misiones Federales 1923 primary copies

on:
  push:
    branches: [freeze-proyecto-misiones-federales-1923]
    paths:
      - ".github/workflows/probe-proyecto-misiones-federales-1923.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Internet Archive catalog
        shell: python
        run: |
          import json,pathlib,urllib.parse,urllib.request
          out=pathlib.Path('proyecto-misiones-1923-probe'); out.mkdir()
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          queries={
            'exact':'title:("Proyecto para la organizacion de las misiones federales de educacion")',
            'misiones':'title:(misiones federales educacion) AND year:[1922 TO 1925]',
            'sep':'creator:(Mexico) AND title:(misiones) AND year:[1922 TO 1925]',
            'education':'title:(organizacion misiones educacion) AND year:[1922 TO 1925]',
          }
          report={}
          for label,q in queries.items():
            params=urllib.parse.urlencode({'q':q,'fl[]':['identifier','title','creator','date','year','description','identifier-access','identifier-ark','external-identifier'],'rows':50,'output':'json'},doseq=True)
            url='https://archive.org/advancedsearch.php?'+params
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: data=json.loads(r.read().decode())
              report[label]={'numFound':data.get('response',{}).get('numFound'),'docs':data.get('response',{}).get('docs',[])}
            except Exception as exc: report[label]={'error':repr(exc)}
          (out/'probe-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))

      - name: Inspect candidate metadata
        shell: python
        run: |
          import json,pathlib,urllib.request
          out=pathlib.Path('proyecto-misiones-1923-probe')
          report=json.loads((out/'probe-report.json').read_text(encoding='utf-8'))
          ids=[]
          for val in report.values():
            for d in val.get('docs',[]):
              if d.get('identifier') and d['identifier'] not in ids: ids.append(d['identifier'])
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          meta={}
          for ident in ids[:30]:
            try:
              req=urllib.request.Request('https://archive.org/metadata/'+ident,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.loads(r.read().decode())
              files=[]
              for f in obj.get('files',[]):
                name=f.get('name',''); fmt=f.get('format','')
                if name.lower().endswith(('.pdf','.djvu','.txt','.xml')) or fmt in {'Text PDF','DjVu','DjVuTXT','Djvu XML','Single Page Processed JP2 ZIP'}:
                  files.append({'name':name,'format':fmt,'size':f.get('size'),'source':f.get('source')})
              meta[ident]={'metadata':obj.get('metadata',{}),'files':files}
            except Exception as exc: meta[ident]={'error':repr(exc)}
          (out/'metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-proyecto-misiones-1923-probe
          path: proyecto-misiones-1923-probe/
          retention-days: 1
