name: Probe Proyecto Misiones Federales 1923 primary copies

on:
  push:
    branches: [freeze-proyecto-misiones-federales-1923]
    paths:
      - ".github/workflows/probe-proyecto-misiones-federales-1923.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Internet Archive catalog
        shell: python
        run: |
          import json,pathlib,urllib.parse,urllib.request
          out=pathlib.Path('proyecto-misiones-1923-probe'); out.mkdir()
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          queries={
            'exact':'title:("Proyecto para la organizacion de las misiones federales de educacion")',
            'misiones':'title:(misiones federales educacion) AND year:[1922 TO 1925]',
            'sep':'creator:(Mexico) AND title:(misiones) AND year:[1922 TO 1925]',
            'education':'title:(organizacion misiones educacion) AND year:[1922 TO 1925]',
          }
          report={}
          for label,q in queries.items():
            params=urllib.parse.urlencode({'q':q,'fl[]':['identifier','title','creator','date','year','description','identifier-access','identifier-ark','external-identifier'],'rows':50,'output':'json'},doseq=True)
            url='https://archive.org/advancedsearch.php?'+params
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: data=json.loads(r.read().decode())
              report[label]={'numFound':data.get('response',{}).get('numFound'),'docs':data.get('response',{}).get('docs',[])}
            except Exception as exc: report[label]={'error':repr(exc)}
          (out/'probe-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))

      - name: Resolve HathiTrust bibliographic metadata and crosswalk identifiers
        shell: python
        run: |
          import json,pathlib,re,urllib.parse,urllib.request
          out=pathlib.Path('proyecto-misiones-1923-probe')
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          htid='uc1.a0009571225'
          url=f'https://catalog.hathitrust.org/api/volumes/full/htid/{htid}.json'
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req,timeout=60) as r:
              obj=json.loads(r.read().decode('utf-8',errors='replace'))
          (out/'hathi-full.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(obj,ensure_ascii=False,indent=2))

          raw=json.dumps(obj,ensure_ascii=False)
          oclcs=sorted(set(re.findall(r'(?i)oclc[^0-9]{0,20}([0-9]{5,12})',raw)))
          lccns=sorted(set(re.findall(r'(?i)lccn[^0-9]{0,20}([0-9]{6,12})',raw)))
          isbns=sorted(set(re.findall(r'(?i)isbn[^0-9Xx]{0,20}([0-9Xx-]{8,20})',raw)))
          report={'htid':htid,'oclcs':oclcs,'lccns':lccns,'isbns':isbns}

          queries=[('htid',htid),('title','intitle:"Proyecto para la organización de las misiones federales de educación" inauthor:"José Gálvez"')]
          queries += [('oclc',f'oclc:{x}') for x in oclcs[:10]]
          queries += [('lccn',f'lccn:{x}') for x in lccns[:10]]
          gb=[]
          for kind,q in queries:
              try:
                  gurl='https://www.googleapis.com/books/v1/volumes?'+urllib.parse.urlencode({'q':q,'maxResults':40,'printType':'books'})
                  req=urllib.request.Request(gurl,headers=headers)
                  with urllib.request.urlopen(req,timeout=60) as r: data=json.loads(r.read().decode())
                  items=[]
                  for item in data.get('items',[]):
                      vi=item.get('volumeInfo',{}); ai=item.get('accessInfo',{})
                      items.append({'id':item.get('id'),'title':vi.get('title'),'authors':vi.get('authors'),'publisher':vi.get('publisher'),'publishedDate':vi.get('publishedDate'),'industryIdentifiers':vi.get('industryIdentifiers'),'viewability':ai.get('viewability'),'publicDomain':ai.get('publicDomain'),'pdf':ai.get('pdf'),'webReaderLink':ai.get('webReaderLink')})
                  gb.append({'kind':kind,'query':q,'totalItems':data.get('totalItems'),'items':items})
              except Exception as exc:
                  gb.append({'kind':kind,'query':q,'error':repr(exc)})
          report['google_books']=gb

          ia=[]
          for oclc in oclcs[:10]:
              try:
                  params=urllib.parse.urlencode({'q':f'identifier-access:* OR external-identifier:(urn:oclc:record:{oclc}) OR oclc-id:{oclc}','fl[]':['identifier','title','creator','year','external-identifier','oclc-id','identifier-ark'],'rows':50,'output':'json'},doseq=True)
                  req=urllib.request.Request('https://archive.org/advancedsearch.php?'+params,headers=headers)
                  with urllib.request.urlopen(req,timeout=60) as r: data=json.loads(r.read().decode())
                  ia.append({'oclc':oclc,'numFound':data.get('response',{}).get('numFound'),'docs':data.get('response',{}).get('docs',[])})
              except Exception as exc: ia.append({'oclc':oclc,'error':repr(exc)})
          report['ia_crosswalk']=ia
          (out/'crosswalk-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))

      - name: Probe HathiTrust page-delivery routes conservatively
        shell: python
        run: |
          import json,pathlib,urllib.request,urllib.error
          out=pathlib.Path('proyecto-misiones-1923-probe')
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          htid='uc1.a0009571225'
          urls={
            'pageturner_seq1':f'https://babel.hathitrust.org/cgi/pt?id={htid}&seq=1',
            'fulltext_seq1':f'https://babel.hathitrust.org/cgi/imgsrv/fulltext?id={htid}&seq=1',
            'image_seq1':f'https://babel.hathitrust.org/cgi/imgsrv/image?id={htid};seq=1;width=1200',
            'fulltext_seq24':f'https://babel.hathitrust.org/cgi/imgsrv/fulltext?id={htid}&seq=24',
          }
          result={}
          for label,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=r.read(4096)
                      result[label]={'status':r.status,'content_type':r.headers.get('Content-Type'),'prefix':body[:120].decode('utf-8',errors='replace')}
              except urllib.error.HTTPError as exc:
                  result[label]={'status':exc.code,'content_type':exc.headers.get('Content-Type'),'error':'HTTPError'}
              except Exception as exc:
                  result[label]={'error':repr(exc)}
          (out/'hathi-delivery-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-proyecto-misiones-1923-probe
          path: proyecto-misiones-1923-probe/
          retention-days: 1
