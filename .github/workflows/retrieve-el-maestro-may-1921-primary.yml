name: Retrieve El Maestro May 1921 primary pages

on:
  push:
    branches: [freeze-el-maestro-may-1921]

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF inspection utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Locate target articles in exact issue PDF and render primary pages
        shell: python
        run: |
          import json, pathlib, urllib.parse, urllib.request, subprocess, re, unicodedata, xml.etree.ElementTree as ET
          out=pathlib.Path('el-maestro-may-1921-primary'); out.mkdir()
          ident='el-maestro.-revista-de-cultura-nacional-n-2-1921'
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=120) as r:
                  return r.read(), r.headers.get('content-type',''), r.status, r.geturl()
          def norm(s):
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().upper()
              return re.sub(r'\s+',' ',s)

          b,_,_,_=get(f'https://archive.org/metadata/{urllib.parse.quote(ident)}')
          meta=json.loads(b.decode()); md=meta.get('metadata',{})
          identity={k:md.get(k) for k in ['identifier','title','creator','date','description','mediatype','collection']}
          print('IDENTITY',json.dumps(identity,ensure_ascii=False,indent=2))
          hay=norm(' '.join(str(v or '') for v in identity.values()))
          if 'EL MAESTRO' not in hay or '1921' not in hay or 'N 2' not in hay:
              raise SystemExit('exact issue identity gate failed')

          files=meta.get('files',[])
          textpdf=next((f['name'] for f in files if f.get('name','').endswith('_text.pdf')),None)
          scandata=next((f['name'] for f in files if f.get('name','').endswith('_scandata.xml')),None)
          if not textpdf: raise SystemExit('no text PDF')
          bb,cct,_,_=get('https://archive.org/download/'+ident+'/'+urllib.parse.quote(textpdf))
          pdf=out/'issue_text.pdf'; pdf.write_bytes(bb)
          print('TEXT_PDF_BYTES',len(bb),cct)
          if len(bb)<500000 or not bb.startswith(b'%PDF'):
              raise SystemExit('invalid PDF payload')

          if scandata:
              sb,_,_,_=get('https://archive.org/download/'+ident+'/'+urllib.parse.quote(scandata))
              (out/'scandata.xml').write_bytes(sb)

          info=subprocess.run(['pdfinfo',str(pdf)],capture_output=True,text=True,check=True).stdout
          print('PDFINFO\n'+info)
          m=re.search(r'^Pages:\s+(\d+)',info,re.M); page_count=int(m.group(1)) if m else 0
          subprocess.run(['pdftotext','-layout',str(pdf),str(out/'issue.txt')],check=True)
          pages=(out/'issue.txt').read_text(encoding='utf-8',errors='replace').split('\f')
          if pages and not pages[-1].strip(): pages=pages[:-1]
          print('OCR_PAGE_COUNT',len(pages),'PDF_PAGE_COUNT',page_count)
          if page_count and len(pages)!=page_count:
              raise SystemExit('PDF/OCR page count mismatch')

          targets={
            'F41': ['ORIENTACION OBRERA','ORIENTACION','OBRERA'],
            'F42': ['INTERNACIONAL DE LOS INTELECTUALES','INTELECTUALES','CLARIDAD'],
            'F43': ['TRIBUS INDIGENAS MEXICANAS','TRIBUS INDIGENAS','ESCOBAR'],
          }
          hits={}
          for fid,terms in targets.items():
              cand=[]
              for i,text in enumerate(pages,1):
                  n=norm(text)
                  score=sum(1 for t in terms if norm(t) in n)
                  if score:
                      pos=min([n.find(norm(t)) for t in terms if norm(t) in n] or [0])
                      cand.append({'pdf_page':i,'score':score,'snippet':n[max(0,pos-180):pos+700]})
              cand=sorted(cand,key=lambda x:(-x['score'],x['pdf_page']))[:12]
              hits[fid]=cand
          print('TARGET_HITS',json.dumps(hits,ensure_ascii=False,indent=2))
          if any(not hits[fid] for fid in targets):
              raise SystemExit('one or more target articles absent from OCR')

          anchors={fid:hits[fid][0]['pdf_page'] for fid in hits}
          print('ANCHORS',anchors)
          wanted=set()
          for p in anchors.values():
              wanted.update(range(max(1,p-2),min(page_count,p+6)+1))
          render_dir=out/'rendered'; render_dir.mkdir()
          for p in sorted(wanted):
              prefix=render_dir/f'pdf-{p:03d}'
              subprocess.run(['pdftoppm','-f',str(p),'-l',str(p),'-jpeg','-r','160',str(pdf),str(prefix)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          rendered=sorted(x.name for x in render_dir.glob('*.jpg'))
          print('RENDERED',rendered)
          if len(rendered)<len(anchors)*3:
              raise SystemExit('insufficient rendered review pages')

          leaf_map=None
          if scandata:
              root=ET.fromstring((out/'scandata.xml').read_bytes())
              leaves=[]
              for page in root.findall('.//pageData/page'):
                  x=page.findtext('leafNum')
                  if x and x.isdigit(): leaves.append(int(x))
              print('SCANDATA_LEAVES',len(leaves),leaves[:8],leaves[-8:] if leaves else [])
              if len(leaves)==page_count and leaves==list(range(page_count)):
                  leaf_map={str(i+1):i for i in range(page_count)}
                  print('PROVED_PDF_TO_LEAF_OFFSET','leaf = pdf_page - 1')
              else:
                  print('NO_PROVED_PDF_TO_LEAF_MAPPING')

          report={'identity':identity,'pdf_page_count':page_count,'target_hits':hits,'anchors':anchors,'rendered':rendered,'proved_pdf_to_leaf_map':leaf_map}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Upload primary-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-el-maestro-may-1921-primary
          path: el-maestro-may-1921-primary/
          retention-days: 1
