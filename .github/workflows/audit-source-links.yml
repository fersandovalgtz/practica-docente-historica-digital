name: Audit source links

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-source-links.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit referenced public URLs
        run: |
          mkdir -p artifacts/link-audit
          python scripts/audit_source_links.py \
            --output-csv artifacts/link-audit/link_audit.csv \
            --output-json artifacts/link-audit/link_audit_summary.json \
            --timeout 15
      - name: Publish summary
        if: always()
        run: |
          echo "## PDHD source-link audit" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/link-audit/link_audit_summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/link-audit/link_audit_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary file was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-link-audit
          path: artifacts/link-audit/
          if-no-files-found: warn
          retention-days: 30
