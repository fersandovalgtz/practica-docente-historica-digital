name: Finalize El Periquito 6 Nov 1870 primary batch

on:
  push:
    branches: [freeze-el-periquito-1870]
    paths:
      - ".github/workflows/finalize-el-periquito-1870.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote exact four-page primary batch
        shell: python
        run: |
          import csv, pathlib, re

          root = pathlib.Path('.')
          samples = root / 'data/samples'
          catalog = root / 'data/catalog'
          checked = '2026-09-06'
          doc = 'PDHD-D000065'
          basepdf = 'https://hndm.iib.unam.mx/consulta/publicacion/pdf/'

          locator_fields = ['fragment_id','document_id','slot','page','source_locator','locator_evidence_url','boundary_status','public_text_status','freeze_status','preparation_note','checked_at']
          frozen_fields = ['fragment_id','document_id','slot','page','source_locator','locator_evidence_url','boundary_definition','transcription_status','access_basis','public_text_status','selection_role','freeze_status','preparation_note','checked_at']

          rows = {
            'PDHD-F000001': {
              'fragment_id':'PDHD-F000001','document_id':doc,'slot':'A','page':'3',
              'source_locator':'p3-la-mentira-consejo-maestros-corregir-error',
              'locator_evidence_url':basepdf+'558a32a77d1ed64f1688827d.pdf?coleccion=&palabras=',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"Direct inspection of the exact 6 November 1870 HNDM issue fixes a compact prescriptive unit in LA MENTIRA. The selected passage explicitly invokes the advice of parents and teachers against lying and then directs the child reader to acknowledge and correct an error and form a firm purpose not to repeat it. The preceding explanation of why a child's lie is especially harmful and the following general praise of truth are excluded. No source image or historical transcription is committed.",
              'checked_at':checked,
            },
            'PDHD-F000002': {
              'fragment_id':'PDHD-F000002','document_id':doc,'slot':'B','page':'4',
              'source_locator':'p4-director-responsabilidad-articulos-sin-firma',
              'locator_evidence_url':basepdf+'558a32a77d1ed64f1688827e.pdf?coleccion=&palabras=',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"Direct primary inspection fixes the publication-responsibility statement at the lower right of printed p. 4, where unsigned articles are placed under the Director and Ildefonso Estrada y Zenea is named. This is a discrete editorial authority/professional-identity region. The preceding charada solution notice and the separate printer imprint below are excluded.",
              'checked_at':checked,
            },
            'PDHD-F000003': {
              'fragment_id':'PDHD-F000003','document_id':doc,'slot':'C','page':'2',
              'source_locator':'p2-el-periquito-autorretrato-ensenanza-maestro',
              'locator_evidence_url':basepdf+'558a32a77d1ed64f1688827c.pdf?coleccion=&palabras=',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"The earlier Biblioteca Nacional de México scholarly pointer to the eponymous article on p. 2 is now superseded by direct inspection of the exact primary page. The fixed stanza is deliberately source-critical: the periodical personifies itself speaking to children, claims to provide useful teaching and explicitly compares its corrective role with that of a teacher. This self-description is retained as evidence about the newspaper's own pedagogical positioning rather than as an externally verified account of classroom practice.",
              'checked_at':checked,
            },
            'PDHD-F000004': {
              'fragment_id':'PDHD-F000004','document_id':doc,'slot':'D','page':'4',
              'source_locator':'p4-tipografia-el-fenix-imprint-control',
              'locator_evidence_url':basepdf+'558a32a77d1ed64f1688827e.pdf?coleccion=&palabras=',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"Direct inspection of printed p. 4 fixes the final standalone typographic imprint identifying Tipografía El Fénix and M. Méndez Hernández. It is intentionally low-pedagogical publication metadata suitable as a control and does not overlap the Director-responsibility unit immediately above. No source image or transcription is committed.",
              'checked_at':checked,
            },
          }

          boundaries = {
            'PDHD-F000001':"Printed p. 3, right column, within LA MENTIRA: fix the two contiguous paragraphs beginning with the statement that lying is a sin and that parents and teachers will never advise its use, continuing through the paragraph directing the child reader who has committed an error to acknowledge it, correct it and form a firm purpose not to repeat it, ending with the clause that this leaves the child outside further responsibility. Exclude the preceding paragraph on the particular ugliness of a child's lie and the following paragraph beginning the general praise of truth.",
            'PDHD-F000002':"Printed p. 4, lower right column after the horizontal rule beneath the charada solution notice: fix the complete unsigned-article responsibility statement, including the Director label and the named Director Ildefonso Estrada y Zenea. Stop before the separate bottom typographic imprint. Exclude the charada material above.",
            'PDHD-F000003':"Printed p. 2, right column, within the poem/article EL PERIQUITO: fix the compact self-referential stanza beginning with the periodical speaking while children listen attentively and continuing through its claim to provide useful teaching without scolding or blows and its comparison with a teacher, including the immediately following gentle-correction lines. Exclude the earlier opening description of the bird and the later praise/reward lines and continuation on printed p. 3.",
            'PDHD-F000004':"Printed p. 4, extreme lower right beneath the Director-responsibility block: fix only the standalone printer imprint identifying TIPOGRAFIA EL FENIX and M. MENDEZ HERNANDEZ. Exclude the Director block above and all charada content.",
          }
          roles = {
            'PDHD-F000001':'explicit_pedagogical_act',
            'PDHD-F000002':'institutional_relation',
            'PDHD-F000003':'source_criticism_salient',
            'PDHD-F000004':'control',
          }

          # Update F3 in its established historical shard.
          existing = samples / 'fragment_locator_progress_el_periquito_w14.csv'
          with existing.open(encoding='utf-8', newline='') as f:
              erows = list(csv.DictReader(f)); efields = list(erows[0].keys()) if erows else locator_fields
          seen = 0
          for r in erows:
              if r.get('fragment_id') == 'PDHD-F000003':
                  r.update(rows['PDHD-F000003']); seen += 1
          if seen != 1:
              raise SystemExit(f'expected exactly one F3 locator row, got {seen}')
          with existing.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=efields); w.writeheader(); w.writerows(erows)

          # Add former gaps in a new audit shard.
          newloc = samples / 'fragment_locator_progress_hndm_el_periquito1870_w25.csv'
          if newloc.exists():
              raise SystemExit(f'unexpected pre-existing shard {newloc}')
          with newloc.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=locator_fields); w.writeheader()
              for fid in ['PDHD-F000001','PDHD-F000002','PDHD-F000004']:
                  w.writerow(rows[fid])

          # Freeze all four non-overlapping units together.
          newfrozen = samples / 'frozen_fragments_hndm_el_periquito1870_w25.csv'
          if newfrozen.exists():
              raise SystemExit(f'unexpected pre-existing frozen shard {newfrozen}')
          with newfrozen.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=frozen_fields); w.writeheader()
              for fid in ['PDHD-F000001','PDHD-F000002','PDHD-F000003','PDHD-F000004']:
                  r=rows[fid]
                  w.writerow({
                    'fragment_id':fid,'document_id':doc,'slot':r['slot'],'page':r['page'],
                    'source_locator':r['source_locator'],'locator_evidence_url':r['locator_evidence_url'],
                    'boundary_definition':boundaries[fid],'transcription_status':'not_transcribed',
                    'access_basis':'HNDM_public_interface_manual_inspection','public_text_status':'metadata_only',
                    'selection_role':roles[fid],'freeze_status':'frozen','preparation_note':r['preparation_note'],'checked_at':checked,
                  })

          # Remove exactly the three former El Periquito gaps.
          gap = samples / 'fragment_gap_queue_0_1.csv'
          with gap.open(encoding='utf-8', newline='') as f:
              grows=list(csv.DictReader(f)); gfields=list(grows[0].keys())
          remove={'PDHD-F000001','PDHD-F000002','PDHD-F000004'}
          present={r['fragment_id'] for r in grows}
          if not remove <= present:
              raise SystemExit(f'expected gaps missing before promotion: {sorted(remove-present)}')
          kept=[r for r in grows if r['fragment_id'] not in remove]
          if len(grows)-len(kept) != 3:
              raise SystemExit('gap-removal count gate failed')
          with gap.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=gfields); w.writeheader(); w.writerows(kept)

          # Resolve the historical retrieval attempt without erasing the failed route.
          ra = samples / 'retrieval_attempts.csv'
          with ra.open(encoding='utf-8', newline='') as f:
              attempts=list(csv.DictReader(f)); afields=list(attempts[0].keys())
          seen=0
          for r in attempts:
              if r.get('attempt_id') == 'PDHD-RA000002':
                  seen += 1
                  r['result_status']='superseded_by_locator'
                  r['blocker']=("The original HNDM descriptor established the third-era chronology and four-page issue structure but did not expose page IDs, while the bound-container description for La Escuela de primeras letras was marked unavailable/in technical process. A later direct check of UNAM-RI record 921573 exposed structured fields for the exact selected object: item_pages=4, item_publication_id=558075be7d1e63c9fea1a3df, item_first_page_id=558a32a77d1ed64f1688827b and item_date=1870-11-06. Entering HNDM through that persistent first-page ID and following explicit siguienteLink identifiers recovered four unique PDFs; every viewer page reported Periquito, El, date 1870-11-06 and count 4, and every PDF identifier matched its page_id. Direct image inspection fixes F000001 on p. 3, F000002 and F000004 as distinct p. 4 regions, and confirms/rebounds F000003 on p. 2.")
                  r['next_route']='frozen_registry_gap_queue_alias_crosswalk_and_status_sync_completed'
                  r['checked_at']=checked
          if seen != 1:
              raise SystemExit(f'expected exactly one RA2 row, got {seen}')
          with ra.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=afields); w.writeheader(); w.writerows(attempts)

          # Register the now directly verified object crosswalk.
          aliases = catalog / 'object_aliases.csv'
          with aliases.open(encoding='utf-8', newline='') as f:
              arows=list(csv.DictReader(f)); alias_fields=list(arows[0].keys())
          if any(r.get('alias_id')=='PDHD-A000007' for r in arows):
              raise SystemExit('PDHD-A000007 already exists')
          arows.append({
            'alias_id':'PDHD-A000007','document_id':doc,'alias_system':'HNDM',
            'alias_identifier':'558075be7d1e63c9fea1a3df',
            'alias_url':'https://hndm.iib.unam.mx/consulta/publicacion/visualizar/558075be7d1e63c9fea1a3df?intPagina=1&tipo=publicacion&anio=1870&mes=11&dia=6',
            'alias_role':'full_text_target','verification_status':'directly_verified',
            'evidence_url':'https://repositorio.unam.mx/contenidos/ficha/el-periquito-921573',
            'checked_at':checked,
            'note':'UNAM-RI 921573 identifies the exact 1870-11-06 El Periquito issue, exposes item_pages=4, HNDM publication id 558075be7d1e63c9fea1a3df and persistent first page id 558a32a77d1ed64f1688827b. Direct HNDM traversal from that page ID recovered all four issue pages. This row remains an object crosswalk; fragment page evidence is stored separately in the locator/frozen shards.'
          })
          with aliases.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=alias_fields); w.writeheader(); w.writerows(arows)

          # Document the crosswalk without collapsing object identity into fragment evidence.
          crosslog = root / 'docs/OBJECT_CROSSWALK_LOG.md'
          x = crosslog.read_text(encoding='utf-8')
          section = """## 2026-09-06 — El Periquito no. 4, UNAM-RI to HNDM\n\nUNAM-RI record `921573` resolves the exact selected issue of *El Periquito* dated 6 November 1870 and exposes `item_pages=4`, HNDM `item_publication_id=558075be7d1e63c9fea1a3df` and persistent `item_first_page_id=558a32a77d1ed64f1688827b`. The corresponding HNDM full-text target is registered as `PDHD-A000007`.\n\nUnlike the earlier descriptor-only state, the persistent first-page identifier was directly usable. Traversal by HNDM's explicit `siguienteLink` identifiers recovered four unique page PDFs and every page preserved the expected title, issue date and four-page count. The crosswalk remains object-level provenance; the direct page locators and fixed coder boundaries are recorded separately in the fragment shards.\n\n"""
          if '## 2026-09-06 — El Periquito no. 4, UNAM-RI to HNDM' not in x:
              anchor='## Integrity decision\n'
              if anchor not in x:
                  raise SystemExit('crosswalk log insertion anchor missing')
              x=x.replace(anchor,section+anchor,1)
              crosslog.write_text(x,encoding='utf-8')

          # Public README count synchronization and batch note.
          readme = root / 'README.md'
          txt=readme.read_text(encoding='utf-8')
          def sub1(text, pattern, repl, label):
              new,n=re.subn(pattern,repl,text,count=1,flags=re.M)
              if n!=1: raise SystemExit(f'{label}: expected one replacement, got {n}')
              return new
          txt=sub1(txt,r'(\| Slots con localizador candidato/resuelto \| \*\*)\d+( / 96\*\* \|)',r'\g<1>95\g<2>','README located table')
          txt=sub1(txt,r'(\| Fragmentos completamente congelados \| \*\*)\d+( / 96\*\* \|)',r'\g<1>77\g<2>','README frozen table')
          txt=sub1(txt,r'(su unión contiene \*\*)\d+(/96\*\* slots)',r'\g<1>95\g<2>','README locator union')
          txt=sub1(txt,r'(su unión contiene \*\*)\d+(/96\*\* fragmentos)',r'\g<1>77\g<2>','README frozen union')
          txt=sub1(txt,r'\*\*\d+/96 slots tienen ya un localizador documentado\.\*\*','**95/96 slots tienen ya un localizador documentado.**','README next-gate located')
          txt=sub1(txt,r'\*\*\d+ localizadores todavía no congelados\*\*','**18 localizadores todavía no congelados**','README not frozen')
          txt=sub1(txt,r'Quedan \*\*\d+ slots sin localizador\*\*','Queda **1 slot sin localizador**','README gap prose')
          txt=re.sub(r'Los \*\*\d+/96\*\* congelados', 'Los **77/96** congelados', txt, count=1)
          note=("`PDHD-D000065`, *El Periquito*, núm. 4 del 6 de noviembre de 1870, completa A–D desde las cuatro páginas primarias HNDM. La ficha UNAM-RI `921573` resolvió el serial `558075be7d1e63c9fea1a3df`, `item_pages=4` y la primera página persistente `558a32a77d1ed64f1688827b`; la navegación explícita del visor recuperó las cuatro hojas con identidad consistente. `PDHD-F000001` fija en p. 3 una prescripción moral explícita de *La Mentira*; `PDHD-F000002` fija en p. 4 la responsabilidad editorial del Director; `PDHD-F000003` sustituye el puntero secundario por el autorretrato pedagógico primario de p. 2; y `PDHD-F000004` usa el pie de imprenta de p. 4 como control. No se publica facsímil ni transcripción histórica.")
          if '`PDHD-D000065`, *El Periquito*' not in txt:
              anchor='\n## Siguiente puerta metodológica\n'
              if anchor not in txt: raise SystemExit('README batch-note anchor missing')
              txt=txt.replace(anchor,'\n'+note+'\n'+anchor,1)
          readme.write_text(txt,encoding='utf-8')

          # Cohort status canonical counts.
          cohort=root/'docs/PDHD_U1_COHORT_STATUS.md'
          c=cohort.read_text(encoding='utf-8')
          c=sub1(c,r'(\| Fragment locator rows resolved/candidate \| \*\*)\d+( / 96\*\* \| )[^\n]+',r'\g<1>95\g<2>99.0% of reliability slots localized','cohort located table')
          c=sub1(c,r'(\| Fully frozen fragments \| \*\*)\d+( / 96\*\* \|)',r'\g<1>77\g<2>','cohort frozen table')
          c=sub1(c,r'PDHD-U1 now has \*\*\d+ of the 96 deterministic reliability slots\*\* tied to a documented page, scan or section target\. [A-Za-z-]+ units have crossed the stronger frozen-fragment gate\.', 'PDHD-U1 now has **95 of the 96 deterministic reliability slots** tied to a documented page, scan or section target. Seventy-seven units have crossed the stronger frozen-fragment gate.','cohort headline')
          c=sub1(c,r'(selected documents now have complete four-slot batches\.)',r'\g<1>','cohort complete-doc anchor') if False else c
          # Canonical complete-document sentence is text, not machine-derived; update its current word form.
          c=c.replace('Seventeen selected documents now have complete four-slot batches.','Eighteen selected documents now have complete four-slot batches.',1)
          c=sub1(c,r'(contains \*\*)\d+(/96\*\* pilot slots\. )[A-Za-z-]+( are frozen\. The remaining \*\*)\d+(\*\* located rows)',r'\g<1>95\g<2>Seventy-seven\g<3>18\g<4>','cohort locator/frozen prose')
          c=sub1(c,r'\*\*\d+ slots remain without a locator\.\*\*','**1 slot remains without a locator.**','cohort gaps')
          c=re.sub(r'The current \d+ frozen units demonstrate','The current 77 frozen units demonstrate',c,count=1)
          c=sub1(c,r'(project is now at \*\*)\d+(/96 localized\*\*)',r'\g<1>95\g<2>','cohort decision localized')
          cohort.write_text(c,encoding='utf-8')

          # Source-of-truth quantitative gate before validation.
          def union_ids(pattern):
              ids=set()
              for p in sorted(samples.glob(pattern)):
                  with p.open(encoding='utf-8',newline='') as f:
                      for r in csv.DictReader(f):
                          if r.get('fragment_id','').strip(): ids.add(r['fragment_id'].strip())
              return ids
          loc=union_ids('fragment_locator_progress*.csv')
          frozen=union_ids('frozen_fragments*.csv')
          with gap.open(encoding='utf-8',newline='') as f: gaps=list(csv.DictReader(f))
          print('COUNTS',len(loc),len(frozen),len(gaps),len(loc)-len(frozen))
          if (len(loc),len(frozen),len(gaps),len(loc)-len(frozen)) != (95,77,1,18):
              raise SystemExit('El Periquito count gate failed')

      - name: Remove temporary El Periquito workflows
        shell: bash
        run: |
          rm -f .github/workflows/probe-el-periquito-1870.yml
          rm -f .github/workflows/retrieve-el-periquito-1870.yml
          rm -f .github/workflows/finalize-el-periquito-1870.yml

      - name: Run canonical validation suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          python scripts/validate_object_aliases.py
          python scripts/validate_content_leads.py
          python scripts/validate_retrieval_attempts.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_freeze_conversion_queue.py
          python scripts/prepare_freeze_review.py --check
          python scripts/validate_status_counts.py
          python scripts/annotation_agreement.py --self-test
          python scripts/build_fragment_manifest.py --check

      - name: Gate effective final tree including new shards
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          { git diff --name-only origin/main -- .; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u > /tmp/changed
          cat /tmp/changed
          cat > /tmp/allowed <<'EOF'
          README.md
          data/catalog/object_aliases.csv
          data/samples/fragment_gap_queue_0_1.csv
          data/samples/fragment_locator_progress_el_periquito_w14.csv
          data/samples/fragment_locator_progress_hndm_el_periquito1870_w25.csv
          data/samples/frozen_fragments_hndm_el_periquito1870_w25.csv
          data/samples/retrieval_attempts.csv
          docs/OBJECT_CROSSWALK_LOG.md
          docs/PDHD_U1_COHORT_STATUS.md
          EOF
          sort -u /tmp/allowed -o /tmp/allowed
          bad=$(comm -23 /tmp/changed /tmp/allowed || true)
          missing=$(comm -13 /tmp/changed /tmp/allowed || true)
          if [ -n "$bad" ]; then echo 'Unexpected final-tree paths:'; echo "$bad"; exit 1; fi
          if [ -n "$missing" ]; then echo 'Missing expected final-tree paths:'; echo "$missing"; exit 1; fi
          if grep -q '^\.github/workflows/' /tmp/changed; then echo 'temporary workflow leaked into final tree'; exit 1; fi

      - name: Commit and push clean scientific tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fernando Sandoval'
          git config user.email 'fernando.sandoval@uacj.mx'
          git add README.md data/catalog/object_aliases.csv data/samples/fragment_gap_queue_0_1.csv data/samples/fragment_locator_progress_el_periquito_w14.csv data/samples/fragment_locator_progress_hndm_el_periquito1870_w25.csv data/samples/frozen_fragments_hndm_el_periquito1870_w25.csv data/samples/retrieval_attempts.csv docs/OBJECT_CROSSWALK_LOG.md docs/PDHD_U1_COHORT_STATUS.md
          git add -u .github/workflows/
          git commit -m 'Freeze El Periquito 6 Nov 1870 primary batch'
          git push origin HEAD:freeze-el-periquito-1870
