name: Inspect 1Hs bound volume for D074 primary surrogate

on:
  push:
    branches: [work/d074-canonical-page-recovery]
    paths: [.github/workflows/retrieve-d074-1hs-primary.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect public bound-volume PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p d074-1hs-review/rendered
          python - <<'PY'
          import html, pathlib, re, urllib.request
          vid='1HsQAAAAYAAJ'
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9,en;q=0.8'}
          req=urllib.request.Request(f'https://books.google.com/books?id={vid}&printsec=frontcover',headers=headers)
          with urllib.request.urlopen(req,timeout=90) as r: text=html.unescape(r.read().decode('utf-8',errors='replace')).replace('\\/','/').replace('\\u0026','&')
          links=re.findall(r'https?://books\.google\.[^/]+/books/download/[^"\'<> ]+?\.pdf\?[^"\'<> ]+',text)
          if not links: raise SystemExit('no public PDF link')
          req=urllib.request.Request(links[0].replace('&amp;','&'),headers=headers)
          with urllib.request.urlopen(req,timeout=300) as r: body=r.read()
          if not body.startswith(b'%PDF') or len(body)<100000: raise SystemExit(f'invalid PDF {len(body)}')
          pathlib.Path('d074-1hs-review/volume.pdf').write_bytes(body)
          print('downloaded bytes',len(body))
          PY
          pdfinfo d074-1hs-review/volume.pdf | tee d074-1hs-review/pdfinfo.txt
          pdftotext -layout d074-1hs-review/volume.pdf d074-1hs-review/volume.txt
          python - <<'PY'
          import json, pathlib, re, unicodedata
          p=pathlib.Path('d074-1hs-review')
          pages=(p/'volume.txt').read_text(encoding='utf-8',errors='replace').split('\f')
          if pages and not pages[-1].strip(): pages.pop()
          def norm(s):
            s=unicodedata.normalize('NFD',s.lower()); s=''.join(c for c in s if unicodedata.category(c)!='Mn')
            return re.sub(r'\s+',' ',s)
          pats={
            'title':'memoria de la secretaria de educacion publica',
            'sep1935':'septiembre de 1935','aug1936':'agosto de 1936',
            'sep1936':'septiembre de 1936','aug1937':'agosto de 1937',
            'sep1937':'septiembre de 1937','aug1938':'agosto de 1938',
            'tomo_ii':'tomo ii','mexico_1937':'mexico 1937',
            'A_integral':'educacion integral del alumno','A_manual':'trabajo manual',
            'B_consejo':'consejo nacional de la educacion superior',
            'D_becas':'distribucion de becas','C_bibliotecas':'bibliotecas',
          }
          hits=[]
          for i,pg in enumerate(pages,1):
            n=norm(pg); m=[k for k,v in pats.items() if v in n]
            if m:
              lines=[re.sub(r'\s+',' ',x).strip() for x in pg.splitlines() if x.strip()]
              hits.append({'physical_pdf_page':i,'matched':m,'first_lines':lines[:12],'last_lines':lines[-8:]})
          (p/'hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PHYSICAL_PAGES',len(pages)); print(json.dumps(hits,ensure_ascii=False,indent=2))
          sel=set(range(1,min(16,len(pages))+1))
          for h in hits:
            if any(k in h['matched'] for k in ['title','sep1936','aug1937','mexico_1937','tomo_ii','A_integral','B_consejo','D_becas']):
              for q in range(max(1,h['physical_pdf_page']-1),min(len(pages),h['physical_pdf_page']+1)+1): sel.add(q)
          (p/'render-pages.txt').write_text('\n'.join(map(str,sorted(sel))),encoding='utf-8')
          PY
          while read -r n; do
            [ -n "$n" ] || continue
            pdftoppm -f "$n" -l "$n" -singlefile -jpeg -r 180 d074-1hs-review/volume.pdf "d074-1hs-review/rendered/physical-$(printf '%04d' "$n")" >/dev/null 2>&1
          done < d074-1hs-review/render-pages.txt
      - name: Upload one-day primary review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d074-1hs-primary-review
          path: d074-1hs-review/
          retention-days: 1
          if-no-files-found: error
