name: Finalize Misiones Culturales 1927 batch

on:
  push:
    branches: [freeze-misiones-culturales-1927]
    paths:
      - ".github/workflows/finalize-misiones-culturales-1927.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-misiones-culturales-1927
          fetch-depth: 0

      - name: Freeze four primary-verified fragments without CSV reformatting
        shell: python
        run: |
          import csv
          import io
          from pathlib import Path

          def csv_line(values):
              buf = io.StringIO()
              csv.writer(buf, lineterminator='').writerow(values)
              return buf.getvalue()

          loc_path = Path('data/samples/fragment_locator_progress_0_1.csv')
          loc_lines = loc_path.read_text(encoding='utf-8').splitlines()
          replacements = {
              'PDHD-F000069': csv_line([
                  'PDHD-F000069','PDHD-D000069','A','54','p54-juego-recurso-educativo-practica',
                  'https://archive.org/download/lasmisionescultu00mexi/lasmisionescultu00mexi.pdf#page=74',
                  'fixed','metadata_only','frozen',
                  'Direct inspection of the exact Internet Archive primary PDF fixes printed p. 54 / physical PDF page 74, item c) only: the paragraph on using play as an educational resource through the sentence describing games already put into practice; exclude the preceding continuation of item b) and the following item d) on sport. The earlier p. 51 pointer was only the section-title leaf and is superseded by this explicit pedagogical span.',
                  '2026-09-06'
              ]),
              'PDHD-F000070': csv_line([
                  'PDHD-F000070','PDHD-D000069','B','212','p212-cualidades-precisas-maestro-rural',
                  'https://archive.org/download/lasmisionescultu00mexi/lasmisionescultu00mexi.pdf#page=232',
                  'fixed','metadata_only','frozen',
                  'Direct primary inspection fixes printed p. 212 / physical PDF page 232, first paragraph under Cualidades precisas de un maestro rural: from the opening reference to Rafael Ramírez through the sentence connecting the school program with knowledge of campesino social life; stop before Estas dos opiniones. The span explicitly defines sympathy toward rural-community problems, spirit of service and leader temperament. The former p. 209 pointer was only the section title.',
                  '2026-09-06'
              ]),
              'PDHD-F000071': csv_line([
                  'PDHD-F000071','PDHD-D000069','C','23','p23-origen-testimonio-documento-1923',
                  'https://archive.org/download/lasmisionescultu00mexi/lasmisionescultu00mexi.pdf#page=43',
                  'fixed','metadata_only','frozen',
                  'Direct primary inspection fixes printed p. 23 / physical PDF page 43: from Rafael Ramírez opening his retrospective account of the missions through his reproduction of the 9 November 1923 Vasconcelos document and the paragraph interpreting the original purpose; stop before the roster beginning Esta primera Misión Cultural se organizó. The earlier p. 21 pointer was only the section-title leaf.',
                  '2026-09-06'
              ]),
              'PDHD-F000072': csv_line([
                  'PDHD-F000072','PDHD-D000069','D','371','p371-budget-section-title-control',
                  'https://archive.org/download/lasmisionescultu00mexi/lasmisionescultu00mexi.pdf#page=391',
                  'fixed','metadata_only','frozen',
                  'Direct primary inspection retains printed p. 371 / physical PDF page 391 as a deliberately non-analytical control: the standalone section-title region Presupuesto de las Misiones Culturales para 1928 y cuadro comparativo con el de 1927; exclude the blank reverse and the substantive budget beginning on printed p. 373. Physical page 390 ends at printed p. 370 and physical page 393 is printed p. 373, confirming the sequence.',
                  '2026-09-06'
              ]),
          }
          seen = set()
          out = []
          for line in loc_lines:
              fid = line.split(',', 1)[0]
              if fid in replacements:
                  out.append(replacements[fid])
                  seen.add(fid)
              else:
                  out.append(line)
          missing = set(replacements) - seen
          if missing:
              raise SystemExit(f'Missing locator rows: {sorted(missing)}')
          loc_path.write_text('\n'.join(out) + '\n', encoding='utf-8')

          frozen_path = Path('data/samples/frozen_fragments_0_1.csv')
          frozen_lines = frozen_path.read_text(encoding='utf-8').splitlines()
          existing = {line.split(',',1)[0] for line in frozen_lines[1:] if line}
          new_rows = [
              csv_line([
                  'PDHD-F000069','PDHD-D000069','A','54','p54-juego-recurso-educativo-practica',
                  'https://archive.org/download/lasmisionescultu00mexi/lasmisionescultu00mexi.pdf#page=74',
                  'Printed p. 54: item c) only, beginning with the instruction to use play as an educational resource and ending with the sentence describing the organic and spiritual effects of the games already put into practice; exclude the preceding continuation of item b) and item d) on sport.',
                  'not_transcribed','Internet_Archive_exact_primary_pdf_image_inspection','metadata_only','explicit_pedagogical_act','frozen',
                  'HathiTrust record 103012999 exposes the same ARK as Internet Archive item lasmisionescultu00mexi (ark:/13960/t3dz33208). The exact 1928 SEP PDF was recovered from Internet Archive and visually inspected. Printed p. 54 maps to physical PDF page 74. The fixed unit is a compact, explicit teaching prescription centered on play; no source text or image is committed.',
                  '2026-09-06'
              ]),
              csv_line([
                  'PDHD-F000070','PDHD-D000069','B','212','p212-cualidades-precisas-maestro-rural',
                  'https://archive.org/download/lasmisionescultu00mexi/lasmisionescultu00mexi.pdf#page=232',
                  'Printed p. 212: first paragraph under Cualidades precisas de un maestro rural, from the opening reference to Rafael Ramírez through the sentence on knowledge of campesino social life; stop before the paragraph beginning Estas dos opiniones.',
                  'not_transcribed','Internet_Archive_exact_primary_pdf_image_inspection','metadata_only','institutional_relation','frozen',
                  'The exact 1928 SEP primary PDF maps printed p. 212 to physical PDF page 232. Direct visual inspection replaces the weak p. 209 section-title pointer with the substantive professional-identity unit defining sympathy toward rural-community problems, spirit of service and leader temperament. No source text or image is committed.',
                  '2026-09-06'
              ]),
              csv_line([
                  'PDHD-F000071','PDHD-D000069','C','23','p23-origen-testimonio-documento-1923',
                  'https://archive.org/download/lasmisionescultu00mexi/lasmisionescultu00mexi.pdf#page=43',
                  'Printed p. 23: from Rafael Ramírez opening his retrospective history of the missions through the reproduced 9 November 1923 Vasconcelos document and the paragraph interpreting the missions original purpose; stop before the roster beginning Esta primera Misión Cultural se organizó.',
                  'not_transcribed','Internet_Archive_exact_primary_pdf_image_inspection','metadata_only','source_criticism_salient','frozen',
                  'Printed p. 23 maps to physical PDF page 43. The span is source-critically salient because Ramírez explicitly positions himself as an early participant, explains why he preserves and publishes a document from 1923, reproduces that institutional evidence and then interprets it. This converts the old p. 21 section-title pointer into a bounded evidentiary unit. No source text or image is committed.',
                  '2026-09-06'
              ]),
              csv_line([
                  'PDHD-F000072','PDHD-D000069','D','371','p371-budget-section-title-control',
                  'https://archive.org/download/lasmisionescultu00mexi/lasmisionescultu00mexi.pdf#page=391',
                  'Printed p. 371 / physical PDF page 391: standalone title region Presupuesto de las Misiones Culturales para 1928 y cuadro comparativo con el de 1927; exclude the blank reverse and the substantive budget beginning on printed p. 373.',
                  'not_transcribed','Internet_Archive_exact_primary_pdf_image_inspection','metadata_only','control','frozen',
                  'Direct primary inspection preserves the budget-section title leaf as a deliberately low-pedagogical-content control. Physical PDF page 390 visibly ends on printed p. 370 and physical page 393 is printed p. 373, fixing the intervening title leaf as p. 371 despite the absence of a visible folio on the title itself. No source image is committed.',
                  '2026-09-06'
              ]),
          ]
          for row in new_rows:
              fid = row.split(',',1)[0]
              if fid not in existing:
                  frozen_lines.append(row)
          frozen_path.write_text('\n'.join(frozen_lines) + '\n', encoding='utf-8')

      - name: Synchronize status documentation
        shell: python
        run: |
          from pathlib import Path

          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8')
          repl = {
              '| Fragmentos completamente congelados | **45 / 96** |': '| Fragmentos completamente congelados | **49 / 96** |',
              'su unión contiene **45/96** fragmentos.': 'su unión contiene **49/96** fragmentos.',
              '**38 localizadores todavía no congelados**': '**34 localizadores todavía no congelados**',
              'Los **45/96** congelados demuestran': 'Los **49/96** congelados demuestran',
              'El proyecto ya tiene tres lotes completos de **fragment freezing**.': 'El proyecto cuenta ya con múltiples lotes completos de **fragment freezing**.',
          }
          for old,new in repl.items():
              if old not in s:
                  raise SystemExit(f'README synchronization anchor missing: {old}')
              s = s.replace(old,new)
          marker = '\n\nComo HNDM permanece `metadata_only`'
          para = "\n\n`PDHD-D000069`, *Las misiones culturales en 1927: Las escuelas normales rurales* (1928), completa ahora A–D desde el objeto primario `lasmisionescultu00mexi` de Internet Archive, cuyo `ark:/13960/t3dz33208` coincide con el registro full-view de HathiTrust. La inspección directa corrige tres punteros que sólo señalaban portadas de sección: `PDHD-F000069` se fija en p. 54 como acto didáctico sobre el juego como recurso educativo; `PDHD-F000070` en p. 212 como representación profesional de las cualidades precisas del maestro rural; `PDHD-F000071` en p. 23 como unidad de crítica de fuentes donde Rafael Ramírez articula memoria, testimonio y un documento institucional de 1923; y `PDHD-F000072` conserva la portada presupuestaria de p. 371 como control deliberadamente no analítico. El repositorio no incorpora el facsímil ni su OCR.\n"
          if para.strip() not in s:
              if marker not in s:
                  raise SystemExit('README insertion marker missing')
              s = s.replace(marker, para + marker)
          readme.write_text(s, encoding='utf-8')

          status = Path('docs/PDHD_U1_COHORT_STATUS.md')
          t = status.read_text(encoding='utf-8')
          repl2 = {
              'Reference cut: **2026-09-05**': 'Reference cut: **2026-09-06**',
              '| Fully frozen fragments | **45 / 96** |': '| Fully frozen fragments | **49 / 96** |',
              'Forty-five units have crossed the stronger frozen-fragment gate.': 'Forty-nine units have crossed the stronger frozen-fragment gate.',
              'Ten selected documents now have complete four-slot batches.': 'Eleven selected documents now have complete four-slot batches.',
              'Forty-five are frozen. The remaining **38** located rows': 'Forty-nine are frozen. The remaining **34** located rows',
              'The current 30 frozen units demonstrate': 'The current 49 frozen units demonstrate',
          }
          for old,new in repl2.items():
              if old not in t:
                  raise SystemExit(f'STATUS synchronization anchor missing: {old}')
              t = t.replace(old,new)
          stale = 'The project is now at **83/96 localized** and **30/96 frozen**. The direct-primary sprint established the move from 15 to 22 frozen units; post-sprint primary recovery has added eight more frozen units while reducing the unlocalized complement from 16 to 13. The next quantitative localization checkpoint remains **84/96**, while the stronger scientific priority is converting high-quality existing page pointers and completing document batches without weakening the evidence hierarchy.'
          fresh = 'The project is now at **83/96 localized** and **49/96 frozen**. Recent primary-object recovery has expanded the frozen package while preserving the unlocalized complement at 13. The next quantitative localization checkpoint remains **84/96**, while the stronger scientific priority is converting high-quality existing page pointers and completing document batches without weakening the evidence hierarchy.'
          if stale not in t:
              raise SystemExit('STATUS final paragraph anchor missing')
          t = t.replace(stale,fresh)
          anchor = '`PDHD-D000073`, the 1934 SEP memory, now contributes a complete four-slot batch from the primary Google Books copy `mHgQAAAAYAAJ`.'
          note = "`PDHD-D000069`, *Las misiones culturales en 1927: Las escuelas normales rurales*, now contributes a complete four-slot batch from Internet Archive item `lasmisionescultu00mexi`. HathiTrust record 103012999 points to the same `ark:/13960/t3dz33208`, allowing the blocked Hathi image route to be cross-walked to the exact open primary scan. Direct visual inspection maps printed pp. 23, 54 and 212 to physical PDF pages 43, 74 and 232; the p. 371 budget-title control maps to physical page 391 and is sequence-checked against printed pp. 370 and 373. The batch deliberately replaces section-title pointers with substantive spans where the slot requires analytical content.\n\n"
          pos = t.find(anchor)
          if pos < 0:
              raise SystemExit('STATUS insertion anchor missing')
          next_marker = '\n\nAll third-party image-derived frozen records'
          if note.strip() not in t:
              if next_marker not in t:
                  raise SystemExit('STATUS insertion marker missing')
              t = t.replace(next_marker, '\n\n' + note + 'All third-party image-derived frozen records')
          status.write_text(t, encoding='utf-8')

      - name: Run validators
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_status_counts.py

      - name: Commit finalized batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fernando Sandoval"
          git config user.email "fernando.sandoval@uacj.mx"
          git add README.md data/samples/fragment_locator_progress_0_1.csv data/samples/frozen_fragments_0_1.csv docs/PDHD_U1_COHORT_STATUS.md
          git diff --cached --check
          git commit -m "Freeze Misiones Culturales 1927 primary batch"
          git push origin HEAD:freeze-misiones-culturales-1927
