name: Probe D072 canonical and related-volume signatures

on:
  push:
    branches: [work/d072-primary-surrogate-20260907]
    paths: [.github/workflows/probe-d072-related-signatures.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect canonical SearchWithin results and related Google volumes
        shell: python
        run: |
          import html, json, pathlib, re, urllib.parse, urllib.request, urllib.error
          canonical='ypWS82YskN4C'
          targets=['PA111','PA307','PA465','PA487']
          queries={
            'A_misiones':'Dirección de Misiones Culturales y Escuelas Normales',
            'A_maestros':'maestros misioneros enseñanza',
            'B_psicopedagogia':'Departamento de Psicopedagogía e Higiene',
            'B_higiene':'psicopedagogía higiene escolar',
            'C_tecnica':'enseñanza técnica escuela primaria escuela rural',
            'C_costos':'costo promedio escuela rural escuelas técnicas',
            'D_revalidacion':'Oficina Consultiva y de Revalidación de Estudios',
            'D_consultiva':'revalidación de estudios oficina consultiva',
            'identity':'31 de agosto de 1932',
          }
          out=pathlib.Path('d072-related-signatures'); out.mkdir(exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9,en;q=0.8'}
          def fetch(url,timeout=90):
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r: return r.status,r.geturl(),r.headers.get('Content-Type',''),r.read()
            except urllib.error.HTTPError as e: return e.code,e.geturl(),e.headers.get('Content-Type',''),e.read()
            except Exception as e: return None,url,'',str(e).encode()
          report={'canonical':canonical,'canonical_search':{},'selected_pages':{},'related':{}}
          # Canonical search signatures.
          for label,q in queries.items():
            url='https://books.google.com/books?'+urllib.parse.urlencode({'id':canonical,'jscmd':'SearchWithinVolume2','q':q})
            st,final,ct,body=fetch(url); rec={'status':st,'bytes':len(body),'results':[]}
            try:
              data=json.loads(body.decode('utf-8')); rec['number_of_results']=data.get('number_of_results'); rec['searchable']=data.get('searchable')
              for x in (data.get('search_results') or [])[:10]:
                if isinstance(x,dict): rec['results'].append({k:x.get(k) for k in ['page_id','page_number','snippet_text']})
            except Exception as e: rec['error']=f'{type(e).__name__}: {e}'
            report['canonical_search'][label]=rec
            print('\nCANONICAL',label,json.dumps(rec,ensure_ascii=False,indent=2))
          # Selected-page HTML and related IDs.
          related=set()
          for pg in targets:
            url=f'https://books.google.com/books?id={canonical}&pg={pg}&source=gbs_selected_pages&cad=1'
            st,final,ct,body=fetch(url); text=html.unescape(body.decode('utf-8',errors='replace')).replace('\\/','/').replace('\\u0026','&')
            ids=[]
            for pat in [r'books/content\?id=([A-Za-z0-9_-]+)',r'[?&](?:id|vid)=([A-Za-z0-9_-]{8,})']:
              ids += re.findall(pat,text)
            ids=list(dict.fromkeys(ids)); related.update(ids)
            report['selected_pages'][pg]={'status':st,'bytes':len(body),'page_id_count':text.count(pg),'related_ids':ids[:50]}
            print('\nPAGE',pg,'status',st,'bytes',len(body),'related',ids[:50])
          related.discard(canonical)
          # Compare related volumes against exact signature phrases; inspect frontcover for public PDF link and metadata hints.
          for vid in sorted(related):
            row={'search':{},'front':{}}
            for label,q in queries.items():
              url='https://books.google.com/books?'+urllib.parse.urlencode({'id':vid,'jscmd':'SearchWithinVolume2','q':q})
              st,final,ct,body=fetch(url); rec={'status':st,'bytes':len(body),'results':[]}
              try:
                data=json.loads(body.decode('utf-8')); rec['number_of_results']=data.get('number_of_results'); rec['searchable']=data.get('searchable')
                for x in (data.get('search_results') or [])[:6]:
                  if isinstance(x,dict): rec['results'].append({k:x.get(k) for k in ['page_id','page_number','snippet_text']})
              except Exception as e: rec['error']=f'{type(e).__name__}: {e}'
              row['search'][label]=rec
            fu=f'https://books.google.com/books?id={vid}&printsec=frontcover'
            st,final,ct,body=fetch(fu); text=html.unescape(body.decode('utf-8',errors='replace')).replace('\\/','/').replace('\\u0026','&')
            pdfs=re.findall(r'https?://books\.google\.[^/]+/books/download/[^"\'<> ]+?\.pdf\?[^"\'<> ]+',text)
            title=None
            for pat in [r'<meta[^>]+(?:name|property)=["\'](?:citation_title|og:title)["\'][^>]+content=["\']([^"\']+)',r'<title>(.*?)</title>']:
              m=re.search(pat,text,re.I|re.S)
              if m: title=re.sub(r'\s+',' ',m.group(1)).strip(); break
            row['front']={'status':st,'bytes':len(body),'title_hint':title,'public_pdf_links':len(pdfs)}
            report['related'][vid]=row
            sig={k:[(x.get('page_id'),x.get('page_number')) for x in v['results']] for k,v in row['search'].items() if v.get('results')}
            print('\nRELATED',vid,'front',json.dumps(row['front'],ensure_ascii=False),'SIG',json.dumps(sig,ensure_ascii=False,indent=2))
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Upload one-day report
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d072-related-signatures
          path: d072-related-signatures/
          retention-days: 1
          if-no-files-found: error
