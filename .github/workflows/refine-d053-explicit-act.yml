name: Refine D053 explicit pedagogical act candidates

on:
  push:
    branches:
      - "work/d053-explicit-pedagogical-act"
    paths:
      - ".github/workflows/refine-d053-explicit-act.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Find local pedagogical-prescription co-occurrences
        shell: python
        run: |
          import json
          import pathlib
          import re
          import unicodedata
          import urllib.request
          import xml.etree.ElementTree as ET

          item = "n1n3elmaestrorev02mexi"
          out = pathlib.Path("d053-explicit-act-refine")
          imgdir = out / "candidate-images"
          out.mkdir(exist_ok=True)
          imgdir.mkdir(exist_ok=True)
          headers = {"User-Agent": "PDHD-U1-source-verification/0.1 (+https://github.com/fersandovalgtz/practica-docente-historica-digital)"}

          def fetch(url, timeout=90):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.headers.get("Content-Type", ""), r.geturl(), r.read()

          _, _, _, meta_raw = fetch(f"https://archive.org/metadata/{item}")
          meta = json.loads(meta_raw.decode("utf-8"))
          names = [f.get("name") for f in meta.get("files", []) if f.get("name")]
          djvu_name = next(n for n in names if n.endswith("_djvu.xml"))
          _, _, _, djvu_raw = fetch(f"https://archive.org/download/{item}/{djvu_name}")
          root = ET.fromstring(djvu_raw)

          def norm(s):
              s = unicodedata.normalize("NFD", s.lower())
              s = "".join(c for c in s if unicodedata.category(c) != "Mn")
              return re.sub(r"\s+", " ", s).strip()

          actor = re.compile(r"\b(?:maestr[oa]s?|profesor(?:es|a|as)?|alumn[oa]s?|niñ[oa]s?|escolares?|educandos?|escuela(?:s)?)\b")
          pedagogy = re.compile(r"\b(?:enseñ\w*|educ\w*|instru\w*|lecci\w*|metod\w*|ejercici\w*|aprend\w*|clase(?:s)?|estudi\w*)\b")
          prescription = re.compile(r"\b(?:debe(?:n|rá|ria|rían)?|conviene|procure(?:n)?|procurar|necesario|preciso|procedimiento|práctica|practicar|realizar|realice(?:n)?|se hará|se debe|habrá de|recomienda)\b")

          objects = root.findall(".//OBJECT")
          pages = []
          for idx, obj in enumerate(objects):
              words = [w.text or "" for w in obj.findall(".//WORD")]
              raw = " ".join(words)
              pages.append((idx, raw, norm(raw)))

          # December starts at OCR/BookReader n237, established independently by
          # the exact DICIEMBRE DE 1921 imprint. This local equality is used only
          # for candidate retrieval in the same bound object.
          start = 237
          hits = []
          for idx, raw, text in pages[start:]:
              # windows around actor mentions; require all three semantic groups
              # within a local 900-character context to avoid page-level false positives.
              for am in actor.finditer(text):
                  lo = max(0, am.start() - 450)
                  hi = min(len(text), am.end() + 450)
                  window = text[lo:hi]
                  pm = pedagogy.search(window)
                  rm = prescription.search(window)
                  if not (pm and rm):
                      continue
                  # Rank direct lexical proximity around the actor.
                  center = am.start() - lo
                  pdist = min(abs(pm.start() - center), abs(pm.end() - center))
                  rdist = min(abs(rm.start() - center), abs(rm.end() - center))
                  score = 2000 - pdist - rdist
                  hits.append({
                      "bookreader_n": idx,
                      "actor": am.group(0),
                      "pedagogy": pm.group(0),
                      "prescription": rm.group(0),
                      "score": score,
                      "window": window,
                  })

          # Deduplicate pages, retaining the strongest local window per page.
          best = {}
          for hit in hits:
              n = hit["bookreader_n"]
              if n not in best or hit["score"] > best[n]["score"]:
                  best[n] = hit
          ranked = sorted(best.values(), key=lambda h: (-h["score"], h["bookreader_n"]))

          # Exclude known non-pedagogical classes only from automatic promotion,
          # not from the audit report. The images remain available for human review.
          selected = ranked[:15]
          retrieval = []
          for hit in selected:
              n = hit["bookreader_n"]
              urls = [
                  f"https://archive.org/download/{item}/page/n{n}",
                  f"https://api.archivelab.org/books/{item}/pages/{n}",
                  f"https://archive.org/download/{item}/page/n{n}.jpg",
              ]
              saved = None
              attempts = []
              for url in urls:
                  try:
                      status, ctype, final, body = fetch(url)
                      row = {"url": url, "status": status, "content_type": ctype, "bytes": len(body), "final_url": final}
                      if body.startswith(b"\xff\xd8\xff") or "image/jpeg" in ctype:
                          dest = imgdir / f"candidate_n{n}.jpg"
                          dest.write_bytes(body)
                          row["saved"] = dest.name
                          saved = dest.name
                          attempts.append(row)
                          break
                      attempts.append(row)
                  except Exception as exc:
                      attempts.append({"url": url, "error": f"{type(exc).__name__}: {exc}"})
              retrieval.append({"bookreader_n": n, "saved": saved, "attempts": attempts})

          report = {"item": item, "ranked_local_hits": ranked[:40], "selected_for_visual_review": selected, "retrieval": retrieval}
          (out / "refine-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")

          print("LOCAL_PEDAGOGICAL_PRESCRIPTION_HITS")
          for h in ranked[:40]:
              print("n", h["bookreader_n"], "score", h["score"], "::", h["actor"], "/", h["pedagogy"], "/", h["prescription"])
              print(" ", h["window"][:1300])
          print("RETRIEVAL")
          print(json.dumps(retrieval, ensure_ascii=False, indent=2))

      - name: Upload one-day primary visual-review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d053-explicit-act-visual-review
          path: d053-explicit-act-refine/
          retention-days: 1
          if-no-files-found: error
