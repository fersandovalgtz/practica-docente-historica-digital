name: Inspect D074 search results and related volumes

on:
  push:
    branches: [work/d074-canonical-page-recovery]
    paths: [.github/workflows/probe-d074-search-results-related.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract canonical SearchWithin results and classify related Google volumes
        shell: python
        run: |
          import html, json, pathlib, re, urllib.parse, urllib.request, urllib.error

          canonical='KRV2_jMW8-wC'
          queries={
            'A_trabajo_manual':'trabajo manual',
            'A_educacion_integral':'educación integral',
            'B_consejo':'Consejo Nacional de la Educación Superior y de la Investigación Científica',
            'C_attendance':'1,015,239',
            'C_bibliotecas':'bibliotecas',
            'D_becas':'distribución de becas',
            'D_entidades':'entidades federativas becas',
          }
          out=pathlib.Path('d074-search-related'); out.mkdir(exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9,en;q=0.8'}

          def fetch(url,timeout=90):
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:
                return r.status,r.headers.get('Content-Type',''),r.geturl(),r.read()
            except urllib.error.HTTPError as e:
              return e.code,e.headers.get('Content-Type',''),e.geturl(),e.read()
            except Exception as e:
              return None,'',url,str(e).encode()

          report={'canonical':canonical,'searches':{},'related':{}}
          for label,q in queries.items():
            url='https://books.google.com/books?'+urllib.parse.urlencode({'id':canonical,'jscmd':'SearchWithinVolume2','q':q})
            st,ct,final,body=fetch(url)
            row={'url':url,'status':st,'ctype':ct,'bytes':len(body),'final':final}
            try:
              data=json.loads(body.decode('utf-8'))
              row['number_of_results']=data.get('number_of_results')
              row['searchable']=data.get('searchable')
              results=data.get('search_results') or []
              clean=[]
              for x in results if isinstance(results,list) else []:
                if not isinstance(x,dict): continue
                keep={}
                for k in ['page_id','page_number','page_url','page_order','snippet_text','page_number_label']:
                  if k in x: keep[k]=x[k]
                # Preserve unknown scalar keys because they may expose a route/token.
                keep['_scalar_keys']={k:v for k,v in x.items() if isinstance(v,(str,int,float,bool,type(None))) and k not in keep}
                clean.append(keep)
              row['search_results']=clean
            except Exception as e:
              row['parse_error']=f'{type(e).__name__}: {e}'
              row['prefix']=body[:600].decode('utf-8',errors='replace')
            report['searches'][label]=row
            print('\nSEARCH',label,json.dumps(row,ensure_ascii=False,indent=2))

          # Harvest related-volume IDs surfaced by the canonical selected-page HTML.
          related=set()
          for pg in ['PA372','PA21','PA444','PA35']:
            url=f'https://books.google.com/books?id={canonical}&pg={pg}&source=gbs_selected_pages&cad=1'
            st,ct,final,body=fetch(url)
            text=html.unescape(body.decode('utf-8',errors='replace')).replace('\\/','/').replace('\\u0026','&')
            for m in re.finditer(r'books/content\?id=([A-Za-z0-9_-]+)',text): related.add(m.group(1))
            for m in re.finditer(r'[?&](?:id|vid)=([A-Za-z0-9_-]{8,})',text): related.add(m.group(1))
          related.add(canonical)

          for vid in sorted(related):
            api=f'https://www.googleapis.com/books/v1/volumes/{urllib.parse.quote(vid)}'
            st,ct,final,body=fetch(api)
            row={'status':st,'bytes':len(body)}
            try:
              d=json.loads(body.decode('utf-8')); vi=d.get('volumeInfo',{}); ai=d.get('accessInfo',{})
              row.update({'title':vi.get('title'),'subtitle':vi.get('subtitle'),'authors':vi.get('authors'),'publisher':vi.get('publisher'),'publishedDate':vi.get('publishedDate'),'pageCount':vi.get('pageCount'),'industryIdentifiers':vi.get('industryIdentifiers'),'viewability':ai.get('viewability'),'publicDomain':ai.get('publicDomain'),'accessViewStatus':ai.get('accessViewStatus'),'pdf':ai.get('pdf')})
            except Exception as e: row['parse_error']=f'{type(e).__name__}: {e}'
            report['related'][vid]=row
          print('\nRELATED VOLUMES')
          for vid,row in report['related'].items():
            print(vid, json.dumps({k:row.get(k) for k in ['title','publishedDate','pageCount','viewability','publicDomain','accessViewStatus','industryIdentifiers']},ensure_ascii=False))

          # Flag plausible bibliographic matches for the 1936-1937 memory; no equivalence is inferred.
          plausible=[]
          for vid,row in report['related'].items():
            title=(row.get('title') or '').lower(); date=str(row.get('publishedDate') or '')
            if 'memoria' in title and ('educación pública' in title or 'educacion publica' in title) and date.startswith('1937'):
              plausible.append(vid)
          report['plausible_1937_related']=plausible
          print('PLAUSIBLE_1937_RELATED', plausible)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Upload one-day report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d074-search-related
          path: d074-search-related/
          retention-days: 1
          if-no-files-found: error
