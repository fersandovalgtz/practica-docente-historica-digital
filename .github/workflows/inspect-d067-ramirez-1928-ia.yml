name: Inspect Rafael Ramirez 1928 IA surrogate candidate

on:
  workflow_dispatch:
  push:
    branches:
      - work/d067-primary-surrogate-20260907
    paths:
      - .github/workflows/inspect-d067-ramirez-1928-ia.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect IA metadata, files and primary scan availability
        shell: python
        run: |
          import json, pathlib, re, urllib.parse, urllib.request, urllib.error
          out=pathlib.Path('d067-ramirez1928'); out.mkdir(exist_ok=True)
          item='cmodartodomxicou00ramr'
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'}
          def fetch(url,timeout=120):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status,r.geturl(),r.headers.get('Content-Type',''),r.read()
              except urllib.error.HTTPError as e:
                  return e.code,e.geturl(),e.headers.get('Content-Type',''),e.read()
          st,final,ct,b=fetch(f'https://archive.org/metadata/{item}')
          rep={'metadata_status':st,'metadata_bytes':len(b)}
          data=json.loads(b.decode('utf-8')) if st==200 else {}
          md=data.get('metadata',{})
          rep['metadata']={k:md.get(k) for k in ['identifier','title','creator','date','year','publisher','mediatype','collection','access-restricted-item','openlibrary_edition','openlibrary_work','description','subject']}
          files=data.get('files',[])
          interesting=[]
          for f in files:
              name=f.get('name',''); fmt=f.get('format',''); size=f.get('size')
              if any(x in fmt.lower() for x in ['pdf','text','djvu','scandata','jp2','single page']) or name.lower().endswith(('.pdf','.txt','.xml','.gz','.zip','.jpg','.jpeg','.png')):
                  interesting.append({'name':name,'format':fmt,'size':size,'private':f.get('private'),'original':f.get('original'),'source':f.get('source')})
          rep['files']=interesting
          print('METADATA',json.dumps(rep['metadata'],ensure_ascii=False,indent=2))
          print('FILES',json.dumps(interesting,ensure_ascii=False,indent=2)[:20000])
          # Try only openly listed primary/derivative files; no borrow/auth routes.
          tests=[]
          candidates=[]
          for f in files:
              name=f.get('name','')
              fmt=(f.get('format') or '').lower()
              if f.get('private'):
                  continue
              if name.lower().endswith('.pdf') or 'text pdf' in fmt or 'single page processed jp2 zip' in fmt or name.lower().endswith('_djvu.txt') or name.lower().endswith('_scandata.xml'):
                  candidates.append(name)
          for name in candidates[:30]:
              u='https://archive.org/download/'+item+'/'+urllib.parse.quote(name)
              st2,f2,ct2,b2=fetch(u)
              row={'name':name,'status':st2,'ctype':ct2,'bytes':len(b2),'final':f2,'prefix_hex':b2[:12].hex()}
              tests.append(row); print('FETCH',json.dumps(row,ensure_ascii=False))
              if st2==200 and len(b2)>1000:
                  safe=re.sub(r'[^A-Za-z0-9._-]+','_',name)
                  (out/safe).write_bytes(b2)
          rep['tests']=tests
          (out/'report.json').write_text(json.dumps(rep,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Analyze and render if public PDF exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p d067-ramirez1928/rendered
          PDF=$(find d067-ramirez1928 -maxdepth 1 -type f -name '*.pdf' -size +100k | head -1 || true)
          if [ -z "$PDF" ]; then echo 'NO_PUBLIC_PDF'; exit 0; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pdfinfo "$PDF" | head -30
          pdftotext -layout "$PDF" d067-ramirez1928/fulltext.txt
          grep -in -E 'maestro rural|enseñar|ensenar|método|metodo|indígen|indigen|idioma castellano|adultos|comunidad|higiene|trabajo' d067-ramirez1928/fulltext.txt | head -100 || true
          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          # Render all pages: small 59-page public-domain candidate, ephemeral one-day artifact.
          pdftoppm -jpeg -r 120 "$PDF" d067-ramirez1928/rendered/page >/dev/null 2>&1
          echo "PAGES=$PAGES"

      - name: Upload one-day primary review
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d067-ramirez1928-primary-review
          path: |
            d067-ramirez1928/report.json
            d067-ramirez1928/fulltext.txt
            d067-ramirez1928/rendered/
          retention-days: 1
          if-no-files-found: warn
