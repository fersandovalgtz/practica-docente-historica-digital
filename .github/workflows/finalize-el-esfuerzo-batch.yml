name: Repair El esfuerzo educativo analytical batch

on:
  push:
    branches: [retrieve-el-esfuerzo-analytical-slots]
    paths:
      - ".github/workflows/finalize-el-esfuerzo-batch.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: retrieve-el-esfuerzo-analytical-slots
          fetch-depth: 0

      - name: Restore canonical CSV formatting and retain only three promotions
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:data/samples/fragment_locator_progress_0_1.csv > /tmp/locator-main.csv
          python - <<'PY'
          from pathlib import Path

          src = Path('/tmp/locator-main.csv').read_text(encoding='utf-8').splitlines()
          replacements = {
              'PDHD-F000057,': 'PDHD-F000057,PDHD-D000066,A,125,p125-cursos-rapidos-practicas-ensenanza,https://books.google.com/books?id=O2oLAQAAIAAJ&pg=PA125,fixed,metadata_only,frozen,"Direct Google Books primary-PDF inspection maps printed p. 125 to physical PDF page 211. The fixed span is subsection 3º on Cursos Rápidos de Orientación Vocacional through the paragraph prescribing supervised initiation into teaching practice; it stops before the implementation-status paragraph. No historical text or source image is committed.",2026-09-06',
              'PDHD-F000058,': 'PDHD-F000058,PDHD-D000066,B,18,p18-inspector-visit-supervision-record,https://books.google.com/books?id=O2oLAQAAIAAJ&pg=PA18,fixed,metadata_only,frozen,"Direct Google Books primary-PDF inspection maps printed p. 18 to physical PDF page 104. The fixed span is the inspector-visit result sentence block documenting supervisory classes, talks, assemblies, locally acquired material and improvements; it excludes adjacent attendance statistics. No historical text or source image is committed.",2026-09-06',
              'PDHD-F000059,': 'PDHD-F000059,PDHD-D000066,C,104,p104-indigenous-school-statistical-table,https://books.google.com/books?id=O2oLAQAAIAAJ&pg=PA104,fixed,metadata_only,frozen,"Direct Google Books primary-PDF inspection maps printed p. 104 to physical PDF page 190. The fixed source-critical span is complete Tabla núm. 5, including its descriptive heading, state rows, totals and departmental signature, while excluding blank margins and digitization watermark. No table transcription or source image is committed.",2026-09-06',
          }
          seen = set()
          out = []
          for line in src:
              replaced = False
              for prefix, value in replacements.items():
                  if line.startswith(prefix):
                      out.append(value)
                      seen.add(prefix)
                      replaced = True
                      break
              if not replaced:
                  out.append(line)
          if seen != set(replacements):
              raise SystemExit(f'Failed to replace canonical rows: {set(replacements) - seen}')
          Path('data/samples/fragment_locator_progress_0_1.csv').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Repair narrative count and validate source of truth
        shell: python
        run: |
          from pathlib import Path
          readme_path = Path('README.md')
          text = readme_path.read_text(encoding='utf-8')
          old = 'Los **30/96** congelados demuestran el pipeline a través de HNDM, BVMC e Internet Archive'
          new = 'Los **33/96** congelados demuestran el pipeline a través de HNDM, BVMC, Internet Archive y Google Books'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Narrative frozen-count marker not found')
          readme_path.write_text(text, encoding='utf-8')

      - name: Run validators
        shell: bash
        run: |
          python scripts/validate_fragment_shards.py
          python scripts/validate_status_counts.py

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PDHD source verification"
          git config user.email "actions@users.noreply.github.com"
          git add data/samples/fragment_locator_progress_0_1.csv README.md
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "Normalize El esfuerzo batch diff"
          git push origin HEAD:retrieve-el-esfuerzo-analytical-slots
