name: Freeze El Maestro T2N3 source-criticism fragment

on:
  push:
    branches:
      - freeze-el-maestro-t2n3-source-criticism
    paths:
      - ".github/workflows/freeze-el-maestro-t2n3-source-criticism.yml"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-el-maestro-t2n3-source-criticism

      - name: Record primary inspection and freeze F000051
        shell: python
        run: |
          import csv
          from pathlib import Path

          root = Path('.')
          samples = root / 'data' / 'samples'
          checked = '2026-09-06'

          def read_csv(path):
              with path.open(encoding='utf-8', newline='') as fh:
                  return list(csv.DictReader(fh)), None

          def write_csv(path, rows, fieldnames):
              with path.open('w', encoding='utf-8', newline='') as fh:
                  writer = csv.DictWriter(fh, fieldnames=fieldnames, lineterminator='\n')
                  writer.writeheader()
                  writer.writerows(rows)

          locator_path = samples / 'fragment_locator_progress_el_maestro_secondary_w7.csv'
          with locator_path.open(encoding='utf-8', newline='') as fh:
              reader = csv.DictReader(fh)
              locator_fields = reader.fieldnames
              locator_rows = list(reader)

          by_id = {row['fragment_id']: row for row in locator_rows}
          if {'PDHD-F000049', 'PDHD-F000051'} - set(by_id):
              raise SystemExit('Expected El Maestro T2N3 locator rows are missing')

          by_id['PDHD-F000049'].update({
              'page': '299-300',
              'source_locator': 'ia-bookreader-n310-n311-el-cardo',
              'locator_evidence_url': 'https://archive.org/download/n1n3elmaestrorev02mexi/page/n310',
              'boundary_status': 'primary_pages_inspected_slot_fit_pending',
              'public_text_status': 'metadata_only',
              'freeze_status': 'locator_candidate',
              'preparation_note': "Corrected Internet Archive recovery and direct primary-image inspection map El Cardo to printed pp. 299-300 at BookReader n310-n311. The pages resolve the historical item itself, but the visible school-reading text does not by itself provide the explicit pedagogical action or instructional prescription required for deterministic slot A. The locator is therefore strengthened without freezing; a stronger explicit-act passage elsewhere in the issue remains required.",
              'checked_at': checked,
          })

          by_id['PDHD-F000051'].update({
              'page': '294',
              'source_locator': 'ia-bookreader-n305-electoral-explanation-block',
              'locator_evidence_url': 'https://archive.org/download/n1n3elmaestrorev02mexi/page/n305',
              'boundary_status': 'fixed',
              'public_text_status': 'metadata_only',
              'freeze_status': 'frozen',
              'preparation_note': "Corrected Internet Archive recovery and direct inspection of printed p. 294 / BookReader n305 resolve a compact source-critical scene in Democracia Criolla. The fixed unit comprises the two consecutive paragraphs in which political intermediaries explain the electoral function to rural voters and the narration records their continued apprehension; it stops before the following quoted dialogue. This directly inspected primary span replaces the former secondary-only page pointer. No page image or historical transcription is committed.",
              'checked_at': checked,
          })
          write_csv(locator_path, locator_rows, locator_fields)

          frozen_path = samples / 'frozen_fragments_el_maestro_t2n3_w17.csv'
          with frozen_path.open(encoding='utf-8', newline='') as fh:
              reader = csv.DictReader(fh)
              frozen_fields = reader.fieldnames
              frozen_rows = list(reader)
          if any(row['fragment_id'] == 'PDHD-F000051' for row in frozen_rows):
              raise SystemExit('PDHD-F000051 already exists in frozen registry')
          frozen_rows.append({
              'fragment_id': 'PDHD-F000051',
              'document_id': 'PDHD-D000053',
              'slot': 'C',
              'page': '294',
              'source_locator': 'ia-bookreader-n305-electoral-explanation-block',
              'locator_evidence_url': 'https://archive.org/download/n1n3elmaestrorev02mexi/page/n305',
              'boundary_definition': 'BookReader leaf n305 / printed p. 294: the two consecutive narrative paragraphs beginning with the sentence in which political leaders explain the electoral function group by group and ending with the sentence recording continued rural apprehension; stop before the following quoted dialogue.',
              'transcription_status': 'not_transcribed',
              'access_basis': 'Internet_Archive_direct_primary_image_inspection',
              'public_text_status': 'metadata_only',
              'selection_role': 'source_criticism_salient',
              'freeze_status': 'frozen',
              'preparation_note': 'Direct primary-image inspection fixes a compact source-critical unit on political knowledge, authority and mediation inside Democracia Criolla. The span is structurally bounded before dialogue and is retained because the documentary scene is historically salient, not because a secondary interpretation is treated as evidence. Internet Archive remains review_required, so no source image or full transcription is committed.',
              'checked_at': checked,
          })
          write_csv(frozen_path, frozen_rows, frozen_fields)

          attempts_path = samples / 'retrieval_attempts.csv'
          with attempts_path.open(encoding='utf-8', newline='') as fh:
              reader = csv.DictReader(fh)
              attempt_fields = reader.fieldnames
              attempts = list(reader)
          if any(row['attempt_id'] == 'PDHD-RA000013' for row in attempts):
              raise SystemExit('PDHD-RA000013 already exists')
          attempts.append({
              'attempt_id': 'PDHD-RA000013',
              'document_id': 'PDHD-D000053',
              'fragment_ids': 'PDHD-F000049;PDHD-F000051',
              'source_id': 'INTERNET-ARCHIVE',
              'object_url': 'https://archive.org/details/n1n3elmaestrorev02mexi',
              'target': 'analytical_content_pages_293_300',
              'result_status': 'superseded_by_locator',
              'blocker': 'A corrected primary-image recovery retrieved BookReader n303-n312 without assigning printed pagination by inference. Direct inspection maps p. 294 to n305 and pp. 299-300 to n310-n311. F000051 now has a defensible fixed source-critical span; F000049 has a direct primary locator but remains unfrozen because El Cardo does not itself satisfy the explicit-pedagogical-act slot rule.',
              'next_route': 'continue_direct_issue_inspection_for_an_explicit_pedagogical_act_for_F000049',
              'checked_at': checked,
          })
          write_csv(attempts_path, attempts, attempt_fields)

          readme_path = root / 'README.md'
          text = readme_path.read_text(encoding='utf-8')
          replacements = {
              '| Fragmentos completamente congelados | **29 / 96** |': '| Fragmentos completamente congelados | **30 / 96** |',
              'su unión contiene **29/96** fragmentos.': 'su unión contiene **30/96** fragmentos.',
              '**54 localizadores todavía no congelados**': '**53 localizadores todavía no congelados**',
              'Los **29/96** congelados demuestran': 'Los **30/96** congelados demuestran',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected README marker not found: {old}')
              text = text.replace(old, new, 1)
          anchor = 'Los punteros secundarios permanecen como `locator_candidate` hasta cotejar directamente las páginas del objeto histórico.'
          addition = (
              anchor + '\n\n'
              '`PDHD-F000051` cruza ahora ese gate en *El Maestro*, tomo II, núm. 3. La recuperación corregida de Internet Archive permitió inspeccionar directamente la p. 294 (`n305`) de *Democracia Criolla* y fijar un bloque narrativo compacto sobre explicación de la función electoral, incomprensión rural y mediación política. En cambio, la inspección directa de *El Cardo* confirma `PDHD-F000049` en pp. 299–300 (`n310`–`n311`) pero no lo congela: el pasaje funciona como lectura escolar, aunque no contiene por sí mismo la acción o prescripción pedagógica explícita exigida por el slot A. Esta decisión negativa queda preservada como evidencia metodológica.'
          )
          if text.count(anchor) != 1:
              raise SystemExit('Expected exactly one El Maestro secondary-pointer README anchor')
          text = text.replace(anchor, addition, 1)
          readme_path.write_text(text, encoding='utf-8')

          cohort_path = root / 'docs' / 'PDHD_U1_COHORT_STATUS.md'
          cohort = cohort_path.read_text(encoding='utf-8')
          cohort_replacements = {
              '| Fully frozen fragments | **29 / 96** |': '| Fully frozen fragments | **30 / 96** |',
              'Twenty-nine units have crossed the stronger frozen-fragment gate.': 'Thirty units have crossed the stronger frozen-fragment gate.',
              'Twenty-nine are frozen.': 'Thirty are frozen.',
              'remaining **54** located rows': 'remaining **53** located rows',
              'The current 29 frozen units': 'The current 30 frozen units',
              'The project is now at **83/96 localized** and **29/96 frozen**.': 'The project is now at **83/96 localized** and **30/96 frozen**.',
              'post-sprint primary recovery has added seven more frozen units': 'post-sprint primary recovery has added eight more frozen units',
          }
          for old, new in cohort_replacements.items():
              if old not in cohort:
                  raise SystemExit(f'Expected cohort marker not found: {old}')
              cohort = cohort.replace(old, new, 1)
          cohort_anchor = 'These conversions preserve `reader_page_target != analytical_span`: the reader route supported retrieval, while the final boundary came only from visual inspection of the primary image.'
          cohort_addition = (
              cohort_anchor + '\n\n'
              'The corrected tomo II, núm. 3 recovery now adds `PDHD-F000051` from printed p. 294 / BookReader `n305` as a directly inspected source-critical span in *Democracia Criolla*. The same inspection maps *El Cardo* to pp. 299–300 / `n310`–`n311`, strengthening `PDHD-F000049` to a direct primary locator while deliberately leaving it unfrozen: the visible literary school-reading unit does not itself satisfy slot A’s explicit pedagogical-act requirement. This preserves a failed-fit decision rather than converting mere educational context into a positive pedagogical fragment.'
          )
          if cohort.count(cohort_anchor) != 1:
              raise SystemExit('Expected exactly one cohort Internet Archive anchor')
          cohort = cohort.replace(cohort_anchor, cohort_addition, 1)
          cohort_path.write_text(cohort, encoding='utf-8')

      - name: Validate repository state
        run: |
          python scripts/validate_fragment_shards.py
          python scripts/validate_retrieval_attempts.py
          python scripts/validate_status_counts.py
          python scripts/validate_repository.py

      - name: Commit evidence update and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/freeze-el-maestro-t2n3-source-criticism.yml
          git config user.name 'PDHD evidence sync'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md docs/PDHD_U1_COHORT_STATUS.md data/samples/fragment_locator_progress_el_maestro_secondary_w7.csv data/samples/frozen_fragments_el_maestro_t2n3_w17.csv data/samples/retrieval_attempts.csv .github/workflows/freeze-el-maestro-t2n3-source-criticism.yml
          git commit -m 'Freeze El Maestro T2N3 source-critical span'
          git push origin HEAD:freeze-el-maestro-t2n3-source-criticism
