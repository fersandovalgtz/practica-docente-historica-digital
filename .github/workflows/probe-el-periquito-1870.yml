name: Probe El Periquito 1870 UNAM structured identifiers

on:
  push:
    branches: [freeze-el-periquito-1870]
    paths:
      - ".github/workflows/probe-el-periquito-1870.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve UNAM-RI 921573 structured metadata
        shell: python
        run: |
          import html,json,pathlib,re,urllib.request,urllib.error
          out=pathlib.Path('probe-periquito-unam'); out.mkdir()
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9,en;q=0.7'}
          urls=[
            'https://repositorio.unam.mx/contenidos/ficha/el-periquito-921573',
            'https://repositorio.unam.mx/921573',
            'https://repositorio.unam.mx/contenidos/el-periquito-921573',
          ]
          responses=[]
          for i,url in enumerate(urls,1):
              item={'url':url}
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=90) as r: body=r.read(); final=r.geturl(); status=r.status
                  text=html.unescape(body.decode('utf-8',errors='replace'))
                  (out/f'unam-{i}.html').write_text(text,encoding='utf-8')
                  item.update(status=status,final_url=final,bytes=len(body),text=text)
              except urllib.error.HTTPError as exc:
                  item.update(status=exc.code,error='HTTPError')
              except Exception as exc:
                  item['error']=repr(exc)
              responses.append(item)
          def vals(text,pattern): return list(dict.fromkeys(re.findall(pattern,text,re.I|re.S)))
          parsed=[]
          for r in responses:
              t=r.get('text','')
              if not t: parsed.append({k:v for k,v in r.items() if k!='text'}); continue
              p={k:v for k,v in r.items() if k!='text'}
              p.update({
                'title_hits':t.lower().count('el periquito'),
                'date_iso_hits':vals(t,r'(1870-11-06(?:T[^"< ,}]*)?)'),
                'first_page_ids':vals(t,r'item_first_page_id.{0,250}?([0-9a-f]{24})'),
                'publication_ids':vals(t,r'item_publication_id.{0,250}?([0-9a-f]{24})'),
                'item_pages':vals(t,r'item_pages.{0,150}?([0-9]{1,4})'),
                'hndm_urls':vals(t,r'(https?://[^"\' <]*hndm[^"\' <]*)')[:40],
                'all_24hex':vals(t,r'(?<![0-9a-f])([0-9a-f]{24})(?![0-9a-f])')[:100],
              })
              contexts=[]
              for token in ['item_first_page_id','item_publication_id','item_pages','item_date','1870-11-06','El Periquito','Texto completo','856.4.0.u','Hemeroteca Nacional Digital']:
                  for m in list(re.finditer(re.escape(token),t,re.I))[:10]:
                      contexts.append({'token':token,'context':re.sub(r'\s+',' ',t[max(0,m.start()-500):m.end()+1100])})
              p['contexts']=contexts
              parsed.append(p)
          report={'responses':parsed}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          strong=[p for p in parsed if p.get('title_hits',0)>0 and p.get('date_iso_hits') and p.get('first_page_ids')]
          if not strong:
              raise SystemExit('UNAM structured identity gate not yet resolved: no response exposes title + 1870-11-06 + item_first_page_id')
          print('STRONG_HIT',json.dumps(strong[0],ensure_ascii=False))
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-el-periquito-1870-unam-probe
          path: probe-periquito-unam/
          retention-days: 1
