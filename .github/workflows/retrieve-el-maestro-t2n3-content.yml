name: Retrieve El Maestro T2N3 content pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrieve-el-maestro-t2n3-content.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve visually calibrated candidate window
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request

          item = "n1n3elmaestrorev02mexi"
          # The first recovery proved that scandata leafNum cannot be converted
          # to /page/n with one global leaf offset after the December opening:
          # non-content leaves are counted differently. Direct primary-image
          # inspection established three consistent logical-page anchors:
          # printed 227 -> n238, printed 303 -> n314, printed 309 -> n320.
          # Rather than labeling targets by inference, retrieve the candidate
          # window n303-n312 and determine printed pp. 293-300 visually.
          candidates_n = list(range(303, 313))
          out = pathlib.Path("el-maestro-t2n3-content")
          out.mkdir()

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "PDHD-U1-source-verification/0.1 (+https://github.com/fersandovalgtz/practica-docente-historica-digital)"},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.geturl(), response.headers.get("Content-Type", ""), response.read()

          calibration = {
              "item": item,
              "reason": "global scandata leaf offset invalidated by direct page inspection",
              "direct_visual_anchors": [
                  {"printed_page": 227, "bookreader_n": 238},
                  {"printed_page": 303, "bookreader_n": 314},
                  {"printed_page": 309, "bookreader_n": 320},
              ],
              "candidate_window": candidates_n,
              "target_printed_pages": list(range(293, 301)),
              "decision_rule": "assign printed-page identity only after visual inspection of the retrieved primary image",
          }
          report = []

          for n in candidates_n:
              urls = [
                  f"https://archive.org/download/{item}/page/n{n}",
                  f"https://api.archivelab.org/books/{item}/pages/{n}",
                  f"https://archive.org/download/{item}/page/n{n}.jpg",
              ]
              saved = False
              for url in urls:
                  try:
                      final_url, content_type, body = fetch(url)
                      row = {
                          "bookreader_n": n,
                          "requested_url": url,
                          "final_url": final_url,
                          "content_type": content_type,
                          "bytes": len(body),
                          "magic": body[:16].hex(),
                      }
                      is_jpeg = body.startswith(b"\xff\xd8\xff")
                      is_png = body.startswith(b"\x89PNG\r\n\x1a\n")
                      is_jp2 = body[4:12] == b"jP  \r\n\x87\n" or body.startswith(b"\x00\x00\x00\x0cjP  \r\n\x87\n")
                      if is_jpeg or "image/jpeg" in content_type:
                          path = out / f"candidate_n{n}.jpg"
                          path.write_bytes(body)
                          row["saved_as"] = path.name
                          saved = True
                      elif is_png or "image/png" in content_type:
                          path = out / f"candidate_n{n}.png"
                          path.write_bytes(body)
                          row["saved_as"] = path.name
                          saved = True
                      elif is_jp2 or "image/jp2" in content_type:
                          path = out / f"candidate_n{n}.jp2"
                          path.write_bytes(body)
                          row["saved_as"] = path.name
                          saved = True
                      else:
                          row["saved_as"] = None
                      report.append(row)
                      if saved:
                          break
                  except Exception as exc:
                      report.append({"bookreader_n": n, "requested_url": url, "error": repr(exc)})
              if not saved:
                  raise SystemExit(f"No primary image saved for candidate n{n}")

          (out / "calibration.json").write_text(json.dumps(calibration, indent=2, ensure_ascii=False), encoding="utf-8")
          (out / "retrieval_report.json").write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(calibration, indent=2, ensure_ascii=False))

      - name: Upload one-day primary-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-el-maestro-t2n3-content-review-v2
          path: el-maestro-t2n3-content/
          if-no-files-found: error
          retention-days: 1
