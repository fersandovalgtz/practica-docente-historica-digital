name: Retrieve El Maestro T2N3 content pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrieve-el-maestro-t2n3-content.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Map printed pages through scandata and retrieve primary images
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request
          import xml.etree.ElementTree as ET

          item = "n1n3elmaestrorev02mexi"
          targets = list(range(293, 301))
          out = pathlib.Path("el-maestro-t2n3-content")
          out.mkdir()

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "PDHD-U1-source-verification/0.1 (+https://github.com/fersandovalgtz/practica-docente-historica-digital)"},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.geturl(), response.headers.get("Content-Type", ""), response.read()

          scandata_url = f"https://archive.org/download/{item}/{item}_scandata.xml"
          _, _, scandata_body = fetch(scandata_url)
          (out / "scandata.xml").write_bytes(scandata_body)
          root = ET.fromstring(scandata_body)

          printed_to_leaf = {}
          for page in root.findall('.//page'):
              leaf = page.attrib.get('leafNum')
              page_number = page.findtext('./pageData/pageNumber') or page.findtext('./pageNumber')
              if leaf is None or page_number is None:
                  continue
              label = page_number.strip()
              if label.isdigit():
                  printed_to_leaf[int(label)] = int(leaf)

          if 227 not in printed_to_leaf:
              raise SystemExit('scandata does not expose printed p. 227; cannot calibrate BookReader mapping')

          # Primary visual work already established printed p. 227 at BookReader n238.
          anchor_leaf = printed_to_leaf[227]
          offset = 238 - anchor_leaf

          mapping = {
              "item": item,
              "anchor": {"printed_page": 227, "scandata_leaf": anchor_leaf, "bookreader_n": 238},
              "offset": offset,
              "targets": [],
          }
          report = []

          for printed in targets:
              if printed not in printed_to_leaf:
                  mapping["targets"].append({"printed_page": printed, "error": "missing_from_scandata"})
                  continue
              leaf = printed_to_leaf[printed]
              n = leaf + offset
              row = {"printed_page": printed, "scandata_leaf": leaf, "bookreader_n": n}
              mapping["targets"].append(row)

              candidates = [
                  f"https://archive.org/download/{item}/page/n{n}",
                  f"https://api.archivelab.org/books/{item}/pages/{n}",
                  f"https://archive.org/download/{item}/page/n{n}.jpg",
              ]
              saved = False
              for url in candidates:
                  try:
                      final_url, content_type, body = fetch(url)
                      attempt = {
                          **row,
                          "requested_url": url,
                          "final_url": final_url,
                          "content_type": content_type,
                          "bytes": len(body),
                          "magic": body[:16].hex(),
                      }
                      is_jpeg = body.startswith(b"\xff\xd8\xff")
                      is_png = body.startswith(b"\x89PNG\r\n\x1a\n")
                      is_jp2 = body[4:12] == b"jP  \r\n\x87\n" or body.startswith(b"\x00\x00\x00\x0cjP  \r\n\x87\n")
                      if is_jpeg or "image/jpeg" in content_type:
                          path = out / f"printed_{printed}_n{n}.jpg"
                          path.write_bytes(body)
                          attempt["saved_as"] = path.name
                          saved = True
                      elif is_png or "image/png" in content_type:
                          path = out / f"printed_{printed}_n{n}.png"
                          path.write_bytes(body)
                          attempt["saved_as"] = path.name
                          saved = True
                      elif is_jp2 or "image/jp2" in content_type:
                          path = out / f"printed_{printed}_n{n}.jp2"
                          path.write_bytes(body)
                          attempt["saved_as"] = path.name
                          saved = True
                      else:
                          attempt["saved_as"] = None
                      report.append(attempt)
                      if saved:
                          break
                  except Exception as exc:
                      report.append({**row, "requested_url": url, "error": repr(exc)})
              if not saved:
                  print(f"WARNING: no primary image saved for printed p. {printed} / n{n}")

          (out / "mapping.json").write_text(json.dumps(mapping, indent=2, ensure_ascii=False), encoding="utf-8")
          (out / "retrieval_report.json").write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(mapping, indent=2, ensure_ascii=False))

          saved_pages = {r.get("printed_page") for r in report if r.get("saved_as")}
          missing = [p for p in targets if p not in saved_pages]
          if missing:
              raise SystemExit(f"Missing primary images for printed pages: {missing}")

      - name: Upload one-day primary-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-el-maestro-t2n3-content-review
          path: el-maestro-t2n3-content/
          if-no-files-found: error
          retention-days: 1
