name: Retrieve PDHD P2 primary pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrieve-p2-primary-pages.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve exact Internet Archive leaves
        shell: python
        run: |
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          item = "n1n3elmaestrorev02mexi"
          # scandata/page-number reconciliation places the December 1921 issue
          # opening in BookReader leaves n232-n238. The earlier n272-n277
          # mapping corresponded to later printed pages and is intentionally
          # superseded here.
          pages = [232, 233, 234, 235, 236, 237, 238]
          out = pathlib.Path("p2-primary-pages")
          out.mkdir()
          report = []

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "PDHD-U1-source-verification/0.1 (+https://github.com/fersandovalgtz/practica-docente-historica-digital)"},
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  body = response.read()
                  return response.geturl(), response.headers.get("Content-Type", ""), body

          for page in pages:
              candidates = [
                  f"https://archive.org/download/{item}/page/n{page}",
                  f"https://api.archivelab.org/books/{item}/pages/{page}",
                  f"https://archive.org/download/{item}/page/n{page}.jpg",
              ]
              saved = False
              for url in candidates:
                  try:
                      final_url, content_type, body = fetch(url)
                      row = {
                          "page": page,
                          "requested_url": url,
                          "final_url": final_url,
                          "content_type": content_type,
                          "bytes": len(body),
                          "magic": body[:16].hex(),
                      }
                      is_jpeg = body.startswith(b"\xff\xd8\xff")
                      is_png = body.startswith(b"\x89PNG\r\n\x1a\n")
                      is_jp2 = body[4:12] == b"jP  \r\n\x87\n" or body.startswith(b"\x00\x00\x00\x0cjP  \r\n\x87\n")
                      if is_jpeg or "image/jpeg" in content_type:
                          path = out / f"ia_{item}_n{page}.jpg"
                          path.write_bytes(body)
                          row["saved_as"] = path.name
                          saved = True
                      elif is_png or "image/png" in content_type:
                          path = out / f"ia_{item}_n{page}.png"
                          path.write_bytes(body)
                          row["saved_as"] = path.name
                          saved = True
                      elif is_jp2 or "image/jp2" in content_type:
                          path = out / f"ia_{item}_n{page}.jp2"
                          path.write_bytes(body)
                          row["saved_as"] = path.name
                          saved = True
                      else:
                          row["saved_as"] = None
                      report.append(row)
                      if saved:
                          break
                  except Exception as exc:
                      report.append({"page": page, "requested_url": url, "error": repr(exc)})
              if not saved:
                  print(f"WARNING: no image saved for page {page}")

          queries = [
              '"MEXICO, DICIEMBRE DE 1921"',
              '"GANTE 3"',
              '"LA INCONSCIENCIA DE LA HORA"',
          ]
          inside = {}
          for query in queries:
              params = urllib.parse.urlencode({
                  "item_id": item,
                  "doc": item,
                  "path": f"/10/items/{item}",
                  "q": query,
                  "pre_tag": "{{{",
                  "post_tag": "}}}",
              })
              url = f"https://ia600103.us.archive.org/fulltext/inside.php?{params}"
              try:
                  _, _, body = fetch(url)
                  inside[query] = json.loads(body.decode("utf-8"))
              except Exception as exc:
                  inside[query] = {"error": repr(exc), "url": url}

          (out / "retrieval_report.json").write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          (out / "search_inside_evidence.json").write_text(json.dumps(inside, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(report, indent=2, ensure_ascii=False))

      - name: Upload ephemeral source-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-p2-primary-page-review
          path: p2-primary-pages/
          if-no-files-found: error
          retention-days: 1
