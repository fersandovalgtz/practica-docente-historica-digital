name: Retrieve PDHD D067 HathiTrust full-view pages

on:
  push:
    branches:
      - "work/d067-hathitrust-freeze"
    paths:
      - ".github/workflows/retrieve-d067-hathitrust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve El papel social del maestro rural page images
        shell: python
        run: |
          import json
          import pathlib
          import urllib.error
          import urllib.request

          item_id = "txu.059173025410517"
          seqs = range(1, 13)
          out = pathlib.Path("d067-hathitrust-review")
          out.mkdir(exist_ok=True)
          report = []

          def candidates(seq):
              base = "https://babel.hathitrust.org/cgi/imgsrv/image?"
              return [
                  base + f"id={item_id};seq={seq};size=2200;rotation=0",
                  base + f"id={item_id}&seq={seq}&size=2200&rotation=0",
                  base + f"id={item_id};seq={seq};size=10000;rotation=0",
              ]

          headers = {
              "User-Agent": (
                  "PDHD-U1-source-verification/0.1 "
                  "(+https://github.com/fersandovalgtz/practica-docente-historica-digital)"
              ),
              "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
              "Referer": f"https://babel.hathitrust.org/cgi/pt?id={item_id}",
          }

          for seq in seqs:
              row = {"item_id": item_id, "seq": seq, "attempts": [], "saved": None}
              for attempt_no, url in enumerate(candidates(seq), start=1):
                  attempt = {"attempt": attempt_no, "url": url}
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=45) as response:
                          body = response.read()
                          ctype = response.headers.get("Content-Type", "")
                          status = response.status
                          final_url = response.geturl()
                      attempt.update({
                          "status": status,
                          "content_type": ctype,
                          "bytes": len(body),
                          "final_url": final_url,
                      })
                      if status == 200 and ctype.startswith("image/") and len(body) > 10000:
                          suffix = ".jpg" if "jpeg" in ctype else ".img"
                          path = out / f"d067_{item_id.replace('.', '_')}_seq{seq:03d}{suffix}"
                          path.write_bytes(body)
                          row["saved"] = path.name
                          row["attempts"].append(attempt)
                          break
                  except urllib.error.HTTPError as exc:
                      attempt.update({"error": "HTTPError", "status": exc.code, "reason": str(exc.reason)})
                  except urllib.error.URLError as exc:
                      attempt.update({"error": "URLError", "reason": str(exc.reason)})
                  except Exception as exc:
                      attempt.update({"error": type(exc).__name__, "reason": str(exc)})
                  row["attempts"].append(attempt)
              report.append(row)
              print(json.dumps(row, ensure_ascii=False))

          report_path = out / "retrieval-report.json"
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          saved = [row for row in report if row.get("saved")]
          print(f"Saved {len(saved)} HathiTrust page images for {item_id}; diagnostic report: {report_path}")

      - name: Upload one-day D067 primary-review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d067-hathitrust-review
          path: d067-hathitrust-review/
          retention-days: 1
          if-no-files-found: error

      - name: Require at least one auditable primary image
        shell: python
        run: |
          import json
          import pathlib

          report = json.loads(pathlib.Path("d067-hathitrust-review/retrieval-report.json").read_text(encoding="utf-8"))
          saved = [row for row in report if row.get("saved")]
          if not saved:
              raise SystemExit("No auditable HathiTrust page image was recovered; see uploaded diagnostic report")
          print(f"Auditable recovery succeeded for {len(saved)} page images")
