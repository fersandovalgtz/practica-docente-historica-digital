name: Retrieve PDHD D067 HathiTrust full-view pages

on:
  push:
    branches:
      - "work/d067-hathitrust-freeze"
    paths:
      - ".github/workflows/retrieve-d067-hathitrust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve El papel social del maestro rural page images
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request

          item_id = "txu.059173025410517"
          seqs = range(1, 13)
          out = pathlib.Path("d067-hathitrust-review")
          out.mkdir()
          report = []

          for seq in seqs:
              url = (
                  "https://babel.hathitrust.org/cgi/imgsrv/image?"
                  f"id={item_id};seq={seq};size=2200;rotation=0"
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "PDHD-U1-source-verification/0.1 "
                          "(+https://github.com/fersandovalgtz/practica-docente-historica-digital)"
                      )
                  },
              )
              row = {"item_id": item_id, "seq": seq, "url": url}
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      body = response.read()
                      ctype = response.headers.get("Content-Type", "")
                      status = response.status
                  row.update({"status": status, "content_type": ctype, "bytes": len(body)})
                  if status == 200 and ctype.startswith("image/") and len(body) > 10000:
                      suffix = ".jpg" if "jpeg" in ctype else ".img"
                      path = out / f"d067_{item_id.replace('.', '_')}_seq{seq:03d}{suffix}"
                      path.write_bytes(body)
                      row["saved"] = path.name
                  else:
                      row["saved"] = None
              except Exception as exc:
                  row.update({"error": f"{type(exc).__name__}: {exc}", "saved": None})
              report.append(row)

          (out / "retrieval-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          saved = [row for row in report if row.get("saved")]
          print(f"Saved {len(saved)} HathiTrust page images for {item_id}")
          if not saved:
              raise SystemExit("No auditable HathiTrust page image was recovered")

      - name: Upload one-day D067 primary-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d067-hathitrust-review
          path: d067-hathitrust-review/
          retention-days: 1
          if-no-files-found: error
