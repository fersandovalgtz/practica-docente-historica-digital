name: Finalize El Maestro July 1921 analytical batch

on:
  push:
    branches: [freeze-el-maestro-july-1921-analytical]
    paths:
      - '.github/workflows/finalize-el-maestro-july-1921.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote F45-F47 from direct primary inspection
        shell: python
        run: |
          import csv, glob, re
          from collections import defaultdict
          from pathlib import Path

          ROOT=Path('.')
          S=ROOT/'data/samples'
          TODAY='2026-09-06'

          def read_csv(path):
              with open(path,encoding='utf-8-sig',newline='') as f:
                  return list(csv.DictReader(f))
          def write_csv(path, rows, fieldnames=None):
              if fieldnames is None:
                  fieldnames=list(rows[0].keys())
              with open(path,'w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fieldnames,lineterminator='\n')
                  w.writeheader(); w.writerows(rows)
          def union_ids(pattern):
              out=set()
              for p in sorted(glob.glob(str(S/pattern))):
                  out.update(r['fragment_id'].strip() for r in read_csv(p) if r.get('fragment_id','').strip())
              return out

          loc0=union_ids('fragment_locator_progress*.csv')
          fro0=union_ids('frozen_fragments*.csv')
          gaps0=read_csv(S/'fragment_gap_queue_0_1.csv')
          assert (len(loc0),len(fro0),len(gaps0))==(95,80,1), (len(loc0),len(fro0),len(gaps0))
          for fid in ['PDHD-F000045','PDHD-F000046','PDHD-F000047']:
              assert fid in loc0 and fid not in fro0

          updates={
            'PDHD-F000045':{
              'page':'352',
              'source_locator':'ia-n37-p352-mejores-maestros-guia-discipulos',
              'locator_evidence_url':'https://archive.org/download/elmaestrorevista146mexi/page/n37',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"Direct primary-image inspection rejects the earlier Montelongo pp. 363-365 pointer as too analytical for deterministic slot A despite confirming its placement in numero cuatro. A stronger non-overlapping unit appears in Abel Ayala, Mejores maestros, printed p. 352 / BookReader n37: numbered item 7 explicitly prescribes giving time and energy to guide pupils. This directly supports the controlled pedagogical act guide without weakening the slot rule. No source image or full historical transcription is committed.",
              'checked_at':TODAY,
            },
            'PDHD-F000046':{
              'page':'351',
              'source_locator':'ia-n36-p351-mejores-maestros-seleccion-magisterio',
              'locator_evidence_url':'https://archive.org/download/elmaestrorevista146mexi/page/n36',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"Direct inspection of the primary numero cuatro image fixes printed p. 351 / BookReader n36. Numbered item 3 states that teachers must be carefully selected and makes selection of the teaching profession a major function of government. The unit is bounded independently from item 2 above and item 4 below, providing a compact institutional/professional relation.",
              'checked_at':TODAY,
            },
            'PDHD-F000047':{
              'page':'341',
              'source_locator':'ia-n26-p341-historia-mexico-clase-independencia',
              'locator_evidence_url':'https://archive.org/download/elmaestrorevista146mexi/page/n26',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"Direct primary-image inspection fixes the opening of Rafael Ramos Pedrueza, Historia de Mexico, at printed p. 341 / BookReader n26. The first paragraph under section IX explicitly interprets independence through oppressed classes, privilege and conservative/liberal political categories. It is retained as source-critical evidence of the magazine's present-oriented historical framing, not as a factual adjudication of those claims.",
              'checked_at':TODAY,
            },
          }
          paths=[S/'fragment_locator_progress_threshold72_w9.csv',S/'fragment_locator_progress_el_maestro_secondary_w7.csv']
          seen=set()
          for path in paths:
              rows=read_csv(path); fields=list(rows[0].keys())
              for r in rows:
                  fid=r.get('fragment_id')
                  if fid in updates:
                      r.update(updates[fid]); seen.add(fid)
              write_csv(path,rows,fields)
          assert seen==set(updates), seen

          frozen_path=S/'frozen_fragments_el_maestro_july1921_w27.csv'
          assert not frozen_path.exists()
          frozen_fields=['fragment_id','document_id','slot','page','source_locator','locator_evidence_url','boundary_definition','transcription_status','access_basis','public_text_status','selection_role','freeze_status','preparation_note','checked_at']
          frozen_rows=[
            {
              'fragment_id':'PDHD-F000045','document_id':'PDHD-D000052','slot':'A','page':'352','source_locator':'ia-n37-p352-mejores-maestros-guia-discipulos','locator_evidence_url':'https://archive.org/download/elmaestrorevista146mexi/page/n37',
              'boundary_definition':'Exact 1921 volume 1 n4-6 container, BookReader leaf n37 / printed p. 352: in Abel Ayala, Mejores maestros, numbered item 7 only, beginning with the requirement that teachers be industrious and ending after the clause directing them to give time and energy to guide their pupils toward knowledge and through life; exclude items 6 and 8.',
              'transcription_status':'not_transcribed','access_basis':'Internet_Archive_direct_primary_image_inspection','public_text_status':'metadata_only','selection_role':'explicit_pedagogical_act','freeze_status':'frozen',
              'preparation_note':'The original secondary target, Dionisio Montelongo Jr., La ilustracion de las masas, is directly confirmed at pp. 363-365 / n48-n50 but is rejected for slot A because its educational rhetoric does not map as cleanly to the controlled pedagogical-act vocabulary. Item 7 on p. 352 provides an explicit guide action in a distinct fixed unit. The replacement is therefore evidence-strengthening rather than target drift by convenience.',
              'checked_at':TODAY,
            },
            {
              'fragment_id':'PDHD-F000046','document_id':'PDHD-D000052','slot':'B','page':'351','source_locator':'ia-n36-p351-mejores-maestros-seleccion-magisterio','locator_evidence_url':'https://archive.org/download/elmaestrorevista146mexi/page/n36',
              'boundary_definition':'Exact 1921 volume 1 n4-6 container, BookReader leaf n36 / printed p. 351: Abel Ayala, Mejores maestros, numbered item 3 only, from the opening reference to self-governing peoples/republics/democracies through the sentence making careful teacher selection one of the most important functions of government; exclude items 2 and 4.',
              'transcription_status':'not_transcribed','access_basis':'Internet_Archive_direct_primary_image_inspection','public_text_status':'metadata_only','selection_role':'institutional_relation','freeze_status':'frozen',
              'preparation_note':'The primary page confirms the secondary pp. 351-352 citation and supplies a smaller internally numbered unit. The selected item links professional selection, education and government authority without overlapping F000045 on the following printed page.',
              'checked_at':TODAY,
            },
            {
              'fragment_id':'PDHD-F000047','document_id':'PDHD-D000052','slot':'C','page':'341','source_locator':'ia-n26-p341-historia-mexico-clase-independencia','locator_evidence_url':'https://archive.org/download/elmaestrorevista146mexi/page/n26',
              'boundary_definition':'Exact 1921 volume 1 n4-6 container, BookReader leaf n26 / printed p. 341: first paragraph under Rafael Ramos Pedrueza, Historia de Mexico, section IX, beginning with the characterization of conservative elements around independence and ending with the sentence noting the brief regency and Iturbide becoming emperor; stop before the next paragraph on the Liberal Party.',
              'transcription_status':'not_transcribed','access_basis':'Internet_Archive_direct_primary_image_inspection','public_text_status':'metadata_only','selection_role':'source_criticism_salient','freeze_status':'frozen',
              'preparation_note':'Direct visual inspection confirms title, author, section and printed page. The fixed paragraph is source-critically salient because it frames independence through social classes, privilege and party categories. No facsimile or historical transcription is committed.',
              'checked_at':TODAY,
            },
          ]
          write_csv(frozen_path,frozen_rows,frozen_fields)

          alias_path=ROOT/'data/catalog/object_aliases.csv'
          aliases=read_csv(alias_path); af=list(aliases[0].keys())
          assert not any(r['alias_id']=='PDHD-A000009' for r in aliases)
          assert not any(r['document_id']=='PDHD-D000052' and r['alias_system']=='INTERNET-ARCHIVE' and r['alias_identifier']=='elmaestrorevista146mexi' for r in aliases)
          aliases.append({
            'alias_id':'PDHD-A000009','document_id':'PDHD-D000052','alias_system':'INTERNET-ARCHIVE','alias_identifier':'elmaestrorevista146mexi',
            'alias_url':'https://archive.org/details/elmaestrorevista146mexi','alias_role':'serial_container','verification_status':'directly_verified','evidence_url':'https://archive.org/metadata/elmaestrorevista146mexi','checked_at':TODAY,
            'note':'Internet Archive identifies this primary serial container as El Maestro; revista de cultura nacional, volume 1, n4-6, dated 1921. Direct inspection of n4 identifies numero IV; the primary images n26, n36, n37 and n48-n50 confirm printed pp. 341, 351, 352 and 363-365. This alias is object/container provenance; fragment page locators remain separate.'
          })
          write_csv(alias_path,aliases,af)

          ra_path=S/'retrieval_attempts.csv'
          ras=read_csv(ra_path); rf=list(ras[0].keys())
          assert not any(r['attempt_id']=='PDHD-RA000019' for r in ras)
          ras.append({
            'attempt_id':'PDHD-RA000019','document_id':'PDHD-D000052','fragment_ids':'PDHD-F000045;PDHD-F000046;PDHD-F000047','source_id':'INTERNET-ARCHIVE','object_url':'https://archive.org/details/elmaestrorevista146mexi','target':'analytical_slots_A_B_C','result_status':'superseded_by_locator',
            'blocker':'The container exposes volume 1 numbers 4-6 rather than a separate text-PDF derivative for number 4. A first retrieval incorrectly assumed an _text.pdf derivative and stopped before evidence review. The corrected route used the IA DjVu XML only to locate candidate leaves, then retrieved and visually inspected primary BookReader images. The primary issue index places Historia de Mexico at p. 341, Mejores maestros at p. 351 and La ilustracion de las masas at p. 363. Direct images map those to n26, n36 and n48 respectively; p. 352 is n37. The Montelongo target was verified but rejected for explicit-act fit, and a stronger non-overlapping guide prescription in Mejores maestros p. 352 was selected for F000045.',
            'next_route':'frozen_registry_alias_crosswalk_status_and_count_guard_sync_completed','checked_at':TODAY,
          })
          write_csv(ra_path,ras,rf)

          cross=ROOT/'docs/OBJECT_CROSSWALK_LOG.md'
          c=cross.read_text(encoding='utf-8')
          section='''\n\n## 2026-09-06 — El Maestro núm. 4, Internet Archive serial container\n\n`PDHD-D000052` is cross-walked to Internet Archive `elmaestrorevista146mexi`, a 1921 primary container identified as volume 1, numbers 4–6. The container relation is preserved explicitly: `serial_container != issue_page_locator`.\n\nThe object does not expose the same `_text.pdf` derivative used for the separate May 1921 issue. Its DjVu XML was therefore used only as a discovery index. Direct BookReader images then confirmed the number-four sequence: `n26` = printed p. 341 (*Historia de México*), `n36` = p. 351 (*Mejores maestros*), `n37` = p. 352 and `n48`–`n50` = pp. 363–365 (*La ilustración de las masas*). The existing `n4` cover control independently identifies número IV.\n\nThe earlier secondary slot-A target on pp. 363–365 is retained as a documented recovery lead but rejected for deterministic act fit after primary inspection. `PDHD-F000045` instead uses a directly visible, non-overlapping `guide` prescription on p. 352. `PDHD-F000046` fixes numbered item 3 on p. 351 and `PDHD-F000047` fixes the first analytical paragraph on p. 341. No source image or full historical transcription is committed.\n'''
          assert '## 2026-09-06 — El Maestro núm. 4, Internet Archive serial container' not in c
          cross.write_text(c.rstrip()+section+'\n',encoding='utf-8')

          readme=ROOT/'README.md'
          r=readme.read_text(encoding='utf-8')
          replacements={
            '| Fragmentos completamente congelados | **80 / 96** |':'| Fragmentos completamente congelados | **83 / 96** |',
            'su unión contiene **80/96** fragmentos.':'su unión contiene **83/96** fragmentos.',
            '**15 localizadores todavía no congelados**':'**12 localizadores todavía no congelados**',
            'Los **80/96** congelados demuestran el pipeline':'Los **83/96** congelados demuestran el pipeline',
          }
          for a,b in replacements.items():
              assert r.count(a)==1,(a,r.count(a)); r=r.replace(a,b,1)
          old_phase='La fase reciente ha reforzado especialmente la revista *El Maestro*. Además del lote congelado del primer número, el tomo II, núm. 3 ya aporta dos regiones congeladas y los números 2 y 4 de 1921 aportan controles de portada directamente inspeccionados. Entre los targets analíticos pendientes figuran José U. Escobar, *Las tribus indígenas mexicanas*; Abel Ayala, *Mejores maestros*; Rafael Ramos Pedrueza, *Historia de México*; Gabriela Mistral, *Lecturas escolares. El cardo*; Rufino Blanco-Fombona, *Democracia Criolla*; José Suirob, *Orientación obrera*; y el manifiesto *La internacional de los intelectuales* del Grupo Claridad. Los punteros secundarios permanecen como `locator_candidate` hasta cotejar directamente las páginas del objeto histórico.'
          new_phase='La fase reciente ha reforzado especialmente la revista *El Maestro*. El primer número y los números 2 y 4 de 1921 tienen ya lotes A–D completos; el tomo II, núm. 3 conserva `PDHD-F000049` como su único slot pendiente porque la lectura escolar *El Cardo* no satisface por sí misma el requisito de acto pedagógico explícito. Los restantes candidatos no congelados se concentran ahora en ese slot y en los bloques documentales `PDHD-D000067`, `PDHD-D000072` y `PDHD-D000074`, todos sujetos al mismo gate de inspección primaria.'
          assert r.count(old_phase)==1; r=r.replace(old_phase,new_phase,1)
          anchor='`PDHD-D000051`, *El Maestro. Revista de Cultura Nacional*, núm. 2 de mayo de 1921, completa ahora A–D. Internet Archive ofrece un objeto separado del número (`el-maestro.-revista-de-cultura-nacional-n-2-1921`) y un PDF primario de 118 páginas. La inspección visual fija `PDHD-F000041` en p. 147 como acto pedagógico explícito dentro de *Orientación obrera*; `PDHD-F000042` en p. 135 como bloque de organización, subordinación y federación del Grupo Claridad; y `PDHD-F000043` en p. 173 como unidad de crítica de fuentes sobre la representación y organización de las llamadas Tribus Indígenas Mexicanas. Una comparación independiente entre el PDF y hojas vecinas de BookReader prueba los locators `n52`, `n40` y `n78`; `PDHD-F000044` conserva su control bibliográfico ya congelado. No se incorpora el facsímil ni su transcripción.'
          insert=anchor+'\n\n`PDHD-D000052`, *El Maestro. Revista de Cultura Nacional*, núm. 4 de julio de 1921, completa también A–D desde Internet Archive `elmaestrorevista146mexi`. La inspección directa fija `PDHD-F000045` en p. 352 / `n37` como prescripción explícita de guiar a los discípulos; `PDHD-F000046` en p. 351 / `n36` como unidad sobre selección del magisterio y función gubernamental; y `PDHD-F000047` en p. 341 / `n26` como fragmento de crítica de fuentes de *Historia de México*. El puntero secundario original de F000045 hacia *La ilustración de las masas* (pp. 363–365 / `n48`–`n50`) fue confirmado pero rechazado para slot A por ajuste insuficiente al vocabulario controlado de actos. F000048 conserva el control de portada `n4`. No se incorpora facsímil ni transcripción.'
          assert r.count(anchor)==1; r=r.replace(anchor,insert,1)
          readme.write_text(r,encoding='utf-8')

          cohort=ROOT/'docs/PDHD_U1_COHORT_STATUS.md'
          t=cohort.read_text(encoding='utf-8')
          crepl={
            '| Fully frozen fragments | **80 / 96** |':'| Fully frozen fragments | **83 / 96** |',
            'Eighty units have crossed the stronger frozen-fragment gate.':'**83 units** have crossed the stronger frozen-fragment gate.',
            'Nineteen selected documents now have complete four-slot batches.':'**20 selected documents** now have complete four-slot batches.',
            'Eighty are frozen. The remaining **15** located rows':'Eighty-three are frozen. The remaining **12** located rows',
            'project is now at **95/96 localized** and **73/96 frozen**.':'project is now at **95/96 localized** and **83/96 frozen**.',
            'preserving the unlocalized complement at 4.':'preserving the unlocalized complement at 1.',
          }
          for a,b in crepl.items():
              assert t.count(a)==1,(a,t.count(a)); t=t.replace(a,b,1)
          canchor='`PDHD-D000051`, *El Maestro. Revista de Cultura Nacional*, núm. 2 (mayo de 1921), now contributes a complete A–D batch. The separate Internet Archive issue object exposes a 118-page primary PDF. Visual review maps printed p. 147 to PDF p. 53 for F000041, p. 135 to PDF p. 41 for F000042 and p. 173 to PDF p. 79 for F000043. Four independent PDF-to-BookReader image comparisons prove the zero-based leaf mapping across the issue, yielding `n52`, `n40` and `n78` for the selected spans. F000044 remains the previously frozen bibliographic control. The batch preserves the difference between explicit pedagogical action, institutional/network organization and source-critical representation.'
          cinsert=canchor+'\n\n`PDHD-D000052`, *El Maestro. Revista de Cultura Nacional*, núm. 4 (julio de 1921), now contributes a complete A–D batch from Internet Archive container `elmaestrorevista146mexi`. Direct images identify printed p. 341 at `n26`, p. 351 at `n36`, p. 352 at `n37`, and pp. 363–365 at `n48`–`n50`; the already frozen control remains `n4`. F000045 deliberately replaces its verified-but-weak Montelongo target with numbered item 7 of *Mejores maestros* on p. 352, where a controlled `guide` act is explicit. F000046 fixes item 3 on p. 351 as an institutional relation around teacher selection, and F000047 fixes the first p. 341 paragraph of *Historia de México* as source-critical ideological framing.'
          assert t.count(canchor)==1; t=t.replace(canchor,cinsert,1)
          cohort.write_text(t,encoding='utf-8')

          validator=ROOT/'scripts/validate_status_counts.py'
          v=validator.read_text(encoding='utf-8')
          old_sig='def validate_cohort_status(text: str, located: int, frozen: int, gaps: int) -> None:\n    not_frozen = located - frozen\n'
          new_sig='def validate_cohort_status(text: str, located: int, frozen: int, gaps: int, complete_batches: int) -> None:\n    not_frozen = located - frozen\n'
          assert v.count(old_sig)==1; v=v.replace(old_sig,new_sig,1)
          insertion='''    expect(\n        extract_one(\n            text,\n            r"project is now at \\*\\*\\d+/96 localized\\*\\* and \\*\\*(\\d+)/96 frozen\\*\\*",\n            "cohort decision frozen prose",\n        ),\n        frozen,\n        "cohort decision frozen prose",\n    )\n    expect(\n        extract_one(\n            text,\n            r"preserving the unlocalized complement at (\\d+)\\.",\n            "cohort decision gap prose",\n        ),\n        gaps,\n        "cohort decision gap prose",\n    )\n    expect(\n        extract_one(\n            text,\n            r"\\*\\*(\\d+) selected documents\\*\\* now have complete four-slot batches\\.",\n            "cohort complete-batch prose",\n        ),\n        complete_batches,\n        "cohort complete-batch prose",\n    )\n'''
          hook='''    expect(\n        extract_one(\n            text,\n            r"project is now at \\*\\*(\\d+)/96 localized\\*\\*",\n            "cohort decision prose",\n        ),\n        located,\n        "cohort decision prose",\n    )\n'''
          assert v.count(hook)==1; v=v.replace(hook,hook+insertion,1)
          old_main='''    locators = union_ids("fragment_locator_progress*.csv")\n    frozen = union_ids("frozen_fragments*.csv")\n    gaps = read_csv(SAMPLES / "fragment_gap_queue_0_1.csv")\n\n    located_count = len(locators)\n    frozen_count = len(frozen)\n    gap_count = len(gaps)\n'''
          new_main='''    locators = union_ids("fragment_locator_progress*.csv")\n    frozen = union_ids("frozen_fragments*.csv")\n    gaps = read_csv(SAMPLES / "fragment_gap_queue_0_1.csv")\n\n    frozen_slots: dict[str, set[str]] = {}\n    for path in sorted(SAMPLES.glob("frozen_fragments*.csv")):\n        for row in read_csv(path):\n            frozen_slots.setdefault(row.get("document_id", "").strip(), set()).add(row.get("slot", "").strip())\n    complete_batches = sum(slots == {"A", "B", "C", "D"} for slots in frozen_slots.values())\n\n    located_count = len(locators)\n    frozen_count = len(frozen)\n    gap_count = len(gaps)\n'''
          assert v.count(old_main)==1; v=v.replace(old_main,new_main,1)
          old_call='validate_cohort_status(cohort, located_count, frozen_count, gap_count)'
          new_call='validate_cohort_status(cohort, located_count, frozen_count, gap_count, complete_batches)'
          assert v.count(old_call)==1; v=v.replace(old_call,new_call,1)
          validator.write_text(v,encoding='utf-8')

          loc1=union_ids('fragment_locator_progress*.csv')
          fro1=union_ids('frozen_fragments*.csv')
          gaps1=read_csv(S/'fragment_gap_queue_0_1.csv')
          assert (len(loc1),len(fro1),len(gaps1))==(95,83,1),(len(loc1),len(fro1),len(gaps1))
          assert {'PDHD-F000045','PDHD-F000046','PDHD-F000047'} <= fro1
          print('SCIENTIFIC_STATE',len(loc1),len(fro1),len(loc1-fro1),len(gaps1))
      - name: Validate complete PDHD suite
        run: |
          python scripts/validate_repository.py
          python scripts/validate_object_aliases.py
          python scripts/validate_content_leads.py
          python scripts/validate_retrieval_attempts.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_freeze_conversion_queue.py
          python scripts/prepare_freeze_review.py --check
          python scripts/validate_status_counts.py
          python scripts/annotation_agreement.py --self-test
          python scripts/build_fragment_manifest.py --check
      - name: Gate exact persistent diff and commit scientific batch
        run: |
          allowed='README.md data/catalog/object_aliases.csv data/samples/fragment_locator_progress_el_maestro_secondary_w7.csv data/samples/fragment_locator_progress_threshold72_w9.csv data/samples/frozen_fragments_el_maestro_july1921_w27.csv data/samples/retrieval_attempts.csv docs/OBJECT_CROSSWALK_LOG.md docs/PDHD_U1_COHORT_STATUS.md scripts/validate_status_counts.py'
          actual=$( (git diff --name-only; git ls-files --others --exclude-standard) | grep -v '^.github/workflows/' | sort -u | tr '\n' ' ' | sed 's/ $//')
          expected=$(printf '%s\n' $allowed | sort | tr '\n' ' ' | sed 's/ $//')
          echo "ACTUAL=$actual"
          echo "EXPECTED=$expected"
          test "$actual" = "$expected"
          git config user.name 'Fernando Sandoval'
          git config user.email 'fernando.sandoval@uacj.mx'
          git add README.md data/catalog/object_aliases.csv data/samples/fragment_locator_progress_el_maestro_secondary_w7.csv data/samples/fragment_locator_progress_threshold72_w9.csv data/samples/frozen_fragments_el_maestro_july1921_w27.csv data/samples/retrieval_attempts.csv docs/OBJECT_CROSSWALK_LOG.md docs/PDHD_U1_COHORT_STATUS.md scripts/validate_status_counts.py
          git commit -m 'Freeze El Maestro July 1921 analytical batch'
          git push origin HEAD:freeze-el-maestro-july-1921-analytical
