name: Retrieve PDHD La Enseñanza Normal p12

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrieve-ensenanza-normal-p12.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve exact BVMC inaugural-issue PDF
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request

          out = pathlib.Path("ensenanza-normal-p12-review")
          out.mkdir()
          url = "https://www.cervantesvirtual.com/descargaPdf/la-ensenanza-normal-publicacion-periodica-de-la-direccion-general-de-la-ensenanza-normal-en-el-distrito-federal-ano-i-num-1-15-de-septiembre-de-1904-1255054/"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                  "Accept": "application/pdf,*/*;q=0.8",
              },
          )
          report = {"url": url}
          try:
              with urllib.request.urlopen(req, timeout=90) as response:
                  body = response.read()
                  report["status"] = response.status
                  report["content_type"] = response.headers.get("Content-Type", "")
                  report["final_url"] = response.geturl()
              report["bytes"] = len(body)
              report["pdf_signature"] = body.startswith(b"%PDF")
              if not body.startswith(b"%PDF") or len(body) < 100000:
                  (out / "response.bin").write_bytes(body)
                  raise SystemExit("BVMC response was not a usable PDF")
              (out / "issue.pdf").write_bytes(body)
          except Exception as exc:
              report["error"] = f"{type(exc).__name__}: {exc}"
              (out / "retrieval-report.json").write_text(
                  json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              raise
          (out / "retrieval-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))

      - name: Render page window and extract retrieval text
        shell: bash
        run: |
          set -euo pipefail
          out="ensenanza-normal-p12-review"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfinfo "$out/issue.pdf" > "$out/pdfinfo.txt"
          pdftotext -layout "$out/issue.pdf" "$out/issue.txt" || true
          mkdir -p "$out/rendered"
          # Render a broad early-issue window so printed p.12 can be identified
          # visually rather than assuming PDF index == printed page number.
          pdftoppm -f 1 -l 20 -jpeg -r 180 "$out/issue.pdf" "$out/rendered/page"
          ls -lh "$out/rendered"
          grep -ni -E "Kiel|procedimientos|enseñanza|observa|experimenta|niños" "$out/issue.txt" | head -n 100 > "$out/retrieval-hits.txt" || true

      - name: Upload one-day primary-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-ensenanza-normal-p12-review
          path: ensenanza-normal-p12-review/
          retention-days: 1
          if-no-files-found: error
