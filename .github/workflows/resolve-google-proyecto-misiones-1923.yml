name: Resolve Google Books Proyecto Misiones 1923

on:
  push:
    branches: [freeze-proyecto-misiones-federales-1923]
    paths:
      - ".github/workflows/resolve-google-proyecto-misiones-1923.yml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve OCLC and title through Google Books web routes
        shell: python
        run: |
          import html,json,pathlib,re,urllib.parse,urllib.request,urllib.error
          out=pathlib.Path('google-proyecto-misiones-1923'); out.mkdir()
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'Accept-Language':'es-MX,es;q=0.9,en;q=0.8',
          }
          title='Proyecto para la organización de las misiones federales de educación'
          urls=[
            'https://books.google.com/books?vid=OCLC:16016036',
            'https://books.google.com/books?vid=OCLC16016036',
            'https://books.google.com/books?'+urllib.parse.urlencode({'q':'OCLC 16016036'}),
            'https://books.google.com/books?'+urllib.parse.urlencode({'q':'"'+title+'" "José Gálvez"'}),
            'https://books.google.com/books?'+urllib.parse.urlencode({'q':title}),
          ]
          report=[]; candidates=set()
          for i,url in enumerate(urls,1):
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                body=r.read(); final=r.geturl(); status=r.status; ctype=r.headers.get('Content-Type','')
              text=body.decode('utf-8',errors='replace'); decoded=html.unescape(text)
              (out/f'route-{i}.html').write_text(text,encoding='utf-8')
              ids=set(re.findall(r'[?&]id=([A-Za-z0-9_-]{6,24})',decoded))
              ids |= set(re.findall(r'/books/edition/[^/]+/([A-Za-z0-9_-]{6,24})',decoded))
              for x in ids: candidates.add(x)
              report.append({'route':url,'status':status,'final_url':final,'content_type':ctype,'bytes':len(body),'ids':sorted(ids)[:100]})
            except Exception as exc:
              report.append({'route':url,'error':repr(exc)})
          # Probe candidates for metadata/title/year and PDF exposure at likely p.24.
          probes=[]
          for bid in sorted(candidates):
            try:
              url=f'https://books.google.com/books?id={bid}&pg=PA24'
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: body=r.read(); final=r.geturl()
              text=body.decode('utf-8',errors='replace'); dec=html.unescape(text)
              title_hit='misiones federales' in dec.lower() or 'proyecto para la organizaci' in dec.lower()
              year_hit='1923' in dec
              pdfs=re.findall(r'https?://books\.google\.com/books/download/[^\"\s<>]+?\.pdf\?[^\"\s<>]+',dec)
              probes.append({'id':bid,'final_url':final,'bytes':len(body),'title_hit':title_hit,'year_hit':year_hit,'pdf_candidates':pdfs[:5]})
            except Exception as exc: probes.append({'id':bid,'error':repr(exc)})
          result={'routes':report,'candidate_ids':sorted(candidates),'probes':probes}
          (out/'report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))

      - name: Upload resolution artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-google-proyecto-misiones-1923
          path: google-proyecto-misiones-1923/
          retention-days: 1
