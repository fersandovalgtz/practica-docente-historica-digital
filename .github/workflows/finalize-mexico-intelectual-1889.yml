name: Finalize Mexico Intelectual 1889 frozen batch

on:
  push:
    branches: [freeze-mexico-intelectual-1889]
    paths:
      - ".github/workflows/finalize-mexico-intelectual-1889.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote F9-F12 from direct HNDM image inspection
        shell: python
        run: |
          import csv, pathlib, re
          root=pathlib.Path('.')
          samples=root/'data/samples'
          checked='2026-09-06'
          updates={
            'PDHD-F000009': {
              'page':'34',
              'source_locator':'p34-maestro-primaria-educar-comunicar-despertar-estudio-trabajo',
              'locator_evidence_url':'https://hndm.iib.unam.mx/consulta/publicacion/pdf/558a32cf7d1ed64f168b337c.pdf?coleccion=&palabras=',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"Direct HNDM primary-image inspection supersedes the earlier secondary p. 5 characterization. Printed p. 34, inside El Maestro de Escuela, contains a discrete paragraph defining the primary teacher's work through educating children, communicating practically useful knowledge and awakening attachment to study and work. Fix that complete paragraph only; stop before the following paragraph broadens to civilization and social classes. No source text or image is committed.",
              'selection_role':'explicit_pedagogical_act',
              'boundary_definition':"Printed p. 34, within El Maestro de Escuela: fix the complete paragraph beginning with the primary-school teacher at the head of childhood and ending with the linked actions of educating children, communicating useful knowledge and awakening love of study and work; stop before the next paragraph beginning the broader discussion of civilization and culture.",
            },
            'PDHD-F000010': {
              'page':'2',
              'source_locator':'p2-uniformidad-ensenanza-profesores-alumnos-relacion-institucional',
              'locator_evidence_url':'https://hndm.iib.unam.mx/consulta/publicacion/pdf/558a32cf7d1ed64f168b335c.pdf?coleccion=&palabras=',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"Direct inspection of printed p. 2 confirms a stronger institutional-relation unit than the earlier prospectus paraphrase: the paragraph contrasts broad national administrative uniformity with the lack of uniformity in official teaching and explicitly links that condition to difficulties for teaching in general and harms to professors and pupils. Boundary fixed from that paragraph opening through its final reference to professors and pupils; exclude the following paragraph beginning the state-by-state legislation discussion.",
              'selection_role':'institutional_relation',
              'boundary_definition':"Printed p. 2: fix the complete paragraph beginning with the observation that most branches of administration show national unity and ending with the stated harms to professors and pupils caused by the lack of comparable uniformity in official teaching; stop before the next paragraph on each state's instruction law.",
            },
            'PDHD-F000011': {
              'page':'27',
              'source_locator':'p27-normal-jalapa-alumnado-docentes-curriculum-profesional',
              'locator_evidence_url':'https://hndm.iib.unam.mx/consulta/publicacion/pdf/558a32cf7d1ed64f168b3375.pdf?coleccion=&palabras=',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"Direct HNDM inspection confirms La Escuela Normal de Jalapa begins on printed p. 26 and continues on p. 27. For a tighter source-critical unit, slot C is fixed on p. 27 from the paragraph reporting the Normal's current student body and attached practice school through the faculty-composition paragraph and the complete list of subjects taught in the first three professional courses. Exclude the expenditure figures above and the next article below. This captures how the journal quantifies and represents professional teacher formation without republishing the historical text.",
              'selection_role':'source_criticism_salient',
              'boundary_definition':"Printed p. 27, within La Escuela Normal de Jalapa: fix the contiguous block from the paragraph reporting current Normal students and the attached practice-school enrollment through the faculty-composition paragraph and the complete list of subjects in the first three professional courses; exclude the budget figures above and stop before the ornamental rule and the following article.",
            },
            'PDHD-F000012': {
              'page':'32',
              'source_locator':'p32-condiciones-periodicidad-precios-redaccion-administracion',
              'locator_evidence_url':'https://hndm.iib.unam.mx/consulta/publicacion/pdf/558a32cf7d1ed64f168b337a.pdf?coleccion=&palabras=',
              'boundary_status':'fixed','public_text_status':'metadata_only','freeze_status':'frozen',
              'preparation_note':"Direct primary inspection disconfirms the earlier secondary p. 6 prices/correspondence pointer: printed p. 6 contains substantive educational discourse, not the journal's administrative conditions. The actual low-pedagogical control is printed p. 32 under CONDICIONES, which states publication cadence, issue/subscription prices, advertising terms and the location/person responsible for redaction and administration. Fix that section through the administrator line and exclude the separate sales block below.",
              'selection_role':'control',
              'boundary_definition':"Printed p. 32: fix the CONDICIONES section from its heading through items 1-4 and the following redaction/administration location and administrator line; stop before the separate De Venta en esta Administración heading and sales listings.",
            },
          }
          shard_for={
            'PDHD-F000009':samples/'fragment_locator_progress_mexico_intelectual_w10.csv',
            'PDHD-F000012':samples/'fragment_locator_progress_mexico_intelectual_w10.csv',
            'PDHD-F000011':samples/'fragment_locator_progress_mexico_intelectual_w15.csv',
            'PDHD-F000010':samples/'fragment_locator_progress_crosswalk_w3.csv',
          }
          for path in sorted(set(shard_for.values())):
              with path.open(encoding='utf-8',newline='') as f:
                  rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
              touched=[]
              for row in rows:
                  fid=row['fragment_id']
                  if fid in updates:
                      for key in ['page','source_locator','locator_evidence_url','boundary_status','public_text_status','freeze_status','preparation_note']:
                          row[key]=updates[fid][key]
                      row['checked_at']=checked; touched.append(fid)
              expected=sorted(fid for fid,p in shard_for.items() if p==path)
              if sorted(touched)!=expected:
                  raise SystemExit(f'{path}: target mismatch touched={touched} expected={expected}')
              with path.open('w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          frozen_path=samples/'frozen_fragments_mexico_intelectual_w21.csv'
          ffields=['fragment_id','document_id','slot','page','source_locator','locator_evidence_url','boundary_definition','transcription_status','access_basis','public_text_status','selection_role','freeze_status','preparation_note','checked_at']
          frozen=[]
          for fid in ['PDHD-F000009','PDHD-F000010','PDHD-F000011','PDHD-F000012']:
              u=updates[fid]
              frozen.append({
                'fragment_id':fid,'document_id':'PDHD-D000063','slot':{'PDHD-F000009':'A','PDHD-F000010':'B','PDHD-F000011':'C','PDHD-F000012':'D'}[fid],
                'page':u['page'],'source_locator':u['source_locator'],'locator_evidence_url':u['locator_evidence_url'],
                'boundary_definition':u['boundary_definition'],'transcription_status':'not_transcribed','access_basis':'HNDM_public_interface_manual_inspection',
                'public_text_status':'metadata_only','selection_role':u['selection_role'],'freeze_status':'frozen','preparation_note':u['preparation_note'],'checked_at':checked,
              })
          with frozen_path.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=ffields,lineterminator='\n'); w.writeheader(); w.writerows(frozen)

          # Structured provenance, including the rejected intPagina false start.
          rapath=samples/'retrieval_attempts.csv'
          with rapath.open(encoding='utf-8',newline='') as f:
              ra=list(csv.DictReader(f)); rafields=list(ra[0].keys())
          if any(r['attempt_id']=='PDHD-RA000014' for r in ra):
              raise SystemExit('PDHD-RA000014 already exists')
          ra.append({
            'attempt_id':'PDHD-RA000014','document_id':'PDHD-D000063','fragment_ids':'PDHD-F000009;PDHD-F000010;PDHD-F000011;PDHD-F000012','source_id':'HNDM',
            'object_url':'https://hndm.iib.unam.mx/consulta/publicacion/visualizar/558075be7d1e63c9fea1a356?anio=1889&mes=01&dia=01&intPagina=1&tipo=publicacion',
            'target':'all_four_issue_slots','result_status':'superseded_by_locator',
            'blocker':"UNAM-RI 897145 cross-walked the selected 1889 object to HNDM serial 558075be7d1e63c9fea1a356. An initial retrieval attempt incorrectly assumed intPagina changed leaves and downloaded the same first-page PDF repeatedly; that artifact was rejected. A corrected workflow followed each explicit siguienteLink page identifier and recovered 45 unique HNDM primary-page PDFs. Direct visual inspection fixes F000009 on p. 34, confirms F000010 on p. 2, tightens F000011 to p. 27, and moves F000012 from the incorrect secondary p. 6 pointer to the actual administrative CONDICIONES block on p. 32.",
            'next_route':'frozen_registry_and_status_sync_completed','checked_at':checked,
          })
          with rapath.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rafields,lineterminator='\n'); w.writeheader(); w.writerows(ra)

          # Public status surfaces. Counts are source-of-truth consequences: 83 located, 61 frozen, 22 located-not-frozen, 13 gaps.
          readme=(root/'README.md').read_text(encoding='utf-8')
          readme=readme.replace('| Fragmentos completamente congelados | **57 / 96** |','| Fragmentos completamente congelados | **61 / 96** |')
          readme=re.sub(r'su unión contiene \*\*\d+/96\*\* fragmentos', 'su unión contiene **61/96** fragmentos', readme)
          readme=re.sub(r'\*\*\d+ localizadores todavía no congelados\*\*','**22 localizadores todavía no congelados**',readme)
          marker='Como HNDM permanece `metadata_only`'
          paragraph=("`PDHD-D000063`, *México intelectual* (1889), completa ahora A–D desde el objeto HNDM enlazado por UNAM-RI `897145`. La recuperación estableció que `intPagina` no selecciona por sí solo hojas distintas en el viewer: el primer intento repitió el mismo PDF y fue descartado. El recorrido corregido siguió los identificadores persistentes de `Página siguiente` y recuperó 45 páginas primarias únicas. La inspección fija `PDHD-F000009` en p. 34 como acto docente explícito; `PDHD-F000010` en p. 2 como relación institucional entre uniformidad educativa, profesores y alumnos; `PDHD-F000011` en p. 27 como unidad de crítica de fuentes sobre alumnado, planta y currículo de la Escuela Normal de Jalapa; y `PDHD-F000012` en p. 32 como control administrativo bajo `CONDICIONES`. Este último corrige el antiguo puntero secundario a p. 6, donde la página primaria contiene discurso educativo sustantivo y no las condiciones de publicación.\n\n")
          if marker not in readme: raise SystemExit('README insertion marker missing')
          readme=readme.replace(marker,paragraph+marker,1)
          (root/'README.md').write_text(readme,encoding='utf-8')

          cohort=(root/'docs/PDHD_U1_COHORT_STATUS.md').read_text(encoding='utf-8')
          cohort=cohort.replace('| Fully frozen fragments | **57 / 96** |','| Fully frozen fragments | **61 / 96** |')
          cohort=cohort.replace('Fifty-seven','Sixty-one').replace('Fifty-seven','Sixty-one')
          cohort=cohort.replace('Fifty-seven are frozen.','Sixty-one are frozen.')
          cohort=cohort.replace('Thirteen selected documents now have complete four-slot batches.','Fourteen selected documents now have complete four-slot batches.')
          cohort=cohort.replace('remaining **26** located rows','remaining **22** located rows')
          cohort=cohort.replace('The current 57 frozen units','The current 61 frozen units')
          cohort=cohort.replace('**57/96 frozen**','**61/96 frozen**')
          cohort=cohort.replace('at **83/96 localized** and **57/96 frozen**','at **83/96 localized** and **61/96 frozen**')
          cohort=cohort.replace('Strong candidates include page-resolved *El Maestro*, *México Intelectual* and *La Escuela Moderna* fragments, plus','Strong candidates include page-resolved *El Maestro* and *La Escuela Moderna* fragments, plus')
          cm="`PDHD-D000003`, *La Enseñanza Primaria*"
          cpara=("`PDHD-D000063`, *México intelectual* of 1889, now contributes a complete A–D batch from the HNDM primary viewer cross-walked from UNAM-RI `897145`. The recovery itself exposed an important interface trap: changing `intPagina` returned the same current leaf, so that first artifact was rejected. A corrected traversal followed the viewer's persistent `siguienteLink` page IDs and recovered 45 unique primary pages. Direct visual inspection replaces the weak secondary slot-A pointer with the explicit primary-teacher action paragraph on p. 34, confirms a bounded institutional-uniformity paragraph on p. 2 for slot B, fixes the Normal de Jalapa student/faculty/curriculum block on p. 27 for source criticism, and moves the control from the incorrect p. 6 secondary pointer to the actual `CONDICIONES` section on p. 32. No facsimile or source transcription is committed.\n\n")
          if cm not in cohort: raise SystemExit('cohort insertion marker missing')
          cohort=cohort.replace(cm,cpara+cm,1)
          (root/'docs/PDHD_U1_COHORT_STATUS.md').write_text(cohort,encoding='utf-8')

      - name: Remove temporary Mexico Intelectual workflows
        shell: bash
        run: |
          rm -f .github/workflows/probe-mexico-intelectual-1889.yml
          rm -f .github/workflows/retrieve-mexico-intelectual-1889.yml
          rm -f .github/workflows/finalize-mexico-intelectual-1889.yml

      - name: Validate scientific state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          python scripts/validate_object_aliases.py
          python scripts/validate_content_leads.py
          python scripts/validate_retrieval_attempts.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_freeze_conversion_queue.py
          python scripts/prepare_freeze_review.py --check
          python scripts/validate_status_counts.py
          python scripts/annotation_agreement.py --self-test
          python scripts/build_fragment_manifest.py --check
          git diff --check

      - name: Gate persistent diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD > /tmp/pre-existing.txt || true
          git diff --name-only > /tmp/worktree.txt
          echo 'Worktree files:'; cat /tmp/worktree.txt
          python - <<'PY'
          import subprocess
          expected={
            'README.md',
            'docs/PDHD_U1_COHORT_STATUS.md',
            'data/samples/fragment_locator_progress_mexico_intelectual_w10.csv',
            'data/samples/fragment_locator_progress_mexico_intelectual_w15.csv',
            'data/samples/fragment_locator_progress_crosswalk_w3.csv',
            'data/samples/frozen_fragments_mexico_intelectual_w21.csv',
            'data/samples/retrieval_attempts.csv',
            '.github/workflows/probe-mexico-intelectual-1889.yml',
            '.github/workflows/retrieve-mexico-intelectual-1889.yml',
            '.github/workflows/finalize-mexico-intelectual-1889.yml',
          }
          files=set(subprocess.check_output(['git','status','--porcelain'],text=True).splitlines())
          paths={line[3:] for line in files}
          unexpected=paths-expected
          if unexpected: raise SystemExit('unexpected worktree files: '+repr(sorted(unexpected)))
          for req in ['README.md','docs/PDHD_U1_COHORT_STATUS.md','data/samples/fragment_locator_progress_mexico_intelectual_w10.csv','data/samples/fragment_locator_progress_mexico_intelectual_w15.csv','data/samples/fragment_locator_progress_crosswalk_w3.csv','data/samples/frozen_fragments_mexico_intelectual_w21.csv','data/samples/retrieval_attempts.csv']:
              if req not in paths: raise SystemExit('missing expected scientific diff: '+req)
          PY

      - name: Commit and push clean batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fernando Sandoval'
          git config user.email 'fernando.sandoval@uacj.mx'
          git add -A
          git commit -m 'Freeze Mexico Intelectual 1889 primary batch'
          git push origin HEAD:freeze-mexico-intelectual-1889
