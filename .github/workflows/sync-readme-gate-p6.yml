name: Sync README methodological gate after F000037

on:
  push:
    branches:
      - freeze-ensenanza-moderna-p6
    paths:
      - ".github/workflows/sync-readme-gate-p6.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-ensenanza-moderna-p6

      - name: Replace stale methodological-gate markers
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '**82/96 slots tienen ya un localizador documentado.**': '**83/96 slots tienen ya un localizador documentado.**',
              'Los **23/96** congelados demuestran el pipeline': 'Los **29/96** congelados demuestran el pipeline',
              'Quedan **14 slots sin localizador**.': 'Quedan **13 slots sin localizador**.',
              'La cola directa queda reducida a `PDHD-F000060`, control `PR5` de *El esfuerzo educativo en México*, todavía pendiente de inspección primaria auditable.': '`PDHD-F000060` ya fue inspeccionado en la página primaria `PR5`, congelado y retirado de cualquier cola pendiente.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected README marker not found: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

      - name: Commit cleanup and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/sync-readme-gate-p6.yml
          git config user.name 'PDHD status sync'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md .github/workflows/sync-readme-gate-p6.yml
          git commit -m 'Refresh README methodological gate after F000037'
          git push origin HEAD:freeze-ensenanza-moderna-p6
