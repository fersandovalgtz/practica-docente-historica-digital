name: Sync F000033 README on branch

on:
  push:
    branches: [freeze-ensenanza-normal-p12]
    paths:
      - ".github/workflows/sync-f000033-readme-branch.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-ensenanza-normal-p12
      - name: Synchronize controlled README markers
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "| Fragmentos completamente congelados | **22 / 96** |": "| Fragmentos completamente congelados | **23 / 96** |",
              "su unión contiene **22/96** fragmentos": "su unión contiene **23/96** fragmentos",
              "**58 localizadores todavía no congelados**": "**57 localizadores todavía no congelados**",
              "Los **22/96** congelados": "Los **23/96** congelados",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one README marker {old!r}; found {count}")
              text = text.replace(old, new)

          old1 = """El número inaugural de *La Enseñanza Normal*, 15 de septiembre de 1904, aporta dos unidades adicionales congeladas desde el PDF primario de BVMC. `PDHD-F000034` fija el bloque profesional/editorial de primera página y `PDHD-F000036` fija la línea autónoma de periodicidad como control administrativo. El slot A (`PDHD-F000033`) permanece pendiente de cotejo primario en p. 12."""
          new1 = """El número inaugural de *La Enseñanza Normal*, 15 de septiembre de 1904, aporta ahora tres unidades congeladas desde el PDF primario de BVMC. `PDHD-F000034` fija el bloque profesional/editorial de primera página y `PDHD-F000036` fija la línea autónoma de periodicidad como control administrativo. `PDHD-F000033` fija en la p. 12 un párrafo de *Conferencias Pedagógicas* de Leopoldo Kiel que prescribe práctica sostenida con grupos de niños, observación, experimentación y comprobación de los procedimientos de enseñanza. La página histórica fue recuperada e inspeccionada directamente antes de fijar el span."""
          if text.count(old1) != 1:
              raise SystemExit(f"Expected one inaugural La Enseñanza Normal paragraph; found {text.count(old1)}")
          text = text.replace(old1, new1)

          old2 = """*La Enseñanza Normal* tiene ya congelados `PDHD-F000034` y `PDHD-F000036` en la primera página del número inaugural del 15 de septiembre de 1904. La inspección del PDF primario de BVMC fija, respectivamente, la región profesional/editorial y una línea administrativa de periodicidad como control. El slot A apunta a la p. 12, donde una tesis de la UNAM localiza una prescripción de Leopoldo Kiel sobre práctica con grupos de niños, observación y comprobación de procedimientos de enseñanza; este último permanece pendiente de inspección directa de la página histórica."""
          new2 = """*La Enseñanza Normal* tiene ya congelados `PDHD-F000033`, `PDHD-F000034` y `PDHD-F000036` en el número inaugural del 15 de septiembre de 1904. La inspección del PDF primario de BVMC fija la prescripción de Leopoldo Kiel en p. 12 como acto pedagógico explícito, la región profesional/editorial de p. 1 y una línea administrativa de periodicidad como control. El puntero secundario de la tesis de la UNAM sirvió para recuperación, pero la promoción de `PDHD-F000033` se realizó sólo después de inspeccionar directamente la página histórica."""
          if text.count(old2) != 1:
              raise SystemExit(f"Expected one detailed La Enseñanza Normal paragraph; found {text.count(old2)}")
          text = text.replace(old2, new2)

          path.write_text(text, encoding="utf-8")
      - name: Remove temporary workflow and commit README sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PDHD status sync"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/sync-f000033-readme-branch.yml
          git add README.md
          git commit -m "Synchronize README after F000033 freeze"
          git push origin HEAD:freeze-ensenanza-normal-p12
