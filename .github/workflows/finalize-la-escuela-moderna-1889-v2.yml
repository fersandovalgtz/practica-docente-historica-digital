name: Finalize La Escuela Moderna 1889 primary batch v2

on:
  push:
    branches: [freeze-la-escuela-moderna-1889]
    paths:
      - ".github/workflows/finalize-la-escuela-moderna-1889-v2.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote exact primary batch and synchronize documentation
        shell: python
        run: |
          import csv,pathlib,re
          root=pathlib.Path('.'); s=root/'data/samples'; checked='2026-09-06'; doc='PDHD-D000058'
          pdf='https://hndm.iib.unam.mx/consulta/publicacion/pdf/'
          lf=['fragment_id','document_id','slot','page','source_locator','locator_evidence_url','boundary_status','public_text_status','freeze_status','preparation_note','checked_at']
          ff=['fragment_id','document_id','slot','page','source_locator','locator_evidence_url','boundary_definition','transcription_status','access_basis','public_text_status','selection_role','freeze_status','preparation_note','checked_at']
          data={
           'PDHD-F000021':dict(fragment_id='PDHD-F000021',document_id=doc,slot='A',page='18',source_locator='p18-rebsamen-desarrollo-armonico-facultades-educando',locator_evidence_url=pdf+'558a33387d1ed64f16922985.pdf?coleccion=&palabras=',boundary_status='fixed',public_text_status='metadata_only',freeze_status='frozen',preparation_note="Direct inspection of the exact HNDM primary page fixes an explicit pedagogical prescription in Enrique C. Rebsamen's La Pedagogia Moderna. The bounded unit directs the educator to develop the learner's physical, intellectual, ethical and aesthetic faculties harmoniously and frames guidance by criterion and conscience. The next paragraph on physiological and psychological laws is excluded. No source text or image is committed.",checked_at=checked),
           'PDHD-F000022':dict(fragment_id='PDHD-F000022',document_id=doc,slot='B',page='17',source_locator='p17-redaccion-congreso-instruccion-reglamento-secretaria',locator_evidence_url=pdf+'558a33387d1ed64f16922984.pdf?coleccion=&palabras=',boundary_status='fixed',public_text_status='metadata_only',freeze_status='frozen',preparation_note="Direct primary inspection fixes the two editorial paragraphs between official Circular numero 53 and the DE FONDO heading. The redaction endorses the requested statistical information for the Congreso de Instruccion and announces the forthcoming Reglamento under study by the Secretario de Justicia e Instruccion Publica. The official circular and Rebsamen article are excluded.",checked_at=checked),
           'PDHD-F000023':dict(fragment_id='PDHD-F000023',document_id=doc,slot='C',page='17',source_locator='p17-rebsamen-educacion-urbanidad-instruccion-distincion',locator_evidence_url=pdf+'558a33387d1ed64f16922984.pdf?coleccion=&palabras=',boundary_status='fixed',public_text_status='metadata_only',freeze_status='frozen',preparation_note="The earlier scholarly pp. 17-18 pointer is superseded by direct inspection of printed p. 17 in the exact 31 October 1889 HNDM issue. The fixed opening of La Pedagogia Moderna records contemporary uses that equate educacion with urbanidad or instruccion. These semantic distinctions are retained as source-critical evidence and the unit stops before the article moves into conditions for educational action.",checked_at=checked),
           'PDHD-F000024':dict(fragment_id='PDHD-F000024',document_id=doc,slot='D',page='32',source_locator='p32-notas-advertencias-suplemento-precio-publicacion',locator_evidence_url=pdf+'558a33387d1ed64f16922993.pdf?coleccion=&palabras=',boundary_status='fixed',public_text_status='metadata_only',freeze_status='frozen',preparation_note="Direct inspection of printed p. 32 fixes a deliberately low-pedagogical publication-control unit within NOTAS Y ADVERTENCIAS. The two paragraphs state the ordinary issue extent, the four-page supplement and that its extraordinary cost would not increase the issue price. The following binding/title paragraph and later delay/errata notices are excluded.",checked_at=checked),
          }
          bd={
           'PDHD-F000021':"Printed p. 18, left column, within LA PEDAGOGIA MODERNA: fix the two contiguous paragraphs beginning with the prescription that each educator develop harmoniously all physical, intellectual, ethical and aesthetic faculties of the learners and continuing through the paragraph directing each educator to guide activity by criterion and conscience and to cultivate the faculties rationally. Stop before the following paragraph on physiological and psychological laws.",
           'PDHD-F000022':"Printed p. 17, left column, after the closing signature/date line of official Circular numero 53 and before DE FONDO: fix the two editorial paragraphs beginning with La Redaccion de La Escuela Moderna and ending with the notice that the Reglamento for the Congreso, then under study by the Secretario de Justicia e Instruccion Publica, would be issued within days. Exclude the official circular above and the pedagogical article below.",
           'PDHD-F000023':"Printed p. 17, opening of LA PEDAGOGIA MODERNA across the lower left and upper right columns: fix the heading/subheading and conceptual opening from the definition of Pedagogy as science and art of education through the contiguous examples showing education treated as synonymous with urbanity and with instruction. Stop before the later paragraph on conditions required for educational action.",
           'PDHD-F000024':"Printed p. 32, right column, within the continuing NOTAS Y ADVERTENCIAS section after the first Congress-related note: fix the two contiguous publication-administration paragraphs beginning with the ordinary eight-sheet extent plus the Tratado de Higiene Escolar and the four-page supplement and ending with the statement that the extraordinary supplement cost does not increase the present issue price. Stop before the paragraph on publication title/binding conventions.",
          }
          roles={'PDHD-F000021':'explicit_pedagogical_act','PDHD-F000022':'institutional_relation','PDHD-F000023':'source_criticism_salient','PDHD-F000024':'control'}

          # Preserve F23 in its historical locator shard.
          p=s/'fragment_locator_progress_secondary_w4.csv'
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          hits=0
          for r in rows:
              if r['fragment_id']=='PDHD-F000023': r.update(data[r['fragment_id']]); hits+=1
          if hits!=1: raise SystemExit(f'F23 row count={hits}')
          with p.open('w',encoding='utf-8',newline='') as f: w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          # New locator shard for former gaps.
          p=s/'fragment_locator_progress_hndm_escuela_moderna1889_w24.csv'
          if p.exists(): raise SystemExit('new locator shard unexpectedly exists')
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=lf); w.writeheader(); [w.writerow(data[x]) for x in ['PDHD-F000021','PDHD-F000022','PDHD-F000024']]

          # New frozen batch.
          p=s/'frozen_fragments_hndm_escuela_moderna1889_w24.csv'
          if p.exists(): raise SystemExit('new frozen shard unexpectedly exists')
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=ff); w.writeheader()
              for fid in ['PDHD-F000021','PDHD-F000022','PDHD-F000023','PDHD-F000024']:
                  r=data[fid]; w.writerow(dict(fragment_id=fid,document_id=doc,slot=r['slot'],page=r['page'],source_locator=r['source_locator'],locator_evidence_url=r['locator_evidence_url'],boundary_definition=bd[fid],transcription_status='not_transcribed',access_basis='HNDM_public_interface_manual_inspection',public_text_status='metadata_only',selection_role=roles[fid],freeze_status='frozen',preparation_note=r['preparation_note'],checked_at=checked))

          # Remove exactly D58 A/B/D gaps.
          p=s/'fragment_gap_queue_0_1.csv'
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          rm={'PDHD-F000021','PDHD-F000022','PDHD-F000024'}; before=len(rows); rows=[r for r in rows if r['fragment_id'] not in rm]
          if before-len(rows)!=3: raise SystemExit('gap removal did not remove exactly 3')
          with p.open('w',encoding='utf-8',newline='') as f: w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          # RA17 provenance.
          p=s/'retrieval_attempts.csv'
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          if any(r['attempt_id']=='PDHD-RA000017' for r in rows): raise SystemExit('RA17 already exists')
          rows.append({'attempt_id':'PDHD-RA000017','document_id':doc,'fragment_ids':'PDHD-F000021;PDHD-F000022;PDHD-F000023;PDHD-F000024','source_id':'HNDM','object_url':'https://hndm.iib.unam.mx/consulta/publicacion/visualizar/558075be7d1e63c9fea1a259?coleccion=&pagina=1&anio=1889&mes=10&dia=31&butIr=Ir','target':'all_four_issue_slots','result_status':'superseded_by_locator','blocker':"UNAM-RI 924534 no longer exposed a usable target record. Adjacent live record 924533 identified the same HNDM serial and explicitly preserved the serial chronology including tomo I numero 2 on 31 October 1889. A numeric ObjectId-neighborhood probe was rejected after nearby IDs resolved to unrelated dates. Inspection of the actual HNDM viewer form showed that anioPS1/mesPS1/diaPS1 are element IDs while submitted field names are anio/mes/dia. Submitting pagina=1, anio=1889, mes=10, dia=31 resolved the 20-page issue with first page/PDF ID 558a33387d1ed64f16922984. Following explicit siguienteLink IDs recovered all 20 pages under strict date, count and PDF identity gates. Direct image inspection fixes F000021 p.18, F000022/F000023 as distinct p.17 units, and F000024 p.32.",'next_route':'frozen_registry_gap_queue_and_status_sync_completed','checked_at':checked})
          with p.open('w',encoding='utf-8',newline='') as f: w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          # README canonical count markers plus stale nearby prose.
          p=root/'README.md'; t=p.read_text(encoding='utf-8')
          repl={
           '| Slots con localizador candidato/resuelto | **89 / 96** |':'| Slots con localizador candidato/resuelto | **92 / 96** |',
           '| Fragmentos completamente congelados | **69 / 96** |':'| Fragmentos completamente congelados | **73 / 96** |',
           'su unión contiene **89/96** slots':'su unión contiene **92/96** slots',
           'su unión contiene **69/96** fragmentos':'su unión contiene **73/96** fragmentos',
           '**89/96 slots tienen ya un localizador documentado.**':'**92/96 slots tienen ya un localizador documentado.**',
           '**20 localizadores todavía no congelados**':'**19 localizadores todavía no congelados**',
           'Los **57/96** congelados demuestran':'Los **73/96** congelados demuestran',
           'Quedan **7 slots sin localizador**':'Quedan **4 slots sin localizador**',
           'el siguiente escalón cuantitativo de seguimiento será **84/96**':'el siguiente escalón cuantitativo de seguimiento será **95/96**',
          }
          for a,b in repl.items():
              if a not in t: raise SystemExit(f'README marker missing: {a}')
              t=t.replace(a,b,1)
          note="`PDHD-D000058`, *La Escuela Moderna* del 31 de octubre de 1889, completa A–D desde 20 páginas primarias HNDM identificadas mediante el selector real del visor. El registro UNAM-RI `924534` dejó de exponer una ficha utilizable; la ficha vecina `924533` permitió resolver el serial `558075be7d1e63c9fea1a259` y su cronología. La solicitud correcta usa los campos enviados por el formulario (`anio=1889`, `mes=10`, `dia=31`) y resuelve `558a33387d1ed64f16922984` como primera página. `PDHD-F000021` fija p. 18 como acto pedagógico explícito; `PDHD-F000022` y `PDHD-F000023` usan unidades distintas de p. 17 para relación institucional y crítica de fuentes; `PDHD-F000024` usa las notas administrativas de p. 32 como control. No se publica facsímil ni transcripción histórica."
          if 'PDHD-D000058`, *La Escuela Moderna* del 31 de octubre de 1889' not in t:
              m=re.search(r'(`PDHD-D000064`, \*El Instructor\*.*?\n\n)',t,re.S)
              if not m: raise SystemExit('README insertion anchor missing')
              t=t[:m.end()]+note+'\n\n'+t[m.end():]
          p.write_text(t,encoding='utf-8')

          # Cohort status.
          p=root/'docs/PDHD_U1_COHORT_STATUS.md'; t=p.read_text(encoding='utf-8')
          repl={
           '| Fragment locator rows resolved/candidate | **89 / 96** | 86.5% of reliability slots localized |':'| Fragment locator rows resolved/candidate | **92 / 96** | 95.8% of reliability slots localized |',
           '| Fully frozen fragments | **69 / 96** | page-resolved conversion phase active |':'| Fully frozen fragments | **73 / 96** | page-resolved conversion phase active |',
           'PDHD-U1 now has **89 of the 96 deterministic reliability slots** tied to a documented page, scan or section target. Sixty-nine units have crossed the stronger frozen-fragment gate.':'PDHD-U1 now has **92 of the 96 deterministic reliability slots** tied to a documented page, scan or section target. Seventy-three units have crossed the stronger frozen-fragment gate.',
           'Sixteen selected documents now have complete four-slot batches.':'Seventeen selected documents now have complete four-slot batches.',
           'contains **89/96** pilot slots. Sixty-one are frozen. The remaining **20** located rows':'contains **92/96** pilot slots. Seventy-three are frozen. The remaining **19** located rows',
           '**7 slots remain without a locator.**':'**4 slots remain without a locator.**',
           'The current 69 frozen units demonstrate':'The current 73 frozen units demonstrate',
           'The project is now at **89/96 localized** and **69/96 frozen**. Recent primary-object recovery has expanded the frozen package while preserving the unlocalized complement at 7. The next quantitative localization checkpoint is **92/96**, while the stronger scientific priority is converting high-quality existing page pointers and completing document batches without weakening the evidence hierarchy.':'The project is now at **92/96 localized** and **73/96 frozen**. Recent primary-object recovery has expanded the frozen package while preserving the unlocalized complement at 4. The next quantitative localization checkpoint is **95/96**, while the stronger scientific priority remains completing document batches without weakening the evidence hierarchy.',
          }
          for a,b in repl.items():
              if a not in t: raise SystemExit(f'cohort marker missing: {a[:100]}')
              t=t.replace(a,b,1)
          note="`PDHD-D000058`, *La Escuela Moderna* of 31 October 1889, now contributes a complete A–D batch from 20 exact HNDM primary pages. The broken UNAM-RI `924534` route was bypassed only after adjacent record `924533` resolved the same HNDM serial and explicit chronology. Numeric ObjectId adjacency was tested and rejected. The real HNDM selector submits `anio`/`mes`/`dia`; selecting 1889-10-31 resolved first page `558a33387d1ed64f16922984`, after which explicit `siguienteLink` identifiers recovered all 20 pages under strict identity gates. Direct image inspection fixes F000021 p. 18, F000022 and F000023 as distinct p. 17 units, and F000024 p. 32."
          if 'PDHD-D000058`, *La Escuela Moderna* of 31 October 1889' not in t:
              m=re.search(r'(`PDHD-D000064`, \*El Instructor\*.*?\n\n)',t,re.S)
              if not m: raise SystemExit('cohort insertion anchor missing')
              t=t[:m.end()]+note+'\n\n'+t[m.end():]
          p.write_text(t,encoding='utf-8')

          # Source-of-truth gate.
          loc={}
          for p in sorted(s.glob('fragment_locator_progress*.csv')):
              with p.open(encoding='utf-8',newline='') as f:
                  for r in csv.DictReader(f):
                      if r['fragment_id'] in loc: raise SystemExit('duplicate locator '+r['fragment_id'])
                      loc[r['fragment_id']]=r
          fr={}
          for p in sorted(s.glob('frozen_fragments*.csv')):
              with p.open(encoding='utf-8',newline='') as f:
                  for r in csv.DictReader(f):
                      if r['fragment_id'] in fr: raise SystemExit('duplicate frozen '+r['fragment_id'])
                      fr[r['fragment_id']]=r
          with (s/'fragment_gap_queue_0_1.csv').open(encoding='utf-8',newline='') as f: gaps=list(csv.DictReader(f))
          print('COUNTS',len(loc),len(fr),len(gaps),len(loc)-len(fr))
          if (len(loc),len(fr),len(gaps),len(loc)-len(fr))!=(92,73,4,19): raise SystemExit('count gate failed')
      - name: Remove all temporary Escuela Moderna workflows
        shell: bash
        run: |
          rm -f .github/workflows/probe-la-escuela-moderna-1889.yml
          rm -f .github/workflows/retrieve-la-escuela-moderna-1889.yml
          rm -f .github/workflows/finalize-la-escuela-moderna-1889.yml
          rm -f .github/workflows/finalize-la-escuela-moderna-1889-v2.yml
      - name: Run canonical validation suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          python scripts/validate_object_aliases.py
          python scripts/validate_content_leads.py
          python scripts/validate_retrieval_attempts.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_freeze_conversion_queue.py
          python scripts/prepare_freeze_review.py --check
          python scripts/validate_status_counts.py
          python scripts/annotation_agreement.py --self-test
          python scripts/build_fragment_manifest.py --check
      - name: Gate final persistent diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          { git diff --name-only origin/main...HEAD; git diff --name-only; } | sed '/^$/d' | sort -u > /tmp/changed
          cat /tmp/changed
          cat > /tmp/allowed <<'EOF'
          README.md
          data/samples/fragment_gap_queue_0_1.csv
          data/samples/fragment_locator_progress_secondary_w4.csv
          data/samples/fragment_locator_progress_hndm_escuela_moderna1889_w24.csv
          data/samples/frozen_fragments_hndm_escuela_moderna1889_w24.csv
          data/samples/retrieval_attempts.csv
          docs/PDHD_U1_COHORT_STATUS.md
          EOF
          sort -u /tmp/allowed -o /tmp/allowed
          test -z "$(comm -23 /tmp/changed /tmp/allowed)" || { echo unexpected; comm -23 /tmp/changed /tmp/allowed; exit 1; }
          test -z "$(comm -13 /tmp/changed /tmp/allowed)" || { echo missing; comm -13 /tmp/changed /tmp/allowed; exit 1; }
      - name: Commit and push clean scientific tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fernando Sandoval"
          git config user.email "fernando.sandoval@uacj.mx"
          git add -A
          git status --short
          git commit -m "Freeze La Escuela Moderna 31 Oct 1889 primary batch"
          git push origin HEAD:freeze-la-escuela-moderna-1889
