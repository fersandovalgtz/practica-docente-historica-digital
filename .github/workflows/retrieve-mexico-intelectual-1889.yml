name: Retrieve Mexico Intelectual 1889 primary pages

on:
  push:
    branches: [freeze-mexico-intelectual-1889]
    paths:
      - ".github/workflows/retrieve-mexico-intelectual-1889.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Traverse HNDM pages by persistent page id
        shell: python
        run: |
          import html,json,pathlib,re,time,urllib.parse,urllib.request,urllib.error
          out=pathlib.Path('mexico-intelectual-primary'); out.mkdir()
          serial='558075be7d1e63c9fea1a356'
          base='https://hndm.iib.unam.mx'
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'Accept-Language':'es-MX,es;q=0.9,en;q=0.7',
          }
          current_url=f'{base}/consulta/publicacion/visualizar/{serial}?anio=1889&mes=01&dia=01&intPagina=1&tipo=publicacion'
          mapping=[]
          seen=set()
          for seq in range(1,46):
              item={'sequence':seq,'viewer_url':current_url}
              try:
                  req=urllib.request.Request(current_url,headers=headers)
                  with urllib.request.urlopen(req,timeout=90) as r: body=r.read()
                  text=html.unescape(body.decode('utf-8',errors='replace'))
                  pdfids=list(dict.fromkeys(re.findall(r'/consulta/publicacion/pdf/([0-9a-f]{24})\.pdf',text,re.I)))
                  # Preserve navigation order from HTML: previous/next may both exist.
                  navids=re.findall(r'[?&]pagina=([0-9a-f]{24})',text,re.I)
                  item.update(status=200,bytes=len(body),title_hit=('México Intelectual' in text or 'Mexico Intelectual' in text),pdf_ids=pdfids,nav_page_ids=navids)
                  if not pdfids:
                      item['error']='no_current_pdf_id'; mapping.append(item); break
                  pid=pdfids[0]
                  item['pdf_id']=pid
                  if pid in seen:
                      item['error']='page_cycle_detected'; mapping.append(item); break
                  seen.add(pid)
                  pdfurl=f'{base}/consulta/publicacion/pdf/{pid}.pdf?coleccion=&palabras='
                  preq=urllib.request.Request(pdfurl,headers=headers)
                  with urllib.request.urlopen(preq,timeout=90) as pr: pdf=pr.read()
                  if not pdf.startswith(b'%PDF'):
                      item['error']='non_pdf_payload'; item['pdf_prefix']=repr(pdf[:40]); mapping.append(item); break
                  (out/f'seq-{seq:03d}-{pid}.pdf').write_bytes(pdf)
                  item['pdf_url']=pdfurl; item['pdf_bytes']=len(pdf)
                  # The next-page link is explicitly marked siguienteLink. Resolve only that href,
                  # rather than guessing from intPagina or choosing among previous/next ids.
                  mnext=re.search(r'<a href="([^"]*\?pagina=([0-9a-f]{24})[^\"]*)"[^>]*class="siguienteLink"',text,re.I)
                  if not mnext:
                      item['end_of_sequence']=True; mapping.append(item); break
                  href=html.unescape(mnext.group(1)); nextid=mnext.group(2)
                  item['next_page_id']=nextid
                  current_url=urllib.parse.urljoin(base,href)
              except urllib.error.HTTPError as exc:
                  item.update(status=exc.code,error='HTTPError'); mapping.append(item); break
              except Exception as exc:
                  item['error']=repr(exc); mapping.append(item); break
              mapping.append(item)
              time.sleep(0.15)
          (out/'viewer-map.json').write_text(json.dumps(mapping,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(mapping,ensure_ascii=False,indent=2))
          if len([x for x in mapping if x.get('pdf_id')]) < 35:
              raise SystemExit('scientific gate failed: fewer than 35 unique HNDM pages recovered')

      - name: Extract labels text and render pages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          out=mexico-intelectual-primary
          mkdir -p "$out/rendered" "$out/text"
          for f in "$out"/seq-*.pdf; do
            [ -e "$f" ] || continue
            stem=$(basename "$f" .pdf)
            pdftotext -layout "$f" "$out/text/$stem.txt" || true
            pdftoppm -f 1 -l 1 -singlefile -jpeg -r 220 "$f" "$out/rendered/$stem" >/dev/null 2>&1 || true
          done
          python - <<'PY'
          import json,pathlib,re,unicodedata
          out=pathlib.Path('mexico-intelectual-primary')
          hits=[]
          terms=['MEXICO INTELECTUAL','MÉXICO INTELECTUAL','METOD','PEDAGOG','PROFESOR','MAGISTER','CORRESPONDENCIA','PRECIO','ESCUELA NORMAL','JALAPA','XALAPA','PROSPECTO','REDACCION','REDACCIÓN','ENSEÑANZA']
          for p in sorted((out/'text').glob('*.txt')):
              text=p.read_text(encoding='utf-8',errors='replace')
              n=unicodedata.normalize('NFD',text.upper()); n=''.join(c for c in n if unicodedata.category(c)!='Mn')
              found=[]
              for term in terms:
                  t=unicodedata.normalize('NFD',term.upper()); t=''.join(c for c in t if unicodedata.category(c)!='Mn')
                  if t in n: found.append(term)
              nums=re.findall(r'(?m)^\s*([0-9]{1,3})\s*$',text)
              hits.append({'file':p.name,'terms':found,'numeric_lines':nums[:12],'snippet':re.sub(r'\s+',' ',text)[:5000]})
          (out/'page-text-summary.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(hits,ensure_ascii=False,indent=2))
          PY

      - name: Upload primary review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-mexico-intelectual-1889-primary-review-v2
          path: mexico-intelectual-primary/
          retention-days: 1
