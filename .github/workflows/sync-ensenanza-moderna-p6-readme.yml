name: Sync La Enseñanza Moderna p6 README

on:
  push:
    branches:
      - freeze-ensenanza-moderna-p6
    paths:
      - ".github/workflows/sync-ensenanza-moderna-p6-readme.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-ensenanza-moderna-p6

      - name: Synchronize controlled README markers
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('**82 / 96**', '**83 / 96**')
          text = text.replace('**28 / 96**', '**29 / 96**')
          text = text.replace('**82/96**', '**83/96**')
          text = text.replace('**28/96**', '**29/96**')

          old = '''A esos doce fragmentos se suman tres unidades directamente inspeccionadas de *La Enseñanza Moderna*, tomo I, segunda época, núm. 1, del 1 de julio de 1907: `PDHD-F000038`–`PDHD-F000040`. La imagen primaria de BVMC permite fijar el bloque editorial/profesional, la región programática de apertura y un bloque administrativo de control. El slot A de ese documento (`PDHD-F000037`) sigue pendiente porque todavía no se ha inspeccionado un pasaje de acto pedagógico explícito con resolución suficiente.'''
          new = '''*La Enseñanza Moderna*, tomo I, segunda época, núm. 1, del 1 de julio de 1907, aporta ahora un lote completo de cuatro fragmentos. `PDHD-F000038`–`PDHD-F000040` permanecen fijados desde la primera página primaria de BVMC. `PDHD-F000037` completa el slot A desde la p. 6 del PDF primario: bajo *Clase de colores*, el span comienza en `Principio`, incluye `Medio`, `Fin`, `Método` y `Procedimiento`, y termina antes de `Ilustraciones`. La secuencia constituye un plan explícito de acción didáctica y se fijó sólo después de renderizar e inspeccionar directamente el número histórico completo.'''
          if old not in text:
              raise SystemExit('Expected La Enseñanza Moderna paragraph not found')
          text = text.replace(old, new)

          old2 = '''El número inaugural de *La Enseñanza Normal*, 15 de septiembre de 1904, aporta ahora tres unidades congeladas desde el PDF primario de BVMC. `PDHD-F000034` fija el bloque profesional/editorial de primera página y `PDHD-F000036` fija la línea autónoma de periodicidad como control administrativo. `PDHD-F000033` fija en la p. 12 un párrafo de *Conferencias Pedagógicas* de Leopoldo Kiel que prescribe práctica sostenida con grupos de niños, observación, experimentación y comprobación de los procedimientos de enseñanza. La página histórica fue recuperada e inspeccionada directamente antes de fijar el span.'''
          new2 = '''El número inaugural de *La Enseñanza Normal*, 15 de septiembre de 1904, aporta cuatro unidades congeladas desde el PDF primario de BVMC. `PDHD-F000033` fija en la p. 12 un párrafo de *Conferencias Pedagógicas* de Leopoldo Kiel; `PDHD-F000034` fija el bloque profesional/editorial de primera página; `PDHD-F000035` fija en la p. 4 la apertura político-educativa de *15 de Septiembre — Fecha grata*; y `PDHD-F000036` fija la línea autónoma de periodicidad como control administrativo. Cada span fue fijado después de inspección primaria directa.'''
          if old2 in text:
              text = text.replace(old2, new2)

          p.write_text(text, encoding='utf-8')

      - name: Commit README sync and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/sync-ensenanza-moderna-p6-readme.yml
          git config user.name 'PDHD status sync'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md .github/workflows/sync-ensenanza-moderna-p6-readme.yml
          git commit -m 'Synchronize README after La Enseñanza Moderna completion'
          git push origin HEAD:freeze-ensenanza-moderna-p6
