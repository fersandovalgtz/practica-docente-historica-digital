name: Probe La Escuela Moderna 1889 primary identifiers

on:
  push:
    branches: [freeze-la-escuela-moderna-1889]
    paths:
      - ".github/workflows/probe-la-escuela-moderna-1889.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve UNAM structured object metadata and current fragment state
        shell: python
        run: |
          import csv,html,json,pathlib,re,urllib.request
          out=pathlib.Path('probe'); out.mkdir()
          url='https://repositorio.unam.mx/contenidos/la-escuela-moderna-924534'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'es-MX,es;q=0.9'})
          with urllib.request.urlopen(req,timeout=90) as r:
              body=r.read(); final=r.geturl(); status=r.status
          text=body.decode('utf-8',errors='replace'); dec=html.unescape(text)
          (out/'unam.html').write_text(text,encoding='utf-8')
          def matches(pattern):
              return list(dict.fromkeys(re.findall(pattern,dec,re.I|re.S)))
          report={
            'status':status,'final_url':final,'bytes':len(body),
            'publication_ids':matches(r'item_publication_id[^0-9a-f]{0,100}([0-9a-f]{24})'),
            'first_page_ids':matches(r'item_first_page_id[^0-9a-f]{0,100}([0-9a-f]{24})'),
            'item_dates':matches(r'item_date[^0-9]{0,100}(1889-10-31(?:T[^"< ]+)?)'),
            'item_pages':matches(r'item_pages[^0-9]{0,100}([0-9]{1,4})'),
            'hndm_serial_links':matches(r'(?:visualizar|publicacion)/(5580[0-9a-f]{20,})'),
            'page_ids_any':matches(r'([0-9a-f]{24})'),
          }
          # Preserve F21-F24 canonical pre-state.
          loc=[]
          for p in sorted(pathlib.Path('data/samples').glob('fragment_locator_progress*.csv')):
              with p.open(encoding='utf-8',newline='') as f:
                  for row in csv.DictReader(f):
                      if row.get('fragment_id') in {'PDHD-F000021','PDHD-F000022','PDHD-F000023','PDHD-F000024'}:
                          loc.append({'shard':p.name,**row})
          with (pathlib.Path('data/samples')/'fragment_gap_queue_0_1.csv').open(encoding='utf-8',newline='') as f:
              gaps=[r for r in csv.DictReader(f) if r.get('fragment_id') in {'PDHD-F000021','PDHD-F000022','PDHD-F000023','PDHD-F000024'}]
          report['locators']=loc; report['gaps']=gaps
          # context around structured fields and full-text link
          contexts=[]
          for token in ['item_first_page_id','item_publication_id','item_pages','item_date','Texto completo','Hemeroteca Nacional Digital','1889-10-31']:
              for m in list(re.finditer(re.escape(token),dec,re.I))[:10]:
                  contexts.append({'token':token,'context':re.sub(r'\s+',' ',dec[max(0,m.start()-450):m.end()+850])})
          report['contexts']=contexts
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if '1889-10-31' not in dec:
              raise SystemExit('UNAM identity gate failed: target date not visible')
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-la-escuela-moderna-1889-probe
          path: probe/
          retention-days: 1
