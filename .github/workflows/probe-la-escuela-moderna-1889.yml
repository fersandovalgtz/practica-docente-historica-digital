name: Probe La Escuela Moderna 1889 issue selector

on:
  push:
    branches: [freeze-la-escuela-moderna-1889]
    paths:
      - ".github/workflows/probe-la-escuela-moderna-1889.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit exact HNDM issue-selector fields
        shell: python
        run: |
          import html,json,pathlib,re,urllib.parse,urllib.request,http.cookiejar
          out=pathlib.Path('probe-selector'); out.mkdir()
          base='https://hndm.iib.unam.mx'
          serial='558075be7d1e63c9fea1a259'
          neighbor_page='558a33397d1ed64f16922d41'
          target_date='1889-10-31'
          start=f'{base}/consulta/publicacion/visualizar/{serial}?pagina={neighbor_page}&coleccion='
          action=f'{base}/consulta/publicacion/visualizar/{serial}'
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9,en;q=0.7'}
          jar=http.cookiejar.CookieJar(); opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def request(url,data=None,method=None):
              h=dict(headers); h['Referer']=start
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              with opener.open(req,timeout=90) as r: body=r.read(); final=r.geturl(); status=r.status
              text=html.unescape(body.decode('utf-8',errors='replace'))
              d=re.search(r'<dt>Fecha:</dt>\s*<dd>\s*([^<]+?)\s*</dd>',text,re.I|re.S)
              visible=re.sub(r'\s+',' ',d.group(1)).strip() if d else ''
              pdfids=list(dict.fromkeys(re.findall(r'/consulta/publicacion/pdf/([0-9a-f]{24})\.pdf',text,re.I)))
              nextids=list(dict.fromkeys(re.findall(r'<a href="[^"]*[?&]pagina=([0-9a-f]{24})[^"]*"[^>]*class="siguienteLink"',text,re.I)))
              prevs=list(dict.fromkeys(re.findall(r'<a href="[^"]*[?&]pagina=([0-9a-f]{24})[^"]*"[^>]*class="anteriorLink"',text,re.I)))
              count_m=re.search(r'\bde\s+([0-9]{1,4})\s*</form>',text,re.I)
              return {'status':status,'final_url':final,'bytes':len(body),'visible_date':visible,'pdf_ids':pdfids,'next_page_ids':nextids,'previous_page_ids':prevs,'page_count':int(count_m.group(1)) if count_m else None,'text':text}
          initial=request(start); init_text=initial.pop('text'); (out/'initial.html').write_text(init_text,encoding='utf-8')
          # The viewer markup proves that anioPS1/mesPS1/diaPS1 are element IDs only; submitted field names are anio/mes/dia.
          form_m=re.search(r'<form[^>]+name="formPaginaSup"[^>]*>(.*?)</form>',init_text,re.I|re.S)
          if not form_m: raise SystemExit('form identity gate failed: formPaginaSup not found')
          markup=re.sub(r'\s+',' ',form_m.group(0))
          required=['name="pagina"','name="anio"','name="mes"','name="dia"','name="butIr"']
          if any(x not in markup for x in required): raise SystemExit('form field gate failed: expected submitted field names not present')
          target={'coleccion':'','pagina':'1','anio':'1889','mes':'10','dia':'31','butIr':'Ir'}
          encoded=urllib.parse.urlencode(target).encode()
          trials=[]
          def trial(label,url,data=None,method=None):
              try:
                  r=request(url,data=data,method=method); text=r.pop('text'); (out/f'{label}.html').write_text(text,encoding='utf-8')
                  trials.append({'label':label,'method':method or ('POST' if data else 'GET'),'url':url,'fields':target,'result':r})
              except Exception as exc: trials.append({'label':label,'method':method or ('POST' if data else 'GET'),'url':url,'error':repr(exc)})
          trial('native-post',action,data=encoded,method='POST')
          trial('equivalent-get',action+'?'+urllib.parse.urlencode(target),method='GET')
          report={'initial':initial,'form_markup':markup,'target_fields':target,'cookies':[{'name':c.name,'domain':c.domain,'path':c.path} for c in jar],'trials':trials}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          hits=[t for t in trials if t.get('result',{}).get('visible_date')==target_date and t.get('result',{}).get('pdf_ids')]
          if not hits: raise SystemExit('exact selector gate failed: HNDM did not resolve 1889-10-31')
          hit=hits[0]['result']
          if hit.get('page_count') is not None and not (8 <= hit['page_count'] <= 32): raise SystemExit(f'implausible issue page count: {hit["page_count"]}')
          print('TARGET_HIT',json.dumps(hits[0],ensure_ascii=False))
      - name: Upload selector probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-la-escuela-moderna-1889-selector-probe-v2
          path: probe-selector/
          retention-days: 1
