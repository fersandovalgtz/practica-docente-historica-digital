name: Probe La Escuela Moderna 1889 issue selector

on:
  push:
    branches: [freeze-la-escuela-moderna-1889]
    paths:
      - ".github/workflows/probe-la-escuela-moderna-1889.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and submit HNDM issue selector
        shell: python
        run: |
          import html,json,pathlib,re,urllib.parse,urllib.request,http.cookiejar
          out=pathlib.Path('probe-selector'); out.mkdir()
          base='https://hndm.iib.unam.mx'
          serial='558075be7d1e63c9fea1a259'
          neighbor_page='558a33397d1ed64f16922d41'
          target_date='1889-10-31'
          start=f'{base}/consulta/publicacion/visualizar/{serial}?pagina={neighbor_page}&coleccion='
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'Accept-Language':'es-MX,es;q=0.9,en;q=0.7'
          }
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def fetch(url,data=None,method=None):
              h=dict(headers); h['Referer']=start
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              with opener.open(req,timeout=90) as r:
                  body=r.read(); final=r.geturl(); status=r.status
              text=html.unescape(body.decode('utf-8',errors='replace'))
              d=re.search(r'<dt>Fecha:</dt>\s*<dd>\s*([^<]+?)\s*</dd>',text,re.I|re.S)
              visible=re.sub(r'\s+',' ',d.group(1)).strip() if d else ''
              pdfids=list(dict.fromkeys(re.findall(r'/consulta/publicacion/pdf/([0-9a-f]{24})\.pdf',text,re.I)))
              pageqs=list(dict.fromkeys(re.findall(r'[?&]pagina=([0-9a-f]{24})',text,re.I)))
              return {'status':status,'final_url':final,'bytes':len(body),'visible_date':visible,'pdf_ids':pdfids,'page_ids':pageqs,'text':text}
          initial=fetch(start)
          (out/'initial.html').write_text(initial.pop('text'),encoding='utf-8')
          initial_text=(out/'initial.html').read_text(encoding='utf-8')
          # Capture forms whose markup contains the issue-selector fields.
          forms=[]
          for m in re.finditer(r'<form\b([^>]*)>(.*?)</form>',initial_text,re.I|re.S):
              attrs=m.group(1); body=m.group(2)
              if not any(k.lower() in body.lower() or k.lower() in attrs.lower() for k in ['anioPS1','mesPS1','diaPS1','butIr']):
                  continue
              action_m=re.search(r'\baction=["\']([^"\']*)',attrs,re.I)
              method_m=re.search(r'\bmethod=["\']([^"\']*)',attrs,re.I)
              action=html.unescape(action_m.group(1)) if action_m else ''
              method=(method_m.group(1) if method_m else 'GET').upper()
              fields={}
              for im in re.finditer(r'<input\b([^>]*)>',body,re.I|re.S):
                  a=im.group(1)
                  nm=re.search(r'\bname=["\']([^"\']+)',a,re.I)
                  if not nm: continue
                  vm=re.search(r'\bvalue=["\']([^"\']*)',a,re.I)
                  fields[nm.group(1)]=html.unescape(vm.group(1)) if vm else ''
              selects={}
              for sm in re.finditer(r'<select\b([^>]*)>(.*?)</select>',body,re.I|re.S):
                  a,sbody=sm.group(1),sm.group(2)
                  nm=re.search(r'\bname=["\']([^"\']+)',a,re.I)
                  if not nm: continue
                  selected=''
                  opts=[]
                  for om in re.finditer(r'<option\b([^>]*)>(.*?)</option>',sbody,re.I|re.S):
                      oa,ot=om.group(1),re.sub(r'<[^>]+>','',om.group(2)).strip()
                      vm=re.search(r'\bvalue=["\']([^"\']*)',oa,re.I)
                      val=html.unescape(vm.group(1)) if vm else html.unescape(ot)
                      opts.append(val)
                      if re.search(r'\bselected\b',oa,re.I): selected=val
                  selects[nm.group(1)]={'selected':selected,'options_sample':opts[:40]}
                  if selected: fields[nm.group(1)]=selected
              forms.append({'action':action,'method':method,'fields':fields,'selects':selects,'markup':re.sub(r'\s+',' ',m.group(0))[:12000]})
          if not forms:
              raise SystemExit('selector-form gate failed: no form with anioPS1/mesPS1/diaPS1/butIr found')
          form=forms[0]
          action=urllib.parse.urljoin(start,form['action'] or urllib.parse.urlparse(start).path)
          target_fields=dict(form['fields'])
          target_fields.update({'anioPS1':'1889','mesPS1':'10','diaPS1':'31','butIr':'Ir'})
          encoded=urllib.parse.urlencode(target_fields).encode()
          trials=[]
          def run_trial(label,url,data=None,method=None):
              try:
                  r=fetch(url,data=data,method=method)
                  text=r.pop('text'); (out/f'{label}.html').write_text(text,encoding='utf-8')
                  trials.append({'label':label,'request_url':url,'method':method or ('POST' if data else 'GET'),'request_fields':target_fields,'result':r})
              except Exception as exc:
                  trials.append({'label':label,'request_url':url,'method':method or ('POST' if data else 'GET'),'error':repr(exc)})
          # 1. Submit exactly according to discovered form method.
          if form['method']=='POST':
              run_trial('form-native-post',action,data=encoded,method='POST')
          else:
              run_trial('form-native-get',action+'?'+urllib.parse.urlencode(target_fields),method='GET')
          # 2. Probe the opposite method because legacy HNDM markup may rely on browser submission semantics.
          run_trial('form-get',action+'?'+urllib.parse.urlencode(target_fields),method='GET')
          run_trial('form-post',action,data=encoded,method='POST')
          # 3. Preserve the known viewer route and add selector fields explicitly.
          direct_fields={'pagina':neighbor_page,'coleccion':'','anioPS1':'1889','mesPS1':'10','diaPS1':'31','butIr':'Ir'}
          run_trial('viewer-get',f'{base}/consulta/publicacion/visualizar/{serial}?'+urllib.parse.urlencode(direct_fields),method='GET')
          report={'initial':initial,'cookies':[{'name':c.name,'domain':c.domain,'path':c.path} for c in jar], 'forms':forms,'trials':trials}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          hits=[t for t in trials if t.get('result',{}).get('visible_date')==target_date and t.get('result',{}).get('pdf_ids')]
          if not hits:
              raise SystemExit('selector submission gate failed: no trial resolved to 1889-10-31 with a primary PDF id')
          print('TARGET_HITS',json.dumps(hits,ensure_ascii=False))
      - name: Upload selector probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-la-escuela-moderna-1889-selector-probe
          path: probe-selector/
          retention-days: 1
