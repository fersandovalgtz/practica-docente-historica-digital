name: Probe Sistema Escuelas Rurales 1927 primary copies

on:
  push:
    branches: [freeze-sistema-escuelas-rurales-1927]
    paths:
      - ".github/workflows/probe-sistema-escuelas-rurales-1927.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Internet Archive and Google Books
        shell: python
        run: |
          import json, pathlib, urllib.parse, urllib.request
          out=pathlib.Path('sistema-rurales-probe'); out.mkdir()
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          report={}
          ia_queries={
            'exact':'title:("El sistema de escuelas rurales en Mexico")',
            'words':'title:(sistema escuelas rurales Mexico) AND year:[1926 TO 1928]',
            'sep':'creator:(Mexico) AND title:(escuelas rurales) AND year:[1926 TO 1928]',
          }
          for label,q in ia_queries.items():
            params=urllib.parse.urlencode({'q':q,'fl[]':['identifier','title','date','year','creator','description','identifier-access','identifier-ark','external-identifier'],'rows':50,'output':'json'},doseq=True)
            url='https://archive.org/advancedsearch.php?'+params
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: data=json.loads(r.read().decode())
              report['ia_'+label]={'numFound':data.get('response',{}).get('numFound'), 'docs':data.get('response',{}).get('docs',[])}
            except Exception as exc: report['ia_'+label]={'error':repr(exc)}
          gb_q='intitle:"El sistema de escuelas rurales en México" inauthor:"Secretaría de Educación Pública"'
          gb_url='https://www.googleapis.com/books/v1/volumes?'+urllib.parse.urlencode({'q':gb_q,'maxResults':40,'printType':'books'})
          try:
            req=urllib.request.Request(gb_url,headers=headers)
            with urllib.request.urlopen(req,timeout=60) as r: data=json.loads(r.read().decode())
            items=[]
            for item in data.get('items',[]):
              vi=item.get('volumeInfo',{}); ai=item.get('accessInfo',{})
              items.append({'id':item.get('id'),'title':vi.get('title'),'authors':vi.get('authors'),'publisher':vi.get('publisher'),'publishedDate':vi.get('publishedDate'),'pageCount':vi.get('pageCount'),'industryIdentifiers':vi.get('industryIdentifiers'),'viewability':ai.get('viewability'),'publicDomain':ai.get('publicDomain'),'pdf':ai.get('pdf'),'webReaderLink':ai.get('webReaderLink')})
            report['google_books']={'totalItems':data.get('totalItems'),'items':items}
          except Exception as exc: report['google_books']={'error':repr(exc)}
          (out/'probe-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))

      - name: Inspect Internet Archive candidate metadata
        shell: python
        run: |
          import json,pathlib,urllib.request
          out=pathlib.Path('sistema-rurales-probe')
          report=json.loads((out/'probe-report.json').read_text(encoding='utf-8'))
          ids=[]
          for key,val in report.items():
            if key.startswith('ia_'):
              for d in val.get('docs',[]):
                if d.get('identifier') and d['identifier'] not in ids: ids.append(d['identifier'])
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          meta={}
          for ident in ids[:20]:
            try:
              req=urllib.request.Request('https://archive.org/metadata/'+ident,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.loads(r.read().decode())
              files=[]
              for f in obj.get('files',[]):
                name=f.get('name',''); fmt=f.get('format','')
                if name.lower().endswith(('.pdf','.djvu','.txt','.xml')) or fmt in {'Text PDF','DjVu','DjVuTXT','Djvu XML','Single Page Processed JP2 ZIP'}:
                  files.append({'name':name,'format':fmt,'size':f.get('size'),'source':f.get('source')})
              meta[ident]={'metadata':obj.get('metadata',{}),'files':files}
            except Exception as exc: meta[ident]={'error':repr(exc)}
          (out/'ia-metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-sistema-rurales-1927-probe
          path: sistema-rurales-probe/
          retention-days: 1
