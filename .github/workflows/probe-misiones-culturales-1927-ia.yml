name: Probe Misiones Culturales 1927 Internet Archive source

on:
  push:
    branches: [freeze-misiones-culturales-1927]
    paths:
      - ".github/workflows/probe-misiones-culturales-1927-ia.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search Internet Archive catalog and ARK crosswalk
        shell: python
        run: |
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          out = pathlib.Path('misiones-1927-ia-probe')
          out.mkdir()
          headers = {'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}

          queries = {
              'title_exact': 'title:("Las misiones culturales en 1927")',
              'title_words': 'title:(misiones culturales) AND year:1928',
              'ark_identifier_access': 'identifier-access:("ark:/13960/t3dz33208")',
              'ark_external_identifier': 'external-identifier:("ark:/13960/t3dz33208")',
              'ark_all': '"ark:/13960/t3dz33208"',
              'sep_title': 'creator:("Secretaría de Educación Pública") AND title:(misiones culturales)',
          }
          report = {}
          for label,q in queries.items():
              params = urllib.parse.urlencode({
                  'q': q,
                  'fl[]': ['identifier','title','date','year','creator','description','identifier-access','external-identifier'],
                  'rows': 50,
                  'page': 1,
                  'output': 'json',
              }, doseq=True)
              url = 'https://archive.org/advancedsearch.php?' + params
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read()
                      status = r.status
                  parsed = json.loads(body.decode('utf-8', errors='replace'))
                  docs = parsed.get('response',{}).get('docs',[])
                  report[label] = {'status':status,'numFound':parsed.get('response',{}).get('numFound'), 'docs':docs}
                  (out/f'{label}.json').write_text(json.dumps(parsed,ensure_ascii=False,indent=2),encoding='utf-8')
              except Exception as exc:
                  report[label] = {'error':f'{type(exc).__name__}: {exc}'}
          (out/'probe-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))

      - name: Inspect candidate metadata and downloadable files
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request

          out = pathlib.Path('misiones-1927-ia-probe')
          report = json.loads((out/'probe-report.json').read_text(encoding='utf-8'))
          ids=[]
          for result in report.values():
              for doc in result.get('docs',[]):
                  ident=doc.get('identifier')
                  if ident and ident not in ids:
                      ids.append(ident)
          headers={'User-Agent':'Mozilla/5.0 PDHD-source-verification/0.1'}
          summary={}
          for ident in ids[:25]:
              try:
                  url=f'https://archive.org/metadata/{ident}'
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=60) as r:
                      meta=json.loads(r.read().decode('utf-8',errors='replace'))
                  files=[]
                  for f in meta.get('files',[]):
                      name=f.get('name','')
                      fmt=f.get('format','')
                      if name.lower().endswith(('.pdf','.djvu','.txt','.xml')) or fmt in {'Text PDF','DjVu','DjVuTXT','Djvu XML','Single Page Processed JP2 ZIP'}:
                          files.append({'name':name,'format':fmt,'size':f.get('size'),'source':f.get('source')})
                  summary[ident]={'metadata':meta.get('metadata',{}),'files':files[:100]}
                  (out/f'metadata-{ident.replace("/","_")}.json').write_text(json.dumps(summary[ident],ensure_ascii=False,indent=2),encoding='utf-8')
              except Exception as exc:
                  summary[ident]={'error':f'{type(exc).__name__}: {exc}'}
          (out/'candidate-metadata-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))

      - name: Upload one-day probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-misiones-1927-ia-probe
          path: misiones-1927-ia-probe/
          retention-days: 1
          if-no-files-found: error
