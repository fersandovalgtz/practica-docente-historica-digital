name: Probe Mexico Intelectual 1889 primary copies

on:
  push:
    branches: [freeze-mexico-intelectual-1889]
    paths:
      - ".github/workflows/probe-mexico-intelectual-1889.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover canonical D63 identity and HNDM alias
        shell: python
        run: |
          import csv,json,pathlib
          out=pathlib.Path('mexico-intelectual-probe'); out.mkdir()
          with open('data/catalog/documents_balancing_w1.csv',encoding='utf-8') as f:
              doc=next(r for r in csv.DictReader(f) if r['document_id']=='PDHD-D000063')
          with open('data/catalog/object_aliases.csv',encoding='utf-8') as f:
              aliases=[r for r in csv.DictReader(f) if r.get('document_id')=='PDHD-D000063']
          rows=[]
          for path in pathlib.Path('data/samples').glob('fragment_locator_progress*.csv'):
              with path.open(encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      if r.get('document_id')=='PDHD-D000063': rows.append({'file':str(path),**r})
          payload={'document':doc,'aliases':aliases,'locators':rows}
          (out/'identity.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))

      - name: Probe correct HNDM viewer and discover page ids
        shell: python
        run: |
          import html,json,pathlib,re,time,urllib.parse,urllib.request,urllib.error
          out=pathlib.Path('mexico-intelectual-probe')
          serial='558075be7d1e63c9fea1a356'
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'Accept-Language':'es-MX,es;q=0.9,en;q=0.7',
          }
          variants=[
            f'https://hndm.iib.unam.mx/consulta/publicacion/visualizar/{serial}?anio=1889&mes=01&dia=01&intPagina=1&tipo=publicacion',
            f'https://www.hndm.unam.mx/consulta/publicacion/visualizar/{serial}?anio=1889&mes=01&dia=01&intPagina=1&tipo=publicacion',
            f'https://hndm.unam.mx/consulta/publicacion/visualizar/{serial}?anio=1889&mes=01&dia=01&intPagina=1&tipo=publicacion',
            f'https://hndm.iib.unam.mx/consulta/publicacion/visualizar/{serial}?intPagina=1&tipo=publicacion&anio=1889&mes=01&dia=01&butIr=Ir',
          ]
          report=[]; all_text=[]
          for i,url in enumerate(variants,1):
              item={'url':url}
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=90) as r:
                      body=r.read(); ctype=r.headers.get('Content-Type','')
                  text=html.unescape(body.decode('utf-8',errors='replace'))
                  (out/f'viewer-{i}.html').write_text(text,encoding='utf-8')
                  item.update(status=200,bytes=len(body),content_type=ctype,title_hit=('México Intelectual' in text or 'Mexico Intelectual' in text),date_hit=('1889' in text))
                  ids=sorted(set(re.findall(r'(?:pagina=|["\']pagina["\']\s*[:=]\s*["\'])([0-9a-f]{24})',text,re.I)))
                  item['page_ids']=ids[:100]; item['page_id_count']=len(ids)
                  pdfs=sorted(set(re.findall(r'https?://[^"\'<>\s]+\.pdf(?:\?[^"\'<>\s]*)?',text,re.I)))
                  item['pdf_urls']=pdfs[:50]
                  all_text.append(text)
              except urllib.error.HTTPError as exc:
                  item.update(status=exc.code,content_type=exc.headers.get('Content-Type'),error='HTTPError')
              except Exception as exc: item['error']=repr(exc)
              report.append(item); time.sleep(1)
          joined='\n'.join(all_text)
          global_ids=sorted(set(re.findall(r'[0-9a-f]{24}',joined,re.I)))
          # Keep likely page IDs while retaining context snippets for audit.
          contexts=[]
          for pid in global_ids:
              pos=joined.find(pid)
              if pos>=0:
                  ctx=re.sub(r'\s+',' ',joined[max(0,pos-180):pos+220])
                  if 'pagina' in ctx.lower() or 'page' in ctx.lower(): contexts.append({'id':pid,'context':ctx})
          payload={'serial':serial,'variants':report,'candidate_page_contexts':contexts[:500]}
          (out/'viewer-probe.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))

      - name: Probe UNAM repository object for direct content routes
        shell: python
        run: |
          import html,json,pathlib,re,urllib.request,urllib.error
          out=pathlib.Path('mexico-intelectual-probe')
          url='https://repositorio.unam.mx/contenidos/ficha/mexico-intelectual-897145'
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9'}
          result={'url':url}
          try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=90) as r: body=r.read()
              text=html.unescape(body.decode('utf-8',errors='replace'))
              (out/'unam-ri.html').write_text(text,encoding='utf-8')
              links=sorted(set(re.findall(r'https?://[^"\'<>\s]+',text)))
              result.update(status=200,bytes=len(body),hndm_links=[x for x in links if 'hndm' in x.lower()][:100],pdf_links=[x for x in links if '.pdf' in x.lower()][:100])
          except urllib.error.HTTPError as exc: result.update(status=exc.code,error='HTTPError')
          except Exception as exc: result['error']=repr(exc)
          (out/'unam-ri-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-mexico-intelectual-1889-probe
          path: mexico-intelectual-probe/
          retention-days: 1
