name: Minimize D067 CSV diff

on:
  push:
    branches:
      - work/d067-primary-surrogate-20260907
    paths:
      - .github/workflows/minimize-d067-csv-diff.yml

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/d067-primary-surrogate-20260907
          fetch-depth: 0

      - name: Restore untouched CSV rows byte-for-byte from main
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def main_text(path):
              return subprocess.check_output(['git','show',f'origin/main:{path}']).decode('utf-8')

          def current_line(path, prefix):
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.startswith(prefix):
                      return line
              raise RuntimeError(f'missing {prefix} in {path}')

          # Catalog: preserve every main row verbatim except outgoing D067; append D076.
          path = 'data/catalog/documents_balancing_w1.csv'
          base = main_text(path).splitlines()
          d67 = current_line(path, 'PDHD-D000067,')
          d76 = current_line(path, 'PDHD-D000076,')
          out = []
          for line in base:
              out.append(d67 if line.startswith('PDHD-D000067,') else line)
          assert not any(line.startswith('PDHD-D000076,') for line in out)
          out.append(d76)
          Path(path).write_text('\n'.join(out) + '\n', encoding='utf-8')

          # Locator queue: preserve every untouched row verbatim, replace F61-F63, insert F64.
          path = 'data/samples/fragment_locator_progress_0_1.csv'
          base = main_text(path).splitlines()
          desired = {fid: current_line(path, fid + ',') for fid in [
              'PDHD-F000061','PDHD-F000062','PDHD-F000063','PDHD-F000064'
          ]}
          out = []
          for line in base:
              fid = line.split(',',1)[0]
              if fid in {'PDHD-F000061','PDHD-F000062','PDHD-F000063'}:
                  out.append(desired[fid])
                  if fid == 'PDHD-F000063':
                      out.append(desired['PDHD-F000064'])
              else:
                  out.append(line)
          Path(path).write_text('\n'.join(out) + '\n', encoding='utf-8')

          # Frozen registry: preserve main byte-level row formatting and add only the four new rows,
          # naturally after F60 and before the later frozen IDs.
          path = 'data/samples/frozen_fragments_0_1.csv'
          base = main_text(path).splitlines()
          desired = [current_line(path, fid + ',') for fid in [
              'PDHD-F000061','PDHD-F000062','PDHD-F000063','PDHD-F000064'
          ]]
          out = []
          inserted = False
          for line in base:
              out.append(line)
              if line.startswith('PDHD-F000060,'):
                  out.extend(desired)
                  inserted = True
          assert inserted
          Path(path).write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Validate minimized canonical diff
        run: |
          python scripts/validate_repository.py
          python scripts/validate_retrieval_attempts.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_status_counts.py
          python scripts/build_fragment_manifest.py --check
          git diff --check

      - name: Commit minimized CSV diff
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email 'fernando.sandoval@uacj.mx'
          git add data/catalog/documents_balancing_w1.csv data/samples/fragment_locator_progress_0_1.csv data/samples/frozen_fragments_0_1.csv
          git commit -m 'Minimize CSV churn in D067 substitution'
          git push origin HEAD:work/d067-primary-surrogate-20260907
