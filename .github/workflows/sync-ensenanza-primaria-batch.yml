name: Sync La Enseñanza Primaria batch status

on:
  push:
    branches:
      - freeze-ensenanza-primaria-1901-batch
    paths:
      - ".github/workflows/sync-ensenanza-primaria-batch.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-ensenanza-primaria-1901-batch

      - name: Synchronize controlled README markers
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          def once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}; found {count}')
              text = text.replace(old, new, 1)

          once('| Slots con localizador candidato/resuelto | **80 / 96** |', '| Slots con localizador candidato/resuelto | **82 / 96** |')
          once('| Fragmentos completamente congelados | **23 / 96** |', '| Fragmentos completamente congelados | **27 / 96** |')
          once('su unión contiene **80/96** slots', 'su unión contiene **82/96** slots')
          once('su unión contiene **23/96** fragmentos', 'su unión contiene **27/96** fragmentos')
          once('**80/96 slots tienen ya un localizador documentado.**', '**82/96 slots tienen ya un localizador documentado.**')
          once('**57 localizadores todavía no congelados**', '**55 localizadores todavía no congelados**')
          once('Quedan **16 slots sin localizador**', 'Quedan **14 slots sin localizador**')

          old = '''*La Enseñanza Primaria* incorpora ahora `PDHD-F000025`: una publicación de la Universidad Pedagógica Nacional proporciona la cita exacta de Ponciano Rodríguez, *El método en los libros de texto*, tomo I, núm. 11, pp. 167–168. La identidad del número y la fecha de 1 de diciembre de 1901 están respaldadas por investigación histórica independiente. El rango de páginas queda resuelto para el slot A, pero el pasaje permanece como `locator_candidate` hasta inspeccionar directamente la página histórica y fijar el span del codificador.\n\nEl mismo número incorpora `PDHD-F000027`: una tesis de la UNAM localiza Gregorio Torres Quintero, *Los ejercicios físicos en la escuela*, pp. 161–163. El rango resuelve el slot C como puntero secundario exacto sobre escolarización corporal y educación física; sigue pendiente el cotejo de la página histórica en HNDM antes del congelamiento.'''
          new = '''*La Enseñanza Primaria*, tomo I, núm. 11, del 1 de diciembre de 1901, aporta ahora un lote completo de cuatro fragmentos congelados. Un workflow de recuperación resolvió y descargó una copia primaria del volumen I en Google Books, mientras la identidad del número se mantiene cotejada de manera independiente con UNAM/HNDM. `PDHD-F000025` fija en la p. 168 una prescripción metodológica de Ponciano Rodríguez; `PDHD-F000026` fija en la p. 161 el cargo editorial de Gregorio Torres Quintero; `PDHD-F000027` fija en la p. 163 la conclusión del debate sobre ejercicios físicos, fatiga, reposo y trabajo intelectual; y `PDHD-F000028` usa el cartucho tomo/fecha/número de la p. 161 como control no analítico. La inspección primaria también elimina B y D de la cola de gaps. No se publican imágenes ni transcripciones históricas.'''
          once(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Self-remove and commit synchronized README
        run: |
          rm .github/workflows/sync-ensenanza-primaria-batch.yml
          git config user.name 'PDHD status sync'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md .github/workflows/sync-ensenanza-primaria-batch.yml
          git commit -m 'Synchronize README after 1901 complete batch'
          git push origin HEAD:freeze-ensenanza-primaria-1901-batch
