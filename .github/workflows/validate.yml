name: Validate PDHD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate public research data
        run: python scripts/validate_repository.py
      - name: Validate object alias crosswalk
        run: python scripts/validate_object_aliases.py
      - name: Validate unresolved pilot content leads
        run: python scripts/validate_content_leads.py
      - name: Validate structured retrieval attempts
        run: python scripts/validate_retrieval_attempts.py
      - name: Validate locator and frozen fragment shards
        run: python scripts/validate_fragment_shards.py
      - name: Validate direct-primary freeze-conversion queue
        run: python scripts/validate_freeze_conversion_queue.py
      - name: Check deterministic freeze-review preparation
        run: python scripts/prepare_freeze_review.py --check
      - name: Validate public pilot status counts
        run: python scripts/validate_status_counts.py
      - name: Self-test annotation agreement calculator
        run: python scripts/annotation_agreement.py --self-test
      - name: Check fixed-fragment manifest generator
        run: python scripts/build_fragment_manifest.py --check
      - name: Check deterministic human calibration package
        run: python scripts/build_calibration_package.py --check
      - name: Validate calibration blinding and codebook provenance
        run: python scripts/validate_calibration_package.py
      - name: Check pre-registered 84-fragment reliability reserve
        run: python scripts/build_reliability_reserve.py --check
      - name: Assert formal reliability human gate state
        run: python scripts/build_formal_reliability_package.py --check-state
      - name: Self-test formal reliability gate
        run: python scripts/build_formal_reliability_package.py --self-test
      - name: Self-test blind coder-copy generator
        run: python scripts/prepare_calibration_coder_copy.py --self-test
      - name: Self-test completed calibration sheet validator
        run: python scripts/validate_completed_calibration_sheet.py --self-test
      - name: Self-test calibration disagreement comparator
        run: python scripts/compare_calibration_sheets.py --self-test
      - name: Validate FAIR metadata and pre-validation snapshot
        run: python scripts/validate_project_metadata.py
      - name: Validate schema and lifecycle separation
        run: python scripts/validate_schema_alignment.py
      - name: Validate public dashboard safety boundary
        run: python scripts/validate_public_dashboard.py
      - name: Self-test non-blocking source-link classifier
        run: python scripts/audit_source_links.py --self-test
      - name: Check leakage-aware machine input gate
        run: python scripts/build_machine_input_manifest.py --check-state
      - name: Validate machine-candidate quarantine
        run: python scripts/validate_machine_candidates.py
      - name: Self-test machine-candidate validator
        run: python scripts/validate_machine_candidates.py --self-test
      - name: Assert phase-5 human-gold gate remains closed
        run: python scripts/run_phase5_analysis.py --expect-closed
      - name: Self-test phase-5 analysis engine
        run: python scripts/run_phase5_analysis.py --self-test
      - name: Validate repository governance and supply-chain hygiene
        run: python scripts/validate_repository_hygiene.py
