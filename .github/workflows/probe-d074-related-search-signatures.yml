name: Probe D074 related-volume search signatures

on:
  push:
    branches: [work/d074-canonical-page-recovery]
    paths: [.github/workflows/probe-d074-related-search-signatures.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare SearchWithinVolume2 signatures across related copies
        shell: python
        run: |
          import json, pathlib, urllib.parse, urllib.request, urllib.error

          canonical='KRV2_jMW8-wC'
          related=['03wQAAAAYAAJ','1HsQAAAAYAAJ','3X8QAAAAYAAJ','7OdDbshzWaUC','InoQAAAAYAAJ','KH0QAAAAYAAJ','N3wQAAAAYAAJ','X3oQAAAAYAAJ','Xd0U5ozjxNgC','e3wQAAAAYAAJ']
          queries={
            'period_1936':'septiembre de 1936',
            'period_1937':'agosto de 1937',
            'A_integral':'educación integral del alumno',
            'A_manual':'trabajo manual',
            'B_consejo':'Consejo Nacional de la Educación Superior y la Investigación Científica',
            'D_becas':'distribución de becas',
            'C_bibliotecas':'bibliotecas',
          }
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-MX,es;q=0.9,en;q=0.8'}
          out=pathlib.Path('d074-related-search-signatures'); out.mkdir(exist_ok=True)

          def fetch(url):
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=90) as r:
                return r.status,r.read()
            except urllib.error.HTTPError as e:
              return e.code,e.read()
            except Exception as e:
              return None,str(e).encode()

          report={}
          for vid in [canonical]+related:
            row={}
            for label,q in queries.items():
              url='https://books.google.com/books?'+urllib.parse.urlencode({'id':vid,'jscmd':'SearchWithinVolume2','q':q})
              st,body=fetch(url)
              rec={'status':st,'bytes':len(body),'results':[]}
              try:
                data=json.loads(body.decode('utf-8'))
                rec['number_of_results']=data.get('number_of_results')
                rec['searchable']=data.get('searchable')
                for x in (data.get('search_results') or [])[:5]:
                  if isinstance(x,dict):
                    rec['results'].append({k:x.get(k) for k in ['page_id','page_number','snippet_text']})
              except Exception as e:
                rec['error']=f'{type(e).__name__}: {e}'
              row[label]=rec
            report[vid]=row
            sig={k:[(x.get('page_id'),x.get('page_number')) for x in v['results']] for k,v in row.items()}
            print('\nVOLUME',vid,json.dumps(sig,ensure_ascii=False,indent=2))
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Upload one-day report
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-d074-related-search-signatures
          path: d074-related-search-signatures/
          retention-days: 1
          if-no-files-found: error
