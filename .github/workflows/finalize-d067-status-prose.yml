name: Finalize D067 status prose

on:
  push:
    branches:
      - work/d067-primary-surrogate-20260907
    paths:
      - .github/workflows/finalize-d067-status-prose.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/d067-primary-surrogate-20260907
          fetch-depth: 0
      - name: Correct residual status prose
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Corte de referencia: **6 de septiembre de 2026**.', 'Corte de referencia: **7 de septiembre de 2026**.')
          old = 'El umbral operativo 80/96 ya fue alcanzado; el siguiente escalón cuantitativo de seguimiento será **95/96**, pero el indicador científicamente más importante es aumentar los fragmentos `frozen`, no maximizar referencias débiles.'
          new = 'El gate cuantitativo de localización está completo en **96/96**; el indicador científicamente más importante es ahora aumentar los fragmentos `frozen`, no maximizar ni conservar referencias débiles.'
          assert old in text
          readme.write_text(text.replace(old, new), encoding='utf-8')

          cohort = root / 'docs' / 'PDHD_U1_COHORT_STATUS.md'
          text = cohort.read_text(encoding='utf-8')
          text = text.replace('## Remaining localization work', '## Remaining freeze-conversion work')
          old = 'With `PDHD-D000003`, `PDHD-D000011` and `PDHD-D000031` complete, the next high-value work should target clusters where one primary-object recovery can resolve multiple slots. Strong candidates include page-resolved *El Maestro* and *La Escuela Moderna* fragments, plus the remaining clustered gaps in *El Periquito* and the remaining primary-image conversions in the 1932 and 1937 SEP memory clusters.'
          new = 'With the localization gate complete, the remaining eight non-frozen pilot fragments are concentrated in `PDHD-D000072` and `PDHD-D000074`, four slots in each SEP memory. The next high-value work is therefore direct primary-image recovery for those two clustered objects, where one successful identity-gated retrieval can convert an entire A–D batch.'
          assert old in text
          cohort.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Validate status and diff
        run: |
          python scripts/validate_status_counts.py
          python scripts/validate_fragment_shards.py
          git diff --check
      - name: Commit prose cleanup
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email 'fernando.sandoval@uacj.mx'
          git add README.md docs/PDHD_U1_COHORT_STATUS.md
          git commit -m 'Align status prose with completed localization gate'
          git push origin HEAD:work/d067-primary-surrogate-20260907
