name: Finalize Proyecto Misiones Federales 1923 batch

on:
  push:
    branches: [freeze-proyecto-misiones-federales-1923]
    paths:
      - ".github/workflows/finalize-proyecto-misiones-federales-1923.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-proyecto-misiones-federales-1923

      - name: Freeze F73-F76 from primary Google Books inspection
        shell: python
        run: |
          import csv, io, pathlib

          loc_path=pathlib.Path('data/samples/fragment_locator_progress_0_1.csv')
          frozen_path=pathlib.Path('data/samples/frozen_fragments_0_1.csv')

          loc_fields=['fragment_id','document_id','slot','page','source_locator','locator_evidence_url','boundary_status','public_text_status','freeze_status','preparation_note','checked_at']
          frozen_fields=['fragment_id','document_id','slot','page','source_locator','locator_evidence_url','boundary_definition','transcription_status','access_basis','public_text_status','selection_role','freeze_status','preparation_note','checked_at']

          loc_rows={
            'PDHD-F000073': ['PDHD-F000073','PDHD-D000070','A','24','p24-accion-social-pueblos-vecinos-excursiones-intercambio-lectura','https://books.google.com/books?id=glW6HEb46VoC&pg=PA24','fixed','metadata_only','frozen','Direct primary Google Books PDF inspection confirms printed p. 24 / physical PDF page 27. The fixed span is ACCION SOCIAL SOBRE LOS PUEBLOS VECINOS, from the heading through the sentence prescribing weekly newspaper reading; it includes excursions, school and workshop visits, collections, sports, exchange of school work/books/seeds/plants/animals, and stops before ACCION ECONOMICA. The earlier UNAM facsimile pointer is superseded by direct inspection of the Google-digitized primary object cross-walked from HathiTrust OCLC 16016036.','2026-09-06'],
            'PDHD-F000074': ['PDHD-F000074','PDHD-D000070','B','25','p25-maestro-misionero-amor-actividad-inteligencia','https://books.google.com/books?id=glW6HEb46VoC&pg=PA25','fixed','metadata_only','frozen','Direct primary inspection confirms printed p. 25 / physical PDF page 28. The fixed professional-identity span is the single paragraph under EL MAESTRO MISIONERO, ending with the triad AMOR, ACTIVIDAD e INTELIGENCIA; exclude the preceding UNA ESCUELA DE CULTURA INDIGENA block and the following LA HUMANIDAD section.','2026-09-06'],
            'PDHD-F000075': ['PDHD-F000075','PDHD-D000070','C','23','p23-razas-indigenas-diagnostic-classification','https://books.google.com/books?id=glW6HEb46VoC&pg=PA23','fixed','metadata_only','frozen','Direct primary inspection confirms printed p. 23 / physical PDF page 26. The source-critical span is LAS RAZAS INDIGENAS from its heading through the final sentence on economic condition and means proposed for improvement; exclude the preceding GEOGRAFIA DE LA REGION block and stop before LA ESCUELA. The unit preserves the official classificatory and diagnostic vocabulary as historical evidence rather than neutral description.','2026-09-06'],
            'PDHD-F000076': ['PDHD-F000076','PDHD-D000070','D','PA1','pa1-title-page-bibliographic-control','https://books.google.com/books?id=glW6HEb46VoC&pg=PA1','fixed','metadata_only','frozen','Direct primary inspection replaces the earlier p. 22 roster candidate with a cleaner bibliographic control. Google Books PA1 is order 2 and maps to physical PDF page 4. Fix only the textual title-page core identifying Cámara de Diputados al Congreso de la Unión / Primera Comisión de Educación Pública, the project title, José Gálvez, México D.F., Imprenta de la Cámara de Diputados and 1923; exclude handwritten accession marks, emblem, margins and Google watermark.','2026-09-06'],
          }

          def csv_line(fields,row):
              s=io.StringIO(newline='')
              w=csv.writer(s,lineterminator='\n')
              w.writerow(row)
              return s.getvalue()

          lines=loc_path.read_text(encoding='utf-8').splitlines(keepends=True)
          seen=set()
          out=[]
          for line in lines:
              fid=line.split(',',1)[0]
              if fid in loc_rows:
                  out.append(csv_line(loc_fields,loc_rows[fid]))
                  seen.add(fid)
              else:
                  out.append(line)
          missing=set(loc_rows)-seen
          if missing: raise SystemExit(f'locator rows missing: {sorted(missing)}')
          loc_path.write_text(''.join(out),encoding='utf-8',newline='')

          frozen_rows=[
            ['PDHD-F000073','PDHD-D000070','A','24','p24-accion-social-pueblos-vecinos-excursiones-intercambio-lectura','https://books.google.com/books?id=glW6HEb46VoC&pg=PA24','Printed p. 24: section ACCION SOCIAL SOBRE LOS PUEBLOS VECINOS, from the heading through the sentence prescribing weekly newspaper reading to learn notable events in the world; include the contiguous excursions, school/workshop/cultivation-field visits, nature collections, sports contests and inter-school exchanges; stop before ACCION ECONOMICA.','not_transcribed','Google_Books_direct_primary_pdf_image_inspection','metadata_only','explicit_pedagogical_act','frozen','HathiTrust record 102280931 identifies the 1923 José Gálvez pamphlet, OCLC 16016036, University of California item uc1.a0009571225 and records Google as digitization source. The OCLC deterministically resolves to Google Books glW6HEb46VoC, whose public page HTML exposes a live 2.13 MB PDF. PA24 is order 25 and the downloaded PDF maps it to physical page 27. Direct visual inspection confirms the span and independently cross-checks the earlier UNAM reproduced facsimile. No source text or image is committed.','2026-09-06'],
            ['PDHD-F000074','PDHD-D000070','B','25','p25-maestro-misionero-amor-actividad-inteligencia','https://books.google.com/books?id=glW6HEb46VoC&pg=PA25','Printed p. 25: the complete paragraph under EL MAESTRO MISIONERO, from the heading through the sentence defining the work in terms of AMOR, ACTIVIDAD and INTELIGENCIA; exclude the preceding UNA ESCUELA DE CULTURA INDIGENA passage and stop before LA HUMANIDAD.','not_transcribed','Google_Books_direct_primary_pdf_image_inspection','metadata_only','institutional_relation','frozen','Google Books PA25 is order 26 and maps to physical PDF page 28. Direct visual inspection fixes a compact normative representation of the missionary teacher as the slot-B professional-identity unit. No historical transcription or source image is committed.','2026-09-06'],
            ['PDHD-F000075','PDHD-D000070','C','23','p23-razas-indigenas-diagnostic-classification','https://books.google.com/books?id=glW6HEb46VoC&pg=PA23','Printed p. 23: block LAS RAZAS INDIGENAS, from its heading through the closing sentence on general economic condition and proposed means of improvement; exclude the preceding GEOGRAFIA DE LA REGION block and the following LA ESCUELA block.','not_transcribed','Google_Books_direct_primary_pdf_image_inspection','metadata_only','source_criticism_salient','frozen','Google Books PA23 is order 24 and maps to physical PDF page 26. Direct visual inspection preserves the official diagnostic scheme as a source-critical unit because it combines racial, linguistic, hygienic, moral, demographic and economic categories. These categories are evidence about the state gaze of the source and are not adopted as neutral present-day descriptions. No source text or image is committed.','2026-09-06'],
            ['PDHD-F000076','PDHD-D000070','D','PA1','pa1-title-page-bibliographic-control','https://books.google.com/books?id=glW6HEb46VoC&pg=PA1','Google Books PA1 / physical PDF page 4: textual bibliographic title-page core identifying Cámara de Diputados al Congreso de la Unión, Primera Comisión de Educación Pública, the project title, José Gálvez, México D.F., Imprenta de la Cámara de Diputados and 1923; exclude handwritten accession marks, emblem, blank margins and Google digitization watermark.','not_transcribed','Google_Books_direct_primary_pdf_image_inspection','metadata_only','control','frozen','PA1 is order 2 in the Google Books page index and maps to physical PDF page 4 after the downloaded PDF introduction. Direct visual inspection replaces the prior p. 22 personnel-roster candidate with a deliberately lower-pedagogical-content bibliographic control. No source image is committed.','2026-09-06'],
          ]
          existing=frozen_path.read_text(encoding='utf-8')
          for row in frozen_rows:
              if row[0] in existing: raise SystemExit(f'{row[0]} already present in frozen file')
          with frozen_path.open('a',encoding='utf-8',newline='') as f:
              w=csv.writer(f,lineterminator='\n')
              w.writerows(frozen_rows)

      - name: Synchronize status documentation
        shell: python
        run: |
          from pathlib import Path

          readme=Path('README.md')
          s=readme.read_text(encoding='utf-8')
          s=s.replace('| Fragmentos completamente congelados | **53 / 96** |','| Fragmentos completamente congelados | **57 / 96** |')
          s=s.replace('su unión contiene **53/96** fragmentos.','su unión contiene **57/96** fragmentos.')
          s=s.replace('los **30 localizadores todavía no congelados**','los **26 localizadores todavía no congelados**')
          s=s.replace('Los **53/96** congelados demuestran','Los **57/96** congelados demuestran')
          marker='Como HNDM permanece `metadata_only`'
          paragraph='`PDHD-D000070`, *Proyecto para la organización de las misiones federales de educación* (1923), completa ahora A–D desde Google Books `glW6HEb46VoC`. HathiTrust Record 102280931 identifica el ejemplar de University of California `uc1.a0009571225`, OCLC 16016036, y registra a Google como fuente de digitalización; ese OCLC resuelve al mismo objeto Google Books, cuyo HTML público expone el PDF completo. La inspección directa fija `PDHD-F000073` en p. 24 para acciones sociales y escolares sobre pueblos vecinos; `PDHD-F000074` en p. 25 para la representación normativa del Maestro Misionero; `PDHD-F000075` en p. 23 como unidad de crítica de fuentes sobre el esquema oficial de clasificación y diagnóstico de las razas indígenas; y `PDHD-F000076` sustituye el antiguo roster de p. 22 por `PA1`, una portada bibliográfica limpia como control. El facsímil reproducido por UNAM queda confirmado como pista de recuperación, pero el freeze se sustenta en el objeto primario inspeccionado.\n\n'
          if paragraph not in s:
              if marker not in s: raise SystemExit('README insertion marker missing')
              s=s.replace(marker,paragraph+marker)
          readme.write_text(s,encoding='utf-8')

          cohort=Path('docs/PDHD_U1_COHORT_STATUS.md')
          c=cohort.read_text(encoding='utf-8')
          c=c.replace('| Fully frozen fragments | **53 / 96** |','| Fully frozen fragments | **57 / 96** |')
          c=c.replace('Fifty-three units have crossed the stronger frozen-fragment gate.','Fifty-seven units have crossed the stronger frozen-fragment gate.')
          c=c.replace('Twelve selected documents now have complete four-slot batches.','Thirteen selected documents now have complete four-slot batches.')
          c=c.replace('Fifty-three are frozen. The remaining **30** located rows','Fifty-seven are frozen. The remaining **26** located rows')
          c=c.replace('The current 53 frozen units demonstrate','The current 57 frozen units demonstrate')
          c=c.replace('**53/96 frozen**','**57/96 frozen**')
          c=c.replace('**53 / 96**','**57 / 96**')
          c=c.replace('**30** located rows','**26** located rows')
          marker='All third-party image-derived frozen records remain conservative in public handling.'
          paragraph='`PDHD-D000070`, *Proyecto para la organización de las misiones federales de educación* (1923), now contributes a complete A–D batch after a HathiTrust-to-Google crosswalk resolved the primary object. HathiTrust Record 102280931 identifies OCLC 16016036 and item `uc1.a0009571225`, while its MARC provenance records Google as the digitization source. The OCLC resolves to Google Books `glW6HEb46VoC`, whose public HTML exposes a complete 33-image / 2.13 MB PDF. Direct inspection maps printed pp. 23, 24 and 25 to physical PDF pages 26, 27 and 28; `PA1` maps to physical page 4. The batch freezes a mission-action prescription, a missionary-teacher professional identity paragraph, a source-critical diagnostic/classificatory block, and a bibliographic control. The earlier UNAM embedded facsimile is thereby independently confirmed but is not itself used as the final freeze basis.\n\n'
          if paragraph not in c:
              if marker not in c: raise SystemExit('cohort insertion marker missing')
              c=c.replace(marker,paragraph+marker)
          cohort.write_text(c,encoding='utf-8')

      - name: Run validators
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          python scripts/validate_fragment_shards.py
          python scripts/validate_status_counts.py

      - name: Commit primary batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fernando Sandoval"
          git config user.email "fernando.sandoval@uacj.mx"
          git add README.md data/samples/fragment_locator_progress_0_1.csv data/samples/frozen_fragments_0_1.csv docs/PDHD_U1_COHORT_STATUS.md
          git commit -m "Freeze primary Proyecto misiones federales 1923 batch"
          git push origin HEAD:freeze-proyecto-misiones-federales-1923
