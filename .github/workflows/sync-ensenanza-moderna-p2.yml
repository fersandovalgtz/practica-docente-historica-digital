name: Sync La Enseñanza Moderna p2 status

on:
  push:
    branches:
      - freeze-ensenanza-moderna-p2
    paths:
      - ".github/workflows/sync-ensenanza-moderna-p2.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-ensenanza-moderna-p2

      - name: Synchronize controlled status surfaces
        shell: python
        run: |
          from pathlib import Path

          def update(path_name, replacements):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_name}: expected one occurrence of {old!r}; found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          update('README.md', [
              ('| Slots con localizador candidato/resuelto | **82 / 96** |', '| Slots con localizador candidato/resuelto | **83 / 96** |'),
              ('| Fragmentos completamente congelados | **28 / 96** |', '| Fragmentos completamente congelados | **29 / 96** |'),
              ('su unión contiene **82/96** slots', 'su unión contiene **83/96** slots'),
              ('su unión contiene **28/96** fragmentos', 'su unión contiene **29/96** fragmentos'),
              ('**82/96 slots tienen ya un localizador documentado.**', '**83/96 slots tienen ya un localizador documentado.**'),
              ('Quedan **14 slots sin localizador**', 'Quedan **13 slots sin localizador**'),
              ('''A esos doce fragmentos se suman tres unidades directamente inspeccionadas de *La Enseñanza Moderna*, tomo I, segunda época, núm. 1, del 1 de julio de 1907: `PDHD-F000038`–`PDHD-F000040`. La imagen primaria de BVMC permite fijar el bloque editorial/profesional, la región programática de apertura y un bloque administrativo de control. El slot A de ese documento (`PDHD-F000037`) sigue pendiente porque todavía no se ha inspeccionado un pasaje de acto pedagógico explícito con resolución suficiente.''', '''*La Enseñanza Moderna*, tomo I, segunda época, núm. 1, del 1 de julio de 1907, tiene ya sus cuatro slots congelados. `PDHD-F000037` fija en la p. 2 un párrafo autónomo de *Cómo debe entenderse el método en pedagogía* que prescribe para la enseñanza de los niños dirección exterior, comunicación de conocimientos ya sabidos y uso detallado de la investigación. `PDHD-F000038`–`PDHD-F000040` conservan el bloque editorial/profesional, la región programática de apertura y el control administrativo de la primera página. El PDF primario exacto de BVMC fue recuperado y sus nueve páginas fueron renderizadas antes de fijar el nuevo span.'''),
              ('''El número inaugural de *La Enseñanza Normal*, 15 de septiembre de 1904, aporta ahora tres unidades congeladas desde el PDF primario de BVMC. `PDHD-F000034` fija el bloque profesional/editorial de primera página y `PDHD-F000036` fija la línea autónoma de periodicidad como control administrativo. `PDHD-F000033` fija en la p. 12 un párrafo de *Conferencias Pedagógicas* de Leopoldo Kiel que prescribe práctica sostenida con grupos de niños, observación, experimentación y comprobación de los procedimientos de enseñanza. La página histórica fue recuperada e inspeccionada directamente antes de fijar el span.''', '''El número inaugural de *La Enseñanza Normal*, 15 de septiembre de 1904, aporta un lote completo de cuatro unidades congeladas desde el PDF primario de BVMC. `PDHD-F000033` fija en la p. 12 la prescripción pedagógica de Leopoldo Kiel; `PDHD-F000034` fija el bloque profesional/editorial de primera página; `PDHD-F000035` fija en la p. 4 la apertura político-educativa de *15 de Septiembre — Fecha grata*; y `PDHD-F000036` fija la línea autónoma de periodicidad como control administrativo. Cada span fue delimitado después de inspeccionar directamente la página histórica.''')
          ])

          update('docs/PDHD_U1_COHORT_STATUS.md', [
              ('| Fragment locator rows resolved/candidate | **82 / 96** | 85.4% of reliability slots localized |', '| Fragment locator rows resolved/candidate | **83 / 96** | 86.5% of reliability slots localized |'),
              ('| Fully frozen fragments | **28 / 96** | page-resolved conversion phase active |', '| Fully frozen fragments | **29 / 96** | page-resolved conversion phase active |'),
              ('PDHD-U1 now has **82 of the 96 deterministic reliability slots** tied to a documented page, scan or section target. Twenty-eight units have crossed the stronger frozen-fragment gate.', 'PDHD-U1 now has **83 of the 96 deterministic reliability slots** tied to a documented page, scan or section target. Twenty-nine units have crossed the stronger frozen-fragment gate.'),
              ('Four selected documents now have complete four-slot batches.', 'Six selected documents now have complete four-slot batches.'),
              ('''`PDHD-D000031`, *La Enseñanza Moderna*, tomo I, segunda época, núm. 1, contributes three frozen units from direct BVMC image inspection: `PDHD-F000038`–`PDHD-F000040`.''', '''`PDHD-D000031`, *La Enseñanza Moderna*, tomo I, segunda época, núm. 1, now contributes a complete four-slot batch. `PDHD-F000037` fixes a single autonomous teaching-prescription paragraph on printed p. 2 inside *Cómo debe entenderse el método en pedagogía*. The exact nine-page BVMC PDF was recovered through an isolated Actions run and inspected directly. `PDHD-F000038`–`PDHD-F000040` retain the professional/editorial, programmatic source-critical and administrative-control regions on p. 1.'''),
              ('The union of all `fragment_locator_progress*.csv` shards contains **82/96** pilot slots. Twenty-eight are frozen. The remaining **54** located rows', 'The union of all `fragment_locator_progress*.csv` shards contains **83/96** pilot slots. Twenty-nine are frozen. The remaining **54** located rows'),
              ('**14 slots remain without a locator.**', '**13 slots remain without a locator.**'),
              ('''With `PDHD-D000003` and `PDHD-D000011` complete, the strongest near-term single-slot completion target is `PDHD-F000037` inside the exact BVMC *La Enseñanza Moderna* issue. Other high-value candidates include page-resolved *El Maestro*, *México Intelectual* and *La Escuela Moderna* fragments whose primary objects are already identified.''', '''With `PDHD-D000003`, `PDHD-D000011` and `PDHD-D000031` complete, the next priority shifts from single-slot BVMC completion to higher-yield unresolved batches. Strong candidates include `PDHD-D000058` (*La Escuela Moderna*), `PDHD-D000006` (*Revista de Instrucción Pública Mexicana*) and page-resolved *El Maestro* or *México Intelectual* fragments whose primary objects are already identified.'''),
              ('`PDHD-RA000012` records the p. 4 BVMC primary inspection that completes `PDHD-D000011`.', '`PDHD-RA000012` records the p. 4 BVMC primary inspection that completes `PDHD-D000011`. `PDHD-RA000001` now records the successful recovery of the exact *La Enseñanza Moderna* PDF and the p. 2 inspection that completes `PDHD-D000031`.'),
              ('The current 28 frozen units demonstrate', 'The current 29 frozen units demonstrate'),
              ('The project is now at **82/96 localized** and **28/96 frozen**.', 'The project is now at **83/96 localized** and **29/96 frozen**.'),
              ('reduced the unlocalized complement from 16 to 14', 'reduced the unlocalized complement from 16 to 13')
          ])

          update('docs/FREEZE_CONVERSION_SPRINT_0_1.md', [
              ('PDHD-U1 is now at **82/96 localized slots** and **28/96 frozen**.', 'PDHD-U1 is now at **83/96 localized slots** and **29/96 frozen**.'),
              ('''## Evidence policy retained''', '''## Fourth post-sprint conversion — complete La Enseñanza Moderna batch\n\nAn isolated recovery run downloaded the exact nine-page BVMC PDF for *La Enseñanza Moderna*, tomo I, segunda época, núm. 1, 1 July 1907, clearing the earlier delivery blocker recorded in `PDHD-RA000001`. Direct inspection of printed p. 2 identifies a single autonomous paragraph inside *Cómo debe entenderse el método en pedagogía* that explicitly addresses teaching children, external direction, communication of already known truths and use of investigation. The span ends before the following paragraph returns to defining didactics.\n\n`PDHD-F000037` is frozen on that paragraph as slot A, while `PDHD-F000038`–`PDHD-F000040` retain the three p. 1 spans already fixed. This completes `PDHD-D000031` at 4/4 and removes `PDHD-F000037` from the gap queue.\n\n## Evidence policy retained'''),
              ('The project moves **15/96 -> 17/96 -> 19/96 -> 21/96 -> 22/96 -> 23/96 -> 27/96 -> 28/96 frozen**.', 'The project moves **15/96 -> 17/96 -> 19/96 -> 21/96 -> 22/96 -> 23/96 -> 27/96 -> 28/96 -> 29/96 frozen**.'),
              ('Localization moves from **80/96 to 82/96** because primary inspection of the *La Enseñanza Primaria* masthead resolves two previously missing deterministic slots. Localized-but-not-frozen slots are now **54**, and **14** slots remain without a locator.', 'Localization moves from **80/96 to 83/96**: two new slots came from the *La Enseñanza Primaria* masthead and `PDHD-F000037` moves directly from gap to frozen after primary inspection. Localized-but-not-frozen slots remain **54**, and **13** slots remain without a locator.'),
              ('''The next scientific priority is the comparable single-slot completion opportunity `PDHD-F000037` in the exact *La Enseñanza Moderna* BVMC issue. After that, page-resolved *El Maestro*, *México Intelectual* and *La Escuela Moderna* targets should be prioritized by primary-object tractability and expected batch completion value.''', '''The next scientific priority shifts to higher-yield incomplete documents. `PDHD-D000058` (*La Escuela Moderna*) and `PDHD-D000006` (*Revista de Instrucción Pública Mexicana*) each combine an identified primary object with multiple unresolved deterministic slots; page-resolved *El Maestro* and *México Intelectual* targets remain secondary priorities according to retrieval tractability and batch-completion value.''')
          ])

      - name: Self-remove and commit synchronized status
        run: |
          rm .github/workflows/sync-ensenanza-moderna-p2.yml
          git config user.name 'PDHD status sync'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md docs/PDHD_U1_COHORT_STATUS.md docs/FREEZE_CONVERSION_SPRINT_0_1.md .github/workflows/sync-ensenanza-moderna-p2.yml
          git commit -m 'Synchronize status after La Enseñanza Moderna completion'
          git push origin HEAD:freeze-ensenanza-moderna-p2
