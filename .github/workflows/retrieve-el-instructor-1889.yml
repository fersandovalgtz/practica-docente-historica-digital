name: Retrieve El Instructor 1889 primary issue

on:
  push:
    branches: [freeze-el-instructor-1889]
    paths:
      - ".github/workflows/retrieve-el-instructor-1889.yml"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Traverse exact HNDM issue by persistent page id
        shell: python
        run: |
          import csv,html,json,pathlib,re,time,urllib.parse,urllib.request,urllib.error
          out=pathlib.Path('el-instructor-primary'); out.mkdir()
          serial='558075be7d1e63c9fea1a307'
          base='https://hndm.iib.unam.mx'
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'Accept-Language':'es-MX,es;q=0.9,en;q=0.7',
          }
          # Preserve pre-retrieval canonical state for F5-F8.
          state=[]
          for path in sorted(pathlib.Path('data/samples').glob('fragment_locator_progress*.csv')):
              with path.open(encoding='utf-8',newline='') as f:
                  for row in csv.DictReader(f):
                      if row.get('fragment_id') in {'PDHD-F000005','PDHD-F000006','PDHD-F000007','PDHD-F000008'}:
                          state.append({'shard':path.name,**row})
          gap=[]
          gp=pathlib.Path('data/samples/fragment_gap_queue_0_1.csv')
          with gp.open(encoding='utf-8',newline='') as f:
              gap=[r for r in csv.DictReader(f) if r.get('fragment_id') in {'PDHD-F000005','PDHD-F000006','PDHD-F000007','PDHD-F000008'}]
          (out/'prior-state.json').write_text(json.dumps({'locators':state,'gaps':gap},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'locators':state,'gaps':gap},ensure_ascii=False,indent=2))

          current_url=f'{base}/consulta/publicacion/visualizar/{serial}?anio=1889&mes=01&dia=01&intPagina=1&tipo=publicacion'
          mapping=[]; seen=set()
          for seq in range(1,81):
              item={'sequence':seq,'viewer_url':current_url}
              try:
                  req=urllib.request.Request(current_url,headers=headers)
                  with urllib.request.urlopen(req,timeout=90) as r: body=r.read()
                  text=html.unescape(body.decode('utf-8',errors='replace'))
                  pdfids=list(dict.fromkeys(re.findall(r'/consulta/publicacion/pdf/([0-9a-f]{24})\.pdf',text,re.I)))
                  item.update(status=200,bytes=len(body),title_hit=('El Instructor' in text),pdf_ids=pdfids)
                  if not pdfids:
                      item['error']='no_current_pdf_id'; mapping.append(item); break
                  pid=pdfids[0]; item['pdf_id']=pid
                  if pid in seen:
                      item['error']='page_cycle_detected'; mapping.append(item); break
                  seen.add(pid)
                  pdfurl=f'{base}/consulta/publicacion/pdf/{pid}.pdf?coleccion=&palabras='
                  preq=urllib.request.Request(pdfurl,headers=headers)
                  with urllib.request.urlopen(preq,timeout=90) as pr: pdf=pr.read()
                  if not pdf.startswith(b'%PDF'):
                      item['error']='non_pdf_payload'; mapping.append(item); break
                  (out/f'seq-{seq:03d}-{pid}.pdf').write_bytes(pdf)
                  item['pdf_url']=pdfurl; item['pdf_bytes']=len(pdf)
                  mnext=re.search(r'<a href="([^"]*\?pagina=([0-9a-f]{24})[^\"]*)"[^>]*class="siguienteLink"',text,re.I)
                  if not mnext:
                      item['end_of_sequence']=True; mapping.append(item); break
                  href=html.unescape(mnext.group(1)); item['next_page_id']=mnext.group(2)
                  current_url=urllib.parse.urljoin(base,href)
              except urllib.error.HTTPError as exc:
                  item.update(status=exc.code,error='HTTPError'); mapping.append(item); break
              except Exception as exc:
                  item['error']=repr(exc); mapping.append(item); break
              mapping.append(item); time.sleep(0.15)
          (out/'viewer-map.json').write_text(json.dumps(mapping,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(mapping,ensure_ascii=False,indent=2))
          unique=len({x.get('pdf_id') for x in mapping if x.get('pdf_id')})
          if unique < 8:
              raise SystemExit(f'scientific gate failed: only {unique} unique HNDM pages recovered')

      - name: Render and index recovered pages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          out=el-instructor-primary
          mkdir -p "$out/rendered" "$out/text"
          for f in "$out"/seq-*.pdf; do
            [ -e "$f" ] || continue
            stem=$(basename "$f" .pdf)
            pdftotext -layout "$f" "$out/text/$stem.txt" || true
            pdftoppm -f 1 -l 1 -singlefile -jpeg -r 220 "$f" "$out/rendered/$stem" >/dev/null 2>&1 || true
          done
          python - <<'PY'
          import json,pathlib,re,unicodedata
          out=pathlib.Path('el-instructor-primary')
          terms=['INSTRUCTOR','PROFESOR','MAESTRO','ENSEÑANZA','METOD','PEDAGOG','ESCUELA','LICEO','NIÑAS','PRECIO','SUSCRIP','DIRECTOR','REDACC','ADMINISTR','ALUMN','LECCION','LECCIÓN']
          rows=[]
          for p in sorted((out/'text').glob('*.txt')):
              text=p.read_text(encoding='utf-8',errors='replace')
              norm=unicodedata.normalize('NFD',text.upper()); norm=''.join(c for c in norm if unicodedata.category(c)!='Mn')
              found=[]
              for term in terms:
                  t=unicodedata.normalize('NFD',term.upper()); t=''.join(c for c in t if unicodedata.category(c)!='Mn')
                  if t in norm: found.append(term)
              nums=re.findall(r'(?m)^\s*([0-9]{1,3})\s*$',text)
              rows.append({'file':p.name,'terms':found,'numeric_lines':nums[:12],'snippet':re.sub(r'\s+',' ',text)[:6000]})
          (out/'page-text-summary.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY

      - name: Upload primary review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdhd-el-instructor-1889-primary-review
          path: el-instructor-primary/
          retention-days: 1
